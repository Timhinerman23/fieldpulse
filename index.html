/* ---------------------------------------------------------
   Minimal inline-SVG icon set standing in for lucide-react
   so this file can run with zero build step / zero npm.
   Not pixel-identical to lucide, but same footprint & usage:
   <IconName size={18} className="..." />
   --------------------------------------------------------- */
function makeIcon(paths) {
  return function Icon({ size = 20, className = "", strokeWidth = 2, ...rest }) {
    return (
      <svg
        width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth={strokeWidth}
        strokeLinecap="round" strokeLinejoin="round"
        className={className} {...rest}
      >
        {paths}
      </svg>
    );
  };
}

  if (!link) return [];
  if (Array.isArray(link.fibers)) return link.fibers;
  return link.fiber != null && link.fiber !== "" ? [link.fiber] : [];
};

// Photos are stored as downscaled JPEG data URLs rather than blob: URLs.
// A blob URL only lives as long as the browser session that created it, so
// those photos vanished on reload and couldn't be embedded in exports.
// Downscaling keeps localStorage from filling up on a few site photos.
function readImageAsDataUrl(file, maxDim = 1400, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("Could not read file"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Could not decode image"));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, width, height);
        ctx.drawImage(img, 0, 0, width, height);
        try {
          resolve(canvas.toDataURL("image/jpeg", quality));
        } catch (e) {
          resolve(reader.result); // fall back to the raw data URL
        }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function Sheet({ open, onClose, children, title, scrollKey, hideHeader }) {
  // Slides up from the bottom, full width, keeps the rack visible above.
  // Body scroll is locked while open so the fixed header can never drift
  // out of view on mobile browsers/webviews.
  React.useEffect(() => {
    if (!open) return;
    const prevOverflow = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      document.body.style.overflow = prevOverflow;
    };
  }, [open]);

  // The sheet is hidden via a slide transform, not unmounted, so its
  // scroll container keeps whatever scrollTop it had last time it was
  // open. Force it back to the top every time the sheet opens (or the
  // scrollKey changes while open), instead of relying on remount alone.
  const contentRef = React.useRef(null);
  React.useLayoutEffect(() => {
    if (open && contentRef.current) {
      contentRef.current.scrollTop = 0;
    }
  }, [open, scrollKey]);

  return (
    <>
      <div
        className={`fixed inset-0 bg-black transition-opacity z-30 ${
          open ? "opacity-40 pointer-events-auto" : "opacity-0 pointer-events-none"
        }`}
        onClick={onClose}
      />
      <div
        className={`fixed left-0 right-0 bottom-0 z-40 bg-white rounded-t-2xl shadow-2xl border-t border-gray-200
        transition-transform duration-300 ease-out
        max-h-[85vh] flex flex-col
        ${open ? "translate-y-0" : "translate-y-full"}`}
      >
        {!hideHeader && (
          <div className="bg-white rounded-t-2xl flex items-center justify-between px-5 pt-4 pb-3 border-b border-gray-200">
            <div className="w-10 h-1 bg-gray-300 rounded-full absolute left-1/2 -translate-x-1/2 top-2" />
            <h3 className="font-semibold text-gray-900 text-base mt-2 truncate pr-3">{title}</h3>
            <button onClick={onClose} className="mt-2 p-1.5 rounded-full hover:bg-gray-100 shrink-0">
              <X size={18} className="text-gray-500" />
            </button>
          </div>
        )}
        <div ref={contentRef} key={scrollKey} className="overflow-y-auto px-5 py-4 flex-1">{children}</div>
      </div>
    </>
  );
}

// Connections written before ports carried a kind are ambiguous: a bare
// port number could mean data or SFP. Backfill them as "data", which is
// what they were in practice — the old UI listed SFPs in the same dropdown
// but a bare number always resolved to the first match, a data port.
function migrateConnections(cabinets) {
  if (!Array.isArray(cabinets)) return cabinets;
  return cabinets.map((cab) => ({
    ...cab,
    connections: (cab.connections || []).map((cn) => ({
      ...cn,
      a: { ...cn.a, kind: cn.a?.kind || "data" },
      b: { ...cn.b, kind: cn.b?.kind || "data" },
    })),
  }));
}

// ---------- Image drop zone ----------
// Accepts an image three ways: paste from the clipboard (the fast path when
// you've just taken a Windows screenshot), drag-and-drop, or the file
// browser. Paste is wired to the window while this zone is mounted, so you
// don't have to click into anything first — but it ignores pastes aimed at
// a text field so Ctrl+V still works normally for typing.
const pasteZones = new Set(); // every mounted paste target

// Shared clipboard-image plumbing. Used by ImageDropZone and by the compact
// photo tiles, so every image field in the app accepts a pasted screenshot
// the same way.
//
// Two guards matter here:
//  - Pastes aimed at a text field are ignored, so Ctrl+V still types.
//  - When several targets are mounted, the hovered one wins; otherwise a
//    single paste would land in all of them at once.
function useImagePaste(onFile, hovered) {
  const selfRef = useRef({});

  useEffect(() => {
    const me = selfRef.current;
    pasteZones.add(me);
    return () => { pasteZones.delete(me); };
  }, []);

  useEffect(() => {
    const onPaste = (e) => {
      const t = e.target;
      const tag = t?.tagName?.toLowerCase();
      if (tag === "input" || tag === "textarea" || t?.isContentEditable) return;
      if (pasteZones.size > 1 && !hovered) return;

      const items = e.clipboardData?.items || [];
      for (const item of items) {
        if (item.kind === "file" && item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            onFile(file);
            return;
          }
        }
      }
    };
    window.addEventListener("paste", onPaste);
    return () => window.removeEventListener("paste", onPaste);
  }, [onFile, hovered]);
}

// Handles the read/downscale/report cycle shared by every image field.
function useImageAccept(onChange) {
  const [busy, setBusy] = useState(false);
  const [flash, setFlash] = useState(null);

  const accept = (file) => {
    if (!file || !file.type?.startsWith("image/")) return;
    setBusy(true);
    readImageAsDataUrl(file)
      .then((url) => {
        onChange(url);
        setFlash("Image added");
        setTimeout(() => setFlash(null), 1800);
      })
      .catch(() => alert("Couldn't read that image."))
      .finally(() => setBusy(false));
  };

  return { accept, busy, flash };
}

const PASTE_HINT = "Paste a screenshot (Ctrl+V), drop an image, or browse";

function ImageDropZone({ value, onChange, captureLabel = "Add image", hint = PASTE_HINT, size = 24, showRemove = true }) {

          {busy ? (

      <div className="flex flex-col gap-1.5 items-start min-w-0">

            {captureLabel}

              onClick={() => onChange(null)}

              Remove
            </button>
          )}
        </div>
        <div className="text-[11px] text-gray-400 leading-snug">
          {flash ? <span className="text-green-600 font-medium">{flash}</span> : hint}
        </div>
      </div>

      <input
        ref={inputRef}
        type="file"
        accept="image/*"
        className="hidden"
        onChange={(e) => {
          accept(e.target.files?.[0]);
          e.target.value = "";
        }}
      />
    </div>
  );
}

// ---------- Fiber adapter plate ----------
// Draws a tray adapter plate the way it looks in the rack: coloured body,
// a screw at each end, and LC adapters grouped in duplex pairs. Fibers are
// clickable so each strand can be labelled individually.
const adapterAlignClass = (align) =>
  align === "center" ? "justify-center" : align === "right" ? "justify-end" : "justify-start";

function FiberAdapterFace({ adapter, fiberType, onPortClick, activePort }) {
  // A blank filler plate legitimately has zero adapters, so `|| 12` would
  // be wrong — only fall back when the count is genuinely missing.
  const count = adapter?.count ?? 12;
  // Derived, not read from the record — older saves may carry a row count
  // that no longer corresponds to a real plate.
  const rows = rowsForCount(count);
  const c = adapterColors(fiberType);
  const ports = adapter?.ports || [];

  // An LC adapter is a fixed physical size. It does not stretch to fill the
  // plate and does not change between a 1-row and a 2-row layout — a denser
  // plate is a *bigger* plate with more adapters, not the same adapters
  // squeezed. So the port is a fixed square and the plate sizes to fit.
  const PORT = 8;      // adapter square, px — never scales
  const GAP = 2;       // between the two halves of a duplex pair
  const PAIR_GAP = 5;  // between duplex pairs
  const ROW_GAP = 3;
  // Plates are all the same panel. A 6- or 12-fiber plate is a 24-fiber
  // body with fewer adapters populated, so every plate reserves the same
  // footprint and the adapters sit centred in it. Only a layout that
  // genuinely needs more room than the standard body (24 in a single row)
  // pushes past it.
  const STD_W = 133;   // widest standard layout: 24 fiber over 2 rows
  const STD_H = 19;    // two rows of adapters

  const perRow = Math.ceil(count / rows);
  const rowsOfPorts = Array.from({ length: rows }, (_, r) =>
    Array.from({ length: perRow }, (_, i) => r * perRow + i + 1).filter((n) => n <= count)
  ).filter((r) => r.length);

  const pairsOf = (list) => {
    const out = [];
    for (let i = 0; i < list.length; i += 2) out.push(list.slice(i, i + 2));
    return out;
  };

  const renderFiber = (n) => {
    const p = ports.find((x) => x.n === n) || {};
    const named = !!(p.label || p.destination);
    const isActive = activePort === n;
    return (
      <button
        key={n}
        onClick={onPortClick ? (e) => { e.stopPropagation(); onPortClick(n); } : undefined}
        disabled={!onPortClick}
        title={p.label || p.destination || `Fiber ${n}`}
        style={{
          width: PORT,
          height: PORT,
          background: named ? "#111827" : "#1C1C1F",
          border: "1px solid rgba(0,0,0,0.5)",
        }}
        className={`relative rounded-[1px] shrink-0 ${
          isActive ? "ring-2 ring-orange-400 ring-offset-1 z-10" : ""
        } ${onPortClick ? "cursor-pointer hover:brightness-150" : ""}`}
      >
        {/* Keyed latch on the LC body; turns amber once the fiber is named */}
        <span
          className="absolute rounded-[1px]"
          style={{
            top: 1, left: "50%", transform: "translateX(-50%)",
            width: 4, height: 1.5,
            background: named ? "#F59E0B" : "rgba(255,255,255,0.32)",
          }}
        />
      </button>
    );
  };

  const screw = (
    <span
      className="rounded-full shrink-0"
      style={{ width: 7, height: 7, background: c.screw, boxShadow: "inset 0 0 0 1px rgba(0,0,0,0.4)" }}
    />
  );

  return (
    <div
      className="inline-flex items-center rounded-[3px] px-1.5 py-1 gap-1.5 shrink-0"
      style={{ background: c.body, border: `1px solid ${c.edge}` }}
    >
      {screw}
      <div
        className="flex flex-col items-center justify-center"
        style={{ gap: ROW_GAP, minWidth: STD_W, minHeight: STD_H }}
      >
        {rowsOfPorts.map((rowPorts, ri) => (
          <div key={ri} className="flex items-center justify-center" style={{ gap: PAIR_GAP }}>
            {pairsOf(rowPorts).map((pair, pi) => (
              <div key={pi} className="flex items-center" style={{ gap: GAP }}>
                {pair.map(renderFiber)}
              </div>
            ))}
          </div>
        ))}
      </div>
      {screw}
    </div>
  );
}

// Mini component builder for the adapter plate fitted into a tray slot.
// Mirrors the switch port-layout controls: count, rows, and position.
function AdapterPlateBuilder({
  adapter, fiberType, library, setLibrary, onChange,
  slotOptions = [], currentSlot, targetSlot, onMoveSlot, cabinet,
}) {
  const isBlankPlate = fiberType === "blank";

  const sfpLinkLabel = (link) => {
    const c = (cabinet?.components || []).find((x) => x.id === link.compId);
    return c ? `${c.name} \u00b7 SFP ${link.port}` : "a switch SFP";
  };
  const [editingFiber, setEditingFiber] = useState(null);
  const templates = (library || []).filter((l) => l.type === "fiber_adapter");

  const makePorts = (count, prev = []) =>
    Array.from({ length: count }, (_, i) => prev.find((p) => p.n === i + 1) || { n: i + 1, label: "", destination: "" });

  const patch = (fields) => {
    const base = adapter || { manufacturer: "", model: "", count: 12, rows: 1, align: "center", ports: makePorts(12) };
    const next = { ...base, ...fields };
    if (fields.count !== undefined) {
      next.ports = makePorts(fields.count, base.ports || []);
      // Rows follow the count — nothing to choose, nothing to get wrong.
      next.rows = rowsForCount(fields.count);
    }
    onChange(next);
  };

  if (!adapter) {
    return (
      <div className="border border-dashed border-gray-300 rounded-xl p-4 text-center">
        <div className="text-xs text-gray-500 mb-2">No adapter plate fitted in this slot</div>
        <button
          onClick={() => onChange({ manufacturer: "", model: "", count: 12, rows: 1, align: "center", ports: makePorts(12) })}
          className="text-xs font-semibold border border-gray-300 rounded-lg px-3 py-2 text-gray-700 hover:bg-gray-50"
        >
          + Add adapter plate
        </button>
      </div>
    );
  }

  const activeFiber = editingFiber ? (adapter.ports || []).find((p) => p.n === editingFiber) || {} : null;

  return (
    <div className="border border-gray-200 rounded-xl p-3 space-y-3 mt-1">
      <div className="flex items-center justify-between">
        <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Adapter Plate</div>
        <button
          onClick={() => { onChange(null); setEditingFiber(null); }}
          className="text-[11px] font-medium text-red-600 hover:underline"
        >
          Remove plate
        </button>
      </div>

      {/* Live preview — tap a fiber to label it */}
      {/* Fixed footprint: the plate is the same physical panel whatever the
          fiber count, so only the adapter density changes here. */}
      {/* The plate renders at its true proportions — a 24-fiber plate really
          is wider than a 6. Scrolls rather than shrinking the adapters. */}
      <div className="bg-gray-100 rounded-lg p-3 flex justify-center overflow-x-auto">
        <FiberAdapterFace
          adapter={adapter}
          fiberType={fiberType}
          activePort={editingFiber}
          onPortClick={(n) => setEditingFiber((cur) => (cur === n ? null : n))}
        />
      </div>

      {activeFiber && (
        <div className="border border-orange-200 bg-orange-50 rounded-lg p-3 space-y-2">
          <div className="text-[11px] font-semibold text-orange-800">Fiber {editingFiber}</div>
          {/* Set from the SFP side; shown here so the tray tells the whole
              story without having to open the switch. */}
          {activeFiber.sfpLink && (
            <div className="text-[11px] text-orange-700 flex items-center gap-1.5">
              <Link2 size={11} />
              Patched to {sfpLinkLabel(activeFiber.sfpLink)}
            </div>
          )}
          <input
            className={inputClass}
            value={activeFiber.label || ""}
            placeholder="Label (e.g. Strand 3)"
            onChange={(e) =>
              patch({ ports: (adapter.ports || []).map((p) => (p.n === editingFiber ? { ...p, label: e.target.value } : p)) })
            }
          />
          <input
            className={inputClass}
            value={activeFiber.destination || ""}
            placeholder="Goes to (e.g. 11th Floor MDF)"
            onChange={(e) =>
              patch({ ports: (adapter.ports || []).map((p) => (p.n === editingFiber ? { ...p, destination: e.target.value } : p)) })
            }
          />
          <button onClick={() => setEditingFiber(null)} className="text-[11px] font-medium text-gray-500 hover:underline">
            Done
          </button>
        </div>
      )}

      {templates.length > 0 && (
        <Field label="Model">
          <select
            className={inputClass}
            value={adapter.model || ""}
            onChange={(e) => {
              const tpl = templates.find((t) => t.model === e.target.value);
              if (tpl) patch({ manufacturer: tpl.manufacturer, model: tpl.model, count: tpl.count });
              else patch({ model: e.target.value });
            }}
          >
            <option value="">Custom / not specified</option>
            {templates.map((t) => (
              <option key={t.id} value={t.model}>{t.manufacturer} {t.model} ({t.count}F)</option>
            ))}
          </select>
        </Field>
      )}

      <div className="grid grid-cols-2 gap-3">
        <Field label="Manufacturer">
          <input className={inputClass} value={adapter.manufacturer || ""} onChange={(e) => patch({ manufacturer: e.target.value })} placeholder="e.g. Leviton" />
        </Field>
        <Field label="Model number">
          <input className={inputClass} value={adapter.model || ""} onChange={(e) => patch({ model: e.target.value })} placeholder="e.g. 5F100-2LL" />
        </Field>
      </div>

      {isBlankPlate ? (
        <div className="text-[11px] text-gray-500 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2">
          Blank filler plate &mdash; closes an unused tray slot. No adapters.
        </div>
      ) : (
      <Field label="Fiber count">
        <div className="flex gap-1.5">
          {FIBER_ADAPTER_COUNTS.map((n) => (
            <button
              key={n}
              onClick={() => patch({ count: n })}
              className={`flex-1 px-3 py-1.5 rounded-lg text-xs font-medium border ${
                adapter.count === n ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"
              }`}
            >
              <div>{n} fiber</div>
              <div className={`text-[10px] font-normal ${adapter.count === n ? "text-gray-300" : "text-gray-400"}`}>
                {rowsForCount(n) === 2 ? "2 rows" : "1 row"}
              </div>
            </button>
          ))}
        </div>
      </Field>
      )}

      <div className="grid grid-cols-1 gap-3">
        <Field label="Slot in tray">
          <div className="flex gap-1.5">
            {slotOptions.map((s) => (
              <button
                key={s.n}
                onClick={() => onMoveSlot && onMoveSlot(s.n)}
                title={s.occupied && s.n !== currentSlot ? `Slot ${s.n} already has a plate — they'll swap` : undefined}
                className={`relative flex-1 px-2 py-1.5 rounded-lg text-[11px] font-medium border ${
                  targetSlot === s.n ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"
                }`}
              >
                {s.label}
                {s.occupied && s.n !== currentSlot && (
                  <span className="absolute top-0.5 right-1 w-1.5 h-1.5 rounded-full bg-orange-400" />
                )}
              </button>
            ))}
          </div>
        </Field>
      </div>

      {setLibrary && adapter.manufacturer && adapter.model && !templates.some((t) => t.model === adapter.model) && (
        <button
          onClick={() =>
            setLibrary((prev) => [
              ...prev,
              { id: nextId("lib"), type: "fiber_adapter", manufacturer: adapter.manufacturer, model: adapter.model, count: adapter.count, rows: rowsForCount(adapter.count), align: "center" },
            ])
          }
          className="w-full text-xs font-medium border border-gray-300 rounded-lg py-2 text-gray-600 hover:bg-gray-50"
        >
          Save "{adapter.model}" to library
        </button>
      )}
    </div>
  );
}

// ---------- Quick map ----------
// Field convention: a patch panel sitting above a switch lands on the
// switch's ODD ports, a panel below lands on the EVENS. So a 24-port panel
// above and another below together fill a 48-port switch. Panel port N maps
// to switch port 2N-1 (above) or 2N (below).
const quickMapPairs = (panel, device, cabinet) => {
  const panelAbove = panel.uStart < device.uStart;
  const offset = panelAbove ? -1 : 0; // 2N-1 vs 2N

  const panelPorts = (panel.ports || [])
    .filter((p) => (p.kind || "data") === "data" && !p.absent)
    .sort((a, b) => a.n - b.n);
  const deviceNums = new Set(
    (device.ports || [])
      .filter((p) => (p.kind || "data") === "data" && !p.absent)
      .map((p) => p.n)
  );

  const pairs = [];
  const skipped = { noPort: 0, alreadyMapped: 0 };

  panelPorts.forEach((p, idx) => {
    const target = (idx + 1) * 2 + offset;
    if (!deviceNums.has(target)) { skipped.noPort += 1; return; }
    // Never silently overwrite an existing patch — those were recorded
    // deliberately and are the expensive thing to lose.
    if (findConnection(cabinet, panel.id, p.n, "data") || findConnection(cabinet, device.id, target, "data")) {
      skipped.alreadyMapped += 1;
      return;
    }
    pairs.push({ panelPort: p.n, devicePort: target });
  });

  return { pairs, skipped, panelAbove };
};

// ---------- PDU ----------
// A rack power strip. Outlets live in the same `ports` array as everything
// else, tagged kind "front" or "rear", so port-kind-aware helpers, exports,
// and search all keep working without special cases.
const pduBank = (comp, kind) => (comp.ports || []).filter((p) => p.kind === kind);
const pduAlignClass = (align) =>
  align === "center" ? "justify-center" : align === "right" ? "justify-end" : "justify-start";

function PduRow({ comp, mode, onOutletClick, onOutletHover, onSelect }) {
  // A real strip only shows one face at a time, so the row does too —
  // showing both at once doubled the row height and misrepresented what
  // you'd actually be looking at in the closet.
  const [face, setFace] = useState("front");
  const front = pduBank(comp, "front");
  const rear = pduBank(comp, "rear");
  const layout = comp.pduLayout || {};
  // If a face has no outlets, don't strand the user on a blank view.
  const showing = face === "rear" && rear.length ? "rear" : front.length ? "front" : rear.length ? "rear" : "front";
  const canFlip = front.length > 0 && rear.length > 0;
  const suppressHover = mode === "active" || mode === "poe" || mode === "map" || mode === "unmap" || mode === "jacks" || mode === "quickmap" || mode === "copy";

  const renderOutlet = (p) => {
    const named = !!(p.label || p.device);
    return (
      <button
        key={`${p.kind}-${p.n}`}
        onClick={(e) => { e.stopPropagation(); onOutletClick(comp, p); }}
        onMouseEnter={(e) => {
          if (suppressHover || !onOutletHover) return;
          const r = e.currentTarget.getBoundingClientRect();
          onOutletHover({
            x: r.left + r.width / 2,
            y: r.top,
            title: `${comp.name} \u00b7 ${p.kind === "rear" ? "Rear" : "Front"} outlet ${p.n}`,
            connLabel: "Plugged in",
            connText: p.device || p.label || "Nothing",
            ...(p.notes ? { device: p.notes } : {}),
          });
        }}
        onMouseLeave={() => onOutletHover && onOutletHover(null)}
        title={p.device || p.label || `Outlet ${p.n}`}
        className={`relative w-6 h-6 rounded-sm border flex items-center justify-center shrink-0 transition-colors ${
          named
            ? "bg-amber-400 border-amber-600 hover:bg-amber-300"
            : "bg-gray-700 border-gray-900 hover:border-orange-400"
        }`}
      >
        {/* NEMA 5-15R face: two slots and a ground pin. */}
        <svg width="12" height="12" viewBox="0 0 12 12">
          <rect x="2.4" y="2" width="1.5" height="4" rx="0.5" fill={named ? "#78350F" : "#D4D4D8"} />
          <rect x="8.1" y="2" width="1.5" height="4" rx="0.5" fill={named ? "#78350F" : "#D4D4D8"} />
          <path d="M4.6 8.2 A2 2 0 0 1 7.4 8.2 Z" fill={named ? "#78350F" : "#D4D4D8"} />
        </svg>
        <span className={`absolute -top-0.5 left-0.5 text-[7px] font-bold leading-none ${named ? "text-amber-900" : "text-gray-400"}`}>
          {p.n}
        </span>
      </button>
    );
  };

  // Digital ammeter found on metered strips. Drawn rather than photographed
  // so it scales with the rack and prints cleanly.
  const meter = (
    <div className="flex flex-col items-center bg-black rounded-sm border border-gray-900 px-1.5 py-0.5 shrink-0">
      <span
        className="text-[11px] font-bold leading-none tracking-tight text-green-400"
        style={{ fontFamily: "'Courier New', monospace" }}
      >
        {comp.pduAmps || "0.0"}
      </span>
      <span className="text-[6px] font-bold uppercase text-gray-400 leading-none mt-0.5">Amps</span>
    </div>
  );

  const bank = (list, align, label, showMeter) => {
    const meterPos = (comp.pduLayout || {}).meter || "none";
    const hasMeter = showMeter && meterPos !== "none";
    if (!list.length && !hasMeter) return null;
    // The meter sits on the faceplate itself, not among the outlets — so it
    // anchors to the edge of the row and the outlet alignment applies only
    // to the outlets. Previously it lived inside the outlet group and got
    // dragged toward the middle along with them.
    return (
      <div className="flex items-center gap-2 w-full">
        <span className="text-[8px] font-bold uppercase text-gray-400 shrink-0">{label}</span>
        {hasMeter && meterPos === "left" && meter}
        <div className={`flex items-center flex-1 min-w-0 ${pduAlignClass(align)}`}>
          <div className="flex items-center gap-1.5 bg-black/20 rounded p-1 min-w-0 overflow-x-auto">
            {list.map(renderOutlet)}
          </div>
        </div>
        {hasMeter && meterPos === "right" && meter}
      </div>
    );
  };

  return (
    <div
      onClick={onSelect}
      className="w-full bg-gray-800 px-2 py-1.5 flex flex-col gap-1 cursor-pointer hover:ring-2 hover:ring-inset hover:ring-orange-400"
    >
      <div className="flex items-center gap-2 min-w-0">
        <Zap size={12} className="text-amber-400 shrink-0" />
        <span className="text-[11px] font-semibold text-white truncate">{comp.name}</span>
        <span className="ml-auto flex items-center gap-2 shrink-0">
          <span className="text-[10px] text-gray-400">
            {showing === "rear" ? `Back \u00b7 ${rear.length}` : `Front \u00b7 ${front.length}`} outlets
          </span>
          {canFlip && (
            <button
              onClick={(e) => { e.stopPropagation(); setFace(showing === "front" ? "rear" : "front"); }}
              title={showing === "front" ? "Show back of PDU" : "Show front of PDU"}
              className="flex items-center gap-1 text-[10px] font-semibold text-gray-300 hover:text-white bg-white/10 hover:bg-white/20 rounded px-1.5 py-1"
            >
              <Flip size={11} />
              {showing === "front" ? "Back" : "Front"}
            </button>
          )}
        </span>
      </div>
      {showing === "front"
        ? bank(front, layout.frontAlign, "F", true)
        : bank(rear, layout.rearAlign, "R", false)}
    </div>
  );
}

// Editor for a single PDU outlet. Deliberately smaller than PortEditor —
// an outlet only needs to record what's plugged into it.
function OutletEditor({ comp, outlet, onClose, onSave }) {
  const [device, setDevice] = useState(outlet.device || "");
  const [label, setLabel] = useState(outlet.label || "");
  const [notes, setNotes] = useState(outlet.notes || "");

  if (!comp) return null;
  const face = outlet.kind === "rear" ? "Rear" : "Front";

  return (
    <Sheet open={true} onClose={onClose} title={`${face} outlet ${outlet.n}`}>
      <div className="text-xs text-gray-500 -mt-2 mb-1">{comp.name}</div>

      <Field label="What's plugged in">
        <input
          className={inputClass}
          value={device}
          onChange={(e) => setDevice(e.target.value)}
          placeholder="e.g. Switch.01, UPS, Camera injector"
          autoFocus
        />
      </Field>

      <Field label="Circuit / label">
        <input
          className={inputClass}
          value={label}
          onChange={(e) => setLabel(e.target.value)}
          placeholder="e.g. Circuit A, Panel LP-1"
        />
      </Field>

      <Field label="Notes">
        <textarea
          className={`${inputClass} h-20 resize-none`}
          value={notes}
          onChange={(e) => setNotes(e.target.value)}
          placeholder="Anything worth remembering about this outlet"
        />
      </Field>

      <div className="flex gap-2 mt-4">
        {(device || label || notes) && (
          <button
            onClick={() => onSave({ device: "", label: "", notes: "" })}
            className="flex-1 py-2.5 rounded-lg border border-gray-300 text-sm font-medium text-red-600 hover:bg-red-50"
          >
            Clear
          </button>
        )}
        <button
          onClick={() => onSave({ device, label, notes })}
          className="flex-1 py-2.5 rounded-lg bg-orange-500 text-white text-sm font-semibold hover:bg-orange-600"
        >
          Save
        </button>
      </div>
    </Sheet>
  );
}

// ---------- Cato socket ----------
// Mirrors the physical faceplate: console pair, two combo ports where an SFP
// cage and an RJ45 share a port number, two SFP-only ports, then four
// copper ports, and the DC input.
//
// The combo ports are the reason this needs its own renderer: port 1 exists
// as BOTH a data port and an SFP port. The connection model is already
// kind-aware, so data-1 and sfp-1 stay distinct links even though the label
// above them is a single "1 (WAN)".
const CATO_COPPER = [1, 2, 5, 6, 7, 8];
const CATO_SFP = [1, 2, 3, 4];

function CatoRow({ comp, cabinet, mode, mapSelection, onPortClick, onPortHover, onSelect }) {
  const suppressHover =
    mode === "active" || mode === "poe" || mode === "map" || mode === "unmap" ||
    mode === "jacks" || mode === "quickmap" || mode === "copy";

  const findPort = (n, kind) => (comp.ports || []).find((p) => p.n === n && (p.kind || "data") === kind);

  const hoverFor = (p, kind, e) => {
    if (suppressHover || !onPortHover) return;
    const r = e.currentTarget.getBoundingClientRect();
    const conn = findConnection(cabinet, comp.id, p.n, kind);
    let connText = "Not connected";
    if (conn) {
      const other = otherEnd(conn, comp.id, p.n, kind);
      const oc = cabinet.components.find((c) => c.id === other.compId);
      connText = oc ? `${oc.name} \u00b7 Port ${other.port}` : "Connected";
    } else if (p.destination) connText = p.destination;
    onPortHover({
      x: r.left + r.width / 2, y: r.top,
      title: `${comp.name} \u00b7 ${kind === "sfp" ? "SFP" : "Port"} ${p.n}`,
      connText, vlan: p.vlan || "\u2014", device: p.device || "\u2014",
    });
  };

  // RJ45: taller than wide with the latch notch on top.
  const rj45 = (n) => {
    const p = findPort(n, "data");
    if (!p) return null;
    const conn = findConnection(cabinet, comp.id, n, "data");
    const pending = mapSelection && mapSelection.compId === comp.id && mapSelection.port === n && mapSelection.kind === "data";
    const active = p.isActive;
    return (
      <button
        key={`d${n}`}
        onClick={(e) => { e.stopPropagation(); onPortClick(comp, p); }}
        onMouseEnter={(e) => hoverFor(p, "data", e)}
        onMouseLeave={() => onPortHover && onPortHover(null)}
        title={`Port ${n}`}
        className="relative shrink-0 rounded-[1px] flex items-end justify-center"
        style={{
          width: 17, height: 15,
          background: pending ? "#F97316" : active ? "#166534" : conn ? "#3F3F46" : "#27272A",
          border: "1px solid rgba(0,0,0,0.55)",
        }}
      >
        <span className="absolute rounded-[1px]" style={{ top: -1, left: "50%", transform: "translateX(-50%)", width: 6, height: 3, background: "#18181B" }} />
        <span className="absolute" style={{ bottom: 1, left: 2, width: 3, height: 3, borderRadius: 1, background: active ? "#22C55E" : "#3F3F46" }} />
        <span className="absolute" style={{ bottom: 1, right: 2, width: 3, height: 3, borderRadius: 1, background: conn ? "#F59E0B" : "#3F3F46" }} />
      </button>
    );
  };

  // SFP cage: wider, shallower, with the bale-clasp slot.
  const sfp = (n) => {
    const p = findPort(n, "sfp");
    if (!p) return null;
    const conn = findConnection(cabinet, comp.id, n, "sfp");
    const pending = mapSelection && mapSelection.compId === comp.id && mapSelection.port === n && mapSelection.kind === "sfp";
    const bg = p.fiberType ? fiberColor(p.fiberType) : null;
    return (
      <button
        key={`s${n}`}
        onClick={(e) => { e.stopPropagation(); onPortClick(comp, p); }}
        onMouseEnter={(e) => hoverFor(p, "sfp", e)}
        onMouseLeave={() => onPortHover && onPortHover(null)}
        title={`SFP ${n}`}
        className="relative shrink-0 rounded-[1px]"
        style={{
          width: 21, height: 13,
          background: pending ? "#F97316" : bg || (conn || p.destination ? "#3F3F46" : "#27272A"),
          border: "1px solid rgba(0,0,0,0.55)",
        }}
      >
        <span className="absolute rounded-[1px]" style={{ top: 2, left: 2, right: 2, height: 4, background: "rgba(0,0,0,0.55)" }} />
        {p.isActive && (
          <span className="absolute" style={{ bottom: 1, right: 1.5, width: 3, height: 3, borderRadius: 999, background: "#22C55E" }} />
        )}
      </button>
    );
  };

  const label = (text) => (
    <div className="text-[6px] font-bold tracking-wide text-center leading-none" style={{ color: "#2F7A6B" }}>{text}</div>
  );

  return (
    <div
      onClick={onSelect}
      style={{ height: `${comp.uHeight * U_HEIGHT_PX}px` }}
      className="w-full flex items-center gap-2 px-3 bg-white cursor-pointer hover:ring-2 hover:ring-inset hover:ring-orange-300 overflow-x-auto"
    >
      <div className="text-[10px] font-semibold text-gray-700 shrink-0 mr-1 truncate max-w-[110px]">{comp.name}</div>

      {/* Console: micro-USB over an RJ45, both non-networked */}
      <div className="flex flex-col items-center gap-0.5 shrink-0">
        {label("CONSOLE")}
        <div className="flex items-center gap-1">
          <span className="rounded-[1px]" style={{ width: 11, height: 5, background: "#27272A", border: "1px solid rgba(0,0,0,0.5)" }} />
          <span className="rounded-[1px]" style={{ width: 15, height: 13, background: "#27272A", border: "1px solid rgba(0,0,0,0.5)" }} />
        </div>
      </div>

      <span className="w-px h-6 bg-gray-200 shrink-0" />

      {/* Port 1 (WAN) — SFP left, copper right, as on the faceplate */}
      <div className="flex flex-col items-center gap-0.5 shrink-0">
        {label("1 (WAN)")}
        <div className="flex items-end gap-1">{sfp(1)}{rj45(1)}</div>
        {label("COMBO")}
      </div>

      {/* Port 2 — mirrored: copper left, SFP right */}
      <div className="flex flex-col items-center gap-0.5 shrink-0">
        {label("2")}
        <div className="flex items-end gap-1">{rj45(2)}{sfp(2)}</div>
        {label("COMBO")}
      </div>

      <span className="w-px h-6 bg-gray-200 shrink-0" />

      {/* SFP-only ports */}
      {[3, 4].map((n) => (
        <div key={n} className="flex flex-col items-center gap-0.5 shrink-0">
          {label(String(n))}
          {sfp(n)}
        </div>
      ))}

      <span className="w-px h-6 bg-gray-200 shrink-0" />

      {/* Copper ports */}
      {[5, 6, 7, 8].map((n) => (
        <div key={n} className="flex flex-col items-center gap-0.5 shrink-0">
          {label(String(n))}
          {rj45(n)}
        </div>
      ))}

      <span className="w-px h-6 bg-gray-200 shrink-0" />

      {/* DC input */}
      <div className="flex flex-col items-center gap-0.5 shrink-0">
        {label("12 VDC")}
        <span className="rounded-full" style={{ width: 13, height: 13, background: "#D4D4D8", border: "2px solid #71717A" }} />
      </div>
    </div>
  );
}

// ---------- Name plate ----------
// A 1U branded blanking plate. Drawn as SVG rather than stored as a photo so
// it stays crisp at any zoom, prints cleanly in the PDF, and re-colours for
// other companies without needing new artwork.
const PLATE_THEMES = {
  radein: { bg: "#FFFFFF", accent: "#B4D335", swoosh: "#5A6068", text: "#5A6068", label: "RADEIN" },
  slate: { bg: "#FFFFFF", accent: "#64748B", swoosh: "#334155", text: "#334155", label: "" },
  orange: { bg: "#FFFFFF", accent: "#F97316", swoosh: "#57534E", text: "#57534E", label: "" },
  dark: { bg: "#1F2937", accent: "#B4D335", swoosh: "#4B5563", text: "#F9FAFB", label: "" },
};

function NamePlateFace({ comp, height = 34 }) {
  const theme = PLATE_THEMES[comp.plateTheme || "radein"] || PLATE_THEMES.radein;
  const text = (comp.plateText ?? theme.label ?? "").trim();
  // Long names need to shrink to stay inside the plate.
  const fontSize = text.length > 22 ? 15 : text.length > 14 ? 19 : 24;

  return (
    <svg
      viewBox="0 0 600 44"
      preserveAspectRatio="none"
      style={{ height: `${height}px` }}
      className="w-full block rounded-sm"
    >
      <rect x="0" y="0" width="600" height="44" fill={theme.bg} />

      {/* Lower-left green sweep */}
      <path d="M0 30 C 90 44, 170 40, 250 26 C 300 17, 340 14, 380 16 L 380 44 L 0 44 Z" fill={theme.accent} opacity="0.95" />
      {/* Upper-right green sweep */}
      <path d="M600 4 C 520 2, 460 10, 410 22 C 470 20, 540 22, 600 26 Z" fill={theme.accent} opacity="0.9" />
      {/* Dark ribbon threading across */}
      <path d="M0 26 C 110 40, 200 33, 300 20 C 400 7, 500 4, 600 8 L 600 13 C 500 9, 405 12, 310 25 C 205 39, 110 45, 0 31 Z" fill={theme.swoosh} opacity="0.9" />
      {/* Faint secondary sweep for depth */}
      <path d="M600 34 C 520 30, 450 32, 400 38 L 600 40 Z" fill={theme.swoosh} opacity="0.25" />

      {text && (
        <text
          x="300" y="29"
          textAnchor="middle"
          fontFamily="Georgia, 'Times New Roman', serif"
          fontSize={fontSize}
          letterSpacing="1.5"
          fill={theme.text}
          style={{ fontVariant: "small-caps" }}
        >
          {text}
        </text>
      )}

      {/* Rack-ear screw holes, top and bottom on each side */}
      {[10, 590].map((cx) =>
        [9, 35].map((cy) => (
          <g key={`${cx}-${cy}`}>
            <circle cx={cx} cy={cy} r="4" fill="#3F3F46" />
            <circle cx={cx} cy={cy} r="1.6" fill="#71717A" />
          </g>
        ))
      )}
    </svg>
  );
}

function NamePlateRow({ comp, onSelect }) {
  return (
    <button
      onClick={onSelect}
      title={comp.name}
      className="w-full block px-1 py-1 bg-gray-900/90 hover:ring-2 hover:ring-orange-400 rounded-sm"
    >
      <NamePlateFace comp={comp} />
    </button>
  );
}

// ---------- Image lightbox ----------
// Photos are small thumbnails everywhere, which is useless when you're
// trying to read a serial off a rack shot. Any image can be opened full
// screen. A module-level opener avoids threading a callback through every
// component that happens to render a photo.
let lightboxOpener = null;
const openImageLightbox = (src, caption) => {
  if (src && lightboxOpener) lightboxOpener({ src, caption });
};

// Spread onto any <img> to make it open full screen on click.
const zoomable = (src, caption) => ({
  onClick: (e) => { e.stopPropagation(); e.preventDefault(); openImageLightbox(src, caption); },
  style: { cursor: "zoom-in" },
  title: "Click to view full screen",
});

function ImageLightbox({ shot, onClose }) {
  const [scale, setScale] = useState(1);
  const [offset, setOffset] = useState({ x: 0, y: 0 });
  const dragRef = useRef(null);
  const pinchRef = useRef(null);

  const MIN = 1, MAX = 8;
  const clamp = (v) => Math.min(MAX, Math.max(MIN, v));
  const reset = () => { setScale(1); setOffset({ x: 0, y: 0 }); };

  // Zoom toward a point rather than the centre, so the detail under the
  // cursor stays put as it grows — otherwise you zoom in and lose the thing
  // you were looking at.
  const zoomAt = (clientX, clientY, factor, rect) => {
    setScale((prev) => {
      const next = clamp(prev * factor);
      if (next === prev) return prev;
      const cx = clientX - rect.left - rect.width / 2;
      const cy = clientY - rect.top - rect.height / 2;
      const ratio = next / prev;
      setOffset((o) => ({
        x: cx - (cx - o.x) * ratio,
        y: cy - (cy - o.y) * ratio,
      }));
      return next;
    });
  };

  useEffect(() => {
    if (!shot) return;
    reset();
    const onKey = (e) => {
      if (e.key === "Escape") onClose();
      if (e.key === "+" || e.key === "=") setScale((s) => clamp(s * 1.3));
      if (e.key === "-" || e.key === "_") setScale((s) => clamp(s / 1.3));
      if (e.key === "0") reset();
    };
    window.addEventListener("keydown", onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = "hidden";
    return () => {
      window.removeEventListener("keydown", onKey);
      document.body.style.overflow = prev;
    };
  }, [shot, onClose]);

  if (!shot) return null;

  const zoomed = scale > 1;

  const onPointerDown = (e) => {
    if (!zoomed) return;
    dragRef.current = { x: e.clientX - offset.x, y: e.clientY - offset.y };
    e.currentTarget.setPointerCapture?.(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragRef.current) return;
    setOffset({ x: e.clientX - dragRef.current.x, y: e.clientY - dragRef.current.y });
  };
  const endDrag = () => { dragRef.current = null; };

  // Two-finger pinch on touch devices.
  const onTouchStart = (e) => {
    if (e.touches.length !== 2) return;
    const [a, b] = e.touches;
    pinchRef.current = { dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), scale };
  };
  const onTouchMove = (e) => {
    if (e.touches.length !== 2 || !pinchRef.current) return;
    e.preventDefault();
    const [a, b] = e.touches;
    const dist = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    setScale(clamp(pinchRef.current.scale * (dist / pinchRef.current.dist)));
  };
  const onTouchEnd = () => { pinchRef.current = null; };

  const btn = "bg-white/10 hover:bg-white/20 text-white/80 hover:text-white rounded-md w-9 h-9 flex items-center justify-center text-sm font-bold";

  return (
    <div className="fixed inset-0 z-[200] bg-black/90 flex flex-col items-center justify-center p-4">
      {/* Backdrop closes, but only where the image isn't — clicking the
          photo itself while panning shouldn't dismiss it. */}
      <div className="absolute inset-0" onClick={onClose} />

      <div className="absolute top-4 right-4 flex items-center gap-2 z-10">
        <button onClick={() => setScale((s) => clamp(s / 1.4))} className={btn} title="Zoom out (-)">&minus;</button>
        <button onClick={() => setScale((s) => clamp(s * 1.4))} className={btn} title="Zoom in (+)">+</button>
        <button onClick={reset} className={`${btn} text-[10px] font-semibold`} title="Reset (0)">1:1</button>
        <button onClick={onClose} className={btn} title="Close (Esc)"><X size={18} /></button>
      </div>

      {zoomed && (
        <div className="absolute top-4 left-4 z-10 text-white/70 text-xs bg-white/10 rounded-md px-2 py-1">
          {Math.round(scale * 100)}%
        </div>
      )}

      <div
        className="relative max-w-full max-h-[85vh] overflow-hidden rounded-lg"
        onWheel={(e) => {
          e.preventDefault();
          zoomAt(e.clientX, e.clientY, e.deltaY < 0 ? 1.15 : 1 / 1.15, e.currentTarget.getBoundingClientRect());
        }}
        onDoubleClick={(e) => {
          if (zoomed) reset();
          else zoomAt(e.clientX, e.clientY, 3, e.currentTarget.getBoundingClientRect());
        }}
        onPointerDown={onPointerDown}
        onPointerMove={onPointerMove}
        onPointerUp={endDrag}
        onPointerCancel={endDrag}
        onTouchStart={onTouchStart}
        onTouchMove={onTouchMove}
        onTouchEnd={onTouchEnd}
        style={{ cursor: zoomed ? (dragRef.current ? "grabbing" : "grab") : "zoom-in", touchAction: "none" }}
      >
        <img
          src={shot.src}
          alt={shot.caption || ""}
          draggable={false}
          onClick={(e) => e.stopPropagation()}
          className="max-w-full max-h-[85vh] object-contain select-none block"
          style={{
            transform: `translate(${offset.x}px, ${offset.y}px) scale(${scale})`,
            transition: dragRef.current ? "none" : "transform 120ms ease-out",
          }}
        />
      </div>

      {shot.caption && (
        <div className="text-white/70 text-sm mt-3 text-center relative z-10 pointer-events-none">{shot.caption}</div>
      )}
      <div className="text-white/40 text-[11px] mt-1 relative z-10 pointer-events-none">
        Scroll or pinch to zoom &middot; double-click to zoom in &middot; drag to pan &middot; Esc to close
      </div>
    </div>
  );
}

// ---------- Excel import ----------
// Accepts a spreadsheet of sites and/or contacts. Column names are matched
// loosely (case, spaces and punctuation ignored) because real customer
// sheets never use the exact headers you ask for.
const normHeader = (h) => String(h || "").toLowerCase().replace(/[^a-z0-9]/g, "");

const COLUMN_ALIASES = {
  name: ["site", "sitename", "name", "location", "locationname"],
  code: ["code", "sitecode", "locationid", "locid", "siteid", "id"],
  address: ["address", "street", "streetaddress", "address1", "addressline1"],
  city: ["city", "town"],
  state: ["state", "province", "st", "region"],
  zip: ["zip", "zipcode", "postal", "postalcode", "postcode"],
  client: ["client", "customer", "account", "company", "clientname"],
  building: ["building", "buildingname", "bldg"],
  contactName: ["contact", "contactname", "person", "attn"],
  contactRole: ["role", "title", "position", "jobtitle"],
  contactPhone: ["phone", "phonenumber", "tel", "telephone", "mobile", "cell"],
  contactEmail: ["email", "emailaddress", "mail", "e-mail"],
};

// Builds header index -> field name from whatever the sheet actually uses.
function mapColumns(headerRow) {
  const map = {};
  headerRow.forEach((raw, i) => {
    const h = normHeader(raw);
    if (!h) return;
    for (const [field, aliases] of Object.entries(COLUMN_ALIASES)) {
      if (aliases.includes(h)) { map[i] = field; return; }
    }
  });
  return map;
}

function parseImportWorkbook(arrayBuffer) {
  const wb = XLSX.read(arrayBuffer, { type: "array" });
  const rowsOut = [];
  const sheetsSeen = [];

  wb.SheetNames.forEach((sheetName) => {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, blankrows: false });
    if (!rows.length) return;

    // The header isn't always row 1 — customer sheets often carry a title
    // or blank rows above it. Take the first row that maps at least two
    // known columns.
    let headerIdx = -1, colMap = {};
    for (let i = 0; i < Math.min(rows.length, 10); i++) {
      const m = mapColumns(rows[i] || []);
      if (Object.keys(m).length >= 2) { headerIdx = i; colMap = m; break; }
    }
    if (headerIdx === -1) return;

    sheetsSeen.push(sheetName);
    for (let r = headerIdx + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const rec = {};
      Object.entries(colMap).forEach(([idx, field]) => {
        const v = row[idx];
        if (v !== undefined && v !== null && String(v).trim() !== "") rec[field] = String(v).trim();
      });
      if (Object.keys(rec).length) rowsOut.push(rec);
    }
  });

  return { rows: rowsOut, sheets: sheetsSeen };
}

// Turns parsed rows into site/contact records, merging rows that share a
// site so a sheet with one row per contact doesn't create duplicate sites.
function buildImportPlan(rows, existingSites, existingClients, userId) {
  const siteKey = (r) => (r.code || r.name || "").trim().toLowerCase();
  const planned = new Map();
  const skipped = [];

  rows.forEach((r) => {
    const key = siteKey(r);
    if (!key) { skipped.push(r); return; }

    if (!planned.has(key)) {
      const existing = existingSites.find(
        (s) => (s.code || "").trim().toLowerCase() === key || (s.name || "").trim().toLowerCase() === key
      );
      planned.set(key, {
        key,
        existingId: existing?.id || null,
        name: r.name || existing?.name || r.code || "Untitled Site",
        code: r.code || existing?.code || "",
        address: r.address || "", city: r.city || "", state: r.state || "", zip: r.zip || "",
        clientName: r.client || "",
        buildings: [],
        contacts: [],
      });
    }
    const p = planned.get(key);
    // Later rows fill in blanks without clobbering values already set.
    ["name", "code", "address", "city", "state", "zip"].forEach((f) => {
      if (!p[f] && r[f]) p[f] = r[f];
    });
    if (!p.clientName && r.client) p.clientName = r.client;
    if (r.building && !p.buildings.includes(r.building)) p.buildings.push(r.building);
    if (r.contactName || r.contactEmail || r.contactPhone) {
      p.contacts.push({
        name: r.contactName || "(unnamed)",
        role: r.contactRole || "",
        phone: r.contactPhone || "",
        email: r.contactEmail || "",
      });
    }
  });

  const plan = [...planned.values()];
  return {
    plan,
    skipped: skipped.length,
    newSites: plan.filter((p) => !p.existingId).length,
    updatedSites: plan.filter((p) => p.existingId).length,
    contacts: plan.reduce((n, p) => n + p.contacts.length, 0),
    newClients: [...new Set(plan.map((p) => p.clientName).filter(Boolean))].filter(
      (cn) => !existingClients.some((c) => c.name.trim().toLowerCase() === cn.trim().toLowerCase())
    ),
  };
}

// Preview before committing. An import that silently creates or edits
// records is hard to undo, so it always shows exactly what it will do.
function ExcelImportSheet({ sites, clients, currentUserId, onClose, onApply }) {
  const inputRef = useRef(null);
  const [result, setResult] = useState(null);
  const [error, setError] = useState(null);
  const [busy, setBusy] = useState(false);

  const handleFile = async (file) => {
    if (!file) return;
    setBusy(true); setError(null); setResult(null);
    try {
      const buf = await file.arrayBuffer();
      const { rows, sheets } = parseImportWorkbook(buf);
      if (!rows.length) {
        setError(
          "No recognizable columns found. The sheet needs a header row with at least two of: " +
          "Site, Code, Address, City, State, Zip, Client, Building, Contact, Role, Phone, Email."
        );
      } else {
        setResult({ ...buildImportPlan(rows, sites, clients, currentUserId), rowCount: rows.length, sheets, fileName: file.name });
      }
    } catch (e) {
      setError(e?.message || "Could not read that file.");
    } finally {
      setBusy(false);
    }
  };

  return (
    <Sheet open={true} onClose={onClose} title="Import from Excel">
      <input
        ref={inputRef}
        type="file"
        accept=".xlsx,.xls,.csv"
        className="hidden"
        onChange={(e) => { handleFile(e.target.files?.[0]); e.target.value = ""; }}
      />

      {!result && (
        <>
          <p className="text-sm text-gray-600 mb-3">
            Import sites and contacts from a spreadsheet. Column names are matched loosely,
            so <span className="font-medium">Location Name</span>, <span className="font-medium">Site</span> and{" "}
            <span className="font-medium">Site Name</span> all work.
          </p>
          <div className="border border-gray-200 rounded-xl p-3 mb-3">
            <div className="text-[11px] font-semibold text-gray-400 uppercase tracking-wide mb-2">Recognized columns</div>
            <div className="text-[11px] text-gray-600 leading-relaxed">
              <div><span className="font-semibold">Site:</span> Site / Location Name, Code / Location ID, Address, City, State, Zip, Client, Building</div>
              <div className="mt-1"><span className="font-semibold">Contact:</span> Contact Name, Role / Title, Phone, Email</div>
            </div>
            <div className="text-[11px] text-gray-400 mt-2">
              One row per contact is fine — rows sharing a site code are merged into one site.
            </div>
          </div>
          <button
            onClick={() => inputRef.current?.click()}
            disabled={busy}
            className="w-full py-3 rounded-lg bg-orange-500 text-white text-sm font-semibold hover:bg-orange-600 disabled:opacity-60"
          >
            {busy ? "Reading..." : "Choose spreadsheet"}
          </button>
        </>
      )}

      {error && (
        <div className="mt-3 text-xs bg-red-50 border border-red-200 text-red-700 rounded-lg p-3 leading-relaxed">
          {error}
        </div>
      )}

      {result && (
        <>
          <div className="text-xs text-gray-500 mb-2">
            {result.fileName} &middot; {result.rowCount} row{result.rowCount === 1 ? "" : "s"} read
            {result.sheets.length > 1 ? ` from ${result.sheets.length} sheets` : ""}
          </div>

          <div className="grid grid-cols-3 gap-2 mb-3">
            {[
              { n: result.newSites, label: "New sites", color: "text-green-700 bg-green-50 border-green-200" },
              { n: result.updatedSites, label: "Existing updated", color: "text-blue-700 bg-blue-50 border-blue-200" },
              { n: result.contacts, label: "Contacts", color: "text-gray-700 bg-gray-50 border-gray-200" },
            ].map((s) => (
              <div key={s.label} className={`border rounded-lg p-2 text-center ${s.color}`}>
                <div className="text-lg font-bold leading-none">{s.n}</div>
                <div className="text-[10px] mt-1">{s.label}</div>
              </div>
            ))}
          </div>

          {result.newClients.length > 0 && (
            <div className="text-[11px] bg-amber-50 border border-amber-200 text-amber-800 rounded-lg px-3 py-2 mb-3">
              Will also create {result.newClients.length} client
              {result.newClients.length === 1 ? "" : "s"}: {result.newClients.join(", ")}
            </div>
          )}
          {result.skipped > 0 && (
            <div className="text-[11px] bg-gray-50 border border-gray-200 text-gray-600 rounded-lg px-3 py-2 mb-3">
              Skipping {result.skipped} row{result.skipped === 1 ? "" : "s"} with no site name or code.
            </div>
          )}

          <div className="border border-gray-200 rounded-xl divide-y divide-gray-100 max-h-64 overflow-y-auto mb-3">
            {result.plan.map((p) => (
              <div key={p.key} className="px-3 py-2">
                <div className="flex items-center gap-2">
                  <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded ${p.existingId ? "bg-blue-100 text-blue-700" : "bg-green-100 text-green-700"}`}>
                    {p.existingId ? "UPDATE" : "NEW"}
                  </span>
                  <span className="text-sm font-semibold text-gray-900 truncate">{p.name}</span>
                  {p.code && <span className="text-[10px] font-mono text-gray-400">{p.code}</span>}
                </div>
                <div className="text-[11px] text-gray-500 mt-0.5 truncate">
                  {[p.address, p.city, p.state, p.zip].filter(Boolean).join(", ") || "No address"}
                  {p.contacts.length ? ` \u00b7 ${p.contacts.length} contact${p.contacts.length === 1 ? "" : "s"}` : ""}
                  {p.buildings.length ? ` \u00b7 ${p.buildings.length} building${p.buildings.length === 1 ? "" : "s"}` : ""}
                </div>
              </div>
            ))}
          </div>

          <div className="flex gap-2">
            <button
              onClick={() => { setResult(null); setError(null); }}
              className="flex-1 py-2.5 rounded-lg border border-gray-300 text-sm font-medium text-gray-600 hover:bg-gray-50"
            >
              Choose another file
            </button>
            <button
              onClick={() => onApply(result)}
              className="flex-1 py-2.5 rounded-lg bg-orange-500 text-white text-sm font-semibold hover:bg-orange-600"
            >
              Import {result.plan.length} site{result.plan.length === 1 ? "" : "s"}
            </button>
          </div>
        </>
      )}
    </Sheet>
  );
}

// ---------- Data prints / reference files ----------
// Floor plans, riser diagrams, as-builts — the drawings a tech needs to
// reference on site. Stored as data URLs in the same database as everything
// else, so they're available offline in a closet with no signal.
const PRINT_SIZE_WARN = 8 * 1024 * 1024; // per-file nag threshold

const readFileAsDataUrl = (file) =>
  new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onerror = () => reject(new Error("Could not read file"));
    r.onload = () => resolve(r.result);
    r.readAsDataURL(file);
  });

const fileKindLabel = (type, name) => {
  const ext = (name || "").split(".").pop()?.toUpperCase() || "";
  if ((type || "").startsWith("image/")) return "Image";
  if ((type || "").includes("pdf")) return "PDF";
  return ext || "File";
};

const isImagePrint = (p) => (p.type || "").startsWith("image/");

// Images open in the in-app lightbox; PDFs and other documents can't render
// inline, so hand them to the browser's own viewer in a new tab.
const openDataPrint = (p) => {
  if (isImagePrint(p)) { openImageLightbox(p.dataUrl, p.name); return; }
  const win = window.open();
  if (win) {
    win.document.write(
      `<iframe src="${p.dataUrl}" style="border:0;position:fixed;inset:0;width:100%;height:100%"></iframe>`
    );
    win.document.title = p.name;
  }
};

function DataPrintsField({ prints, onChange }) {
  const inputRef = useRef(null);
  const [busy, setBusy] = useState(false);
  const [dragOver, setDragOver] = useState(false);

  const addFiles = async (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;
    setBusy(true);
    try {
      const added = [];
      for (const f of files) {
        if (f.size > PRINT_SIZE_WARN) {
          const ok = window.confirm(
            `"${f.name}" is ${formatBytes(f.size)}. Large files use up local storage quickly. Add it anyway?`
          );
          if (!ok) continue;
        }
        added.push({
          id: nextId("print"),
          name: f.name,
          type: f.type || "",
          size: f.size,
          addedAt: Date.now(),
          dataUrl: await readFileAsDataUrl(f),
        });
      }
      if (added.length) onChange([...(prints || []), ...added]);
    } catch (e) {
      alert(e?.message || "Could not read that file.");
    } finally {
      setBusy(false);
    }
  };


  const download = (p) => {
    const a = document.createElement("a");
    a.href = p.dataUrl;
    a.download = p.name;
    a.click();
  };

  const total = (prints || []).reduce((n, p) => n + (p.size || 0), 0);

  return (
    <div
      onDragOver={(e) => { e.preventDefault(); setDragOver(true); }}
      onDragLeave={() => setDragOver(false)}
      onDrop={(e) => { e.preventDefault(); setDragOver(false); addFiles(e.dataTransfer?.files); }}
      className={`rounded-lg transition-colors ${dragOver ? "ring-2 ring-orange-400 bg-orange-50" : ""}`}
    >
      <input
        ref={inputRef}
        type="file"
        multiple
        accept=".pdf,.png,.jpg,.jpeg,.webp,.gif,.dwg,.dxf,.vsd,.vsdx,.xlsx,.docx,.txt,.csv"
        className="hidden"
        onChange={(e) => { addFiles(e.target.files); e.target.value = ""; }}
      />

      {(prints || []).length > 0 && (
        <div className="border border-gray-200 rounded-lg divide-y divide-gray-100 mb-2">
          {prints.map((p) => (
            <div key={p.id} className="flex items-center gap-2 px-2.5 py-2">
              <div className="w-9 h-9 rounded-md border border-gray-200 bg-gray-50 flex items-center justify-center shrink-0 overflow-hidden">
                {isImagePrint(p) ? (
                  <img src={p.dataUrl} alt="" className="w-full h-full object-cover" />
                ) : (
                  <span className="text-[8px] font-bold text-gray-500">{fileKindLabel(p.type, p.name)}</span>
                )}
              </div>
              <button onClick={() => openDataPrint(p)} className="min-w-0 flex-1 text-left group">
                <div className="text-xs font-medium text-gray-900 truncate group-hover:text-orange-600">{p.name}</div>
                <div className="text-[10px] text-gray-400">
                  {fileKindLabel(p.type, p.name)} &middot; {formatBytes(p.size)}
                </div>
              </button>
              <button
                onClick={() => download(p)}
                title="Download"
                className="shrink-0 text-[10px] font-medium text-gray-500 hover:text-gray-800 px-1.5 py-1"
              >
                Save
              </button>
              <button
                onClick={() => onChange(prints.filter((x) => x.id !== p.id))}
                title="Remove"
                className="shrink-0 text-[10px] font-medium text-red-600 hover:text-red-700 px-1.5 py-1"
              >
                Remove
              </button>
            </div>
          ))}
        </div>
      )}

      <button
        onClick={() => inputRef.current?.click()}
        disabled={busy}
        className="w-full border border-dashed border-gray-300 rounded-lg py-2.5 text-xs font-medium text-gray-500 hover:border-orange-400 hover:text-orange-600 disabled:opacity-60"
      >
        {busy ? "Reading files..." : "+ Add data prints (drop files or browse)"}
      </button>
      <div className="text-[10px] text-gray-400 mt-1">
        Floor plans, riser diagrams, as-builts. PDFs and images open in the app; everything else downloads.
        {total > 0 ? ` \u00b7 ${formatBytes(total)} stored` : ""}
      </div>
    </div>
  );
}

// ---------- Cabinet presets ----------
// A "standard cabinet" is a saved stack of components — the arrangement a
// shop builds over and over. Applying one drops the whole stack into a rack
// in a single step instead of adding a dozen components by hand.
//
// Presets store component *specs*, never ids or patch links: those belong to
// a physical rack, not to a reusable pattern.
const stripForPreset = (comp) => {
  const { id, serial, mac, photo, ...rest } = comp;
  return {
    ...rest,
    ports: (comp.ports || []).map((p) => {
      const { fiberLink, sfpLink, ...port } = p;
      return port;
    }),
  };
};

const presetHeight = (preset) =>
  (preset.components || []).reduce((max, c) => Math.max(max, (c.uStart || 0) + (c.uHeight || 1)), 0);

function CabinetPresetsView({ presets, setPresets, library, setLibrary, onBack }) {
  const [editing, setEditing] = useState(null); // preset being edited
  const [addAtU, setAddAtU] = useState(null);

  if (editing) {
    const comps = editing.components || [];
    const used = new Array(Math.max(editing.size || 12, presetHeight(editing))).fill(null);
    comps.forEach((c) => {
      for (let i = 0; i < c.uHeight; i++) if (c.uStart + i < used.length) used[c.uStart + i] = c;
    });

    const addComponent = (spec) => {
      const uStart = addAtU ?? 0;
      setEditing((p) => ({
        ...p,
        components: [...(p.components || []), { ...stripForPreset(spec), uStart, uHeight: spec.uHeight || 1 }],
      }));
