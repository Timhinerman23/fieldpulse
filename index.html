const DESIGNER_TYPES = Object.keys(COMPONENT_TYPES);

function ComponentDesignerView({ template, onSave, onCancel, initialType, library = [] }) {
  const isEditing = !!template;
  const [type, setType] = useState(template?.type || initialType || "switch");
  const [manufacturer, setManufacturer] = useState(template?.manufacturer || "");
  const [model, setModel] = useState(template?.model || "");
  const [photo, setPhoto] = useState(template?.photo || null);
  // Management-card QR. Only powered gear carries one, so the field is
  // hidden for everything else rather than sitting there unused.
  const [qrPhoto, setQrPhoto] = useState(template?.qrPhoto || null);
  const manufacturerSuggestions = Array.from(new Set(library.map((l) => l.manufacturer).filter(Boolean)));
  const modelSuggestions = Array.from(new Set(library.map((l) => l.model).filter(Boolean)));
  const effectiveInitialType = template?.type || initialType || "switch";
  const allowedInitial = getAllowedPortCounts(effectiveInitialType);
  const initialPorts = template?.ports || (allowedInitial ? (allowedInitial.includes(24) ? 24 : allowedInitial[0]) : 24);
  const [uHeight, setUHeight] = useState(template?.uHeight || (initialPorts > 16 ? 2 : 1));
  const [ports, setPorts] = useState(initialPorts);
  const [rows, setRows] = useState(template?.portLayout?.rows || (initialPorts > 16 ? 2 : 1));
  const [mainAlign, setMainAlign] = useState(template?.portLayout?.mainAlign || "left");
  const [sfp, setSfp] = useState(
    template?.sfp ?? (getAllowedSfpCounts(effectiveInitialType) ? getAllowedSfpCounts(effectiveInitialType)[0] : 0)
  );
  const [sfpAlign, setSfpAlign] = useState(template?.portLayout?.sfpAlign || "right");
  const [sfpRows, setSfpRows] = useState(template?.portLayout?.sfpRows || 1);

  // Fixed standard size — the same size a 48-port switch (24 per row in
  // two-row layout) already renders at comfortably. Ports/SFPs never
  // resize individually. Instead, the whole assembly (known, fixed
  // natural size) gets uniformly scaled down via CSS transform to
  // guarantee it always fits the panel with no scrollbar.
  const previewPortSize = STANDARD_PORT_SIZE;
  const previewFontSize = STANDARD_PORT_FONT_SIZE;

  const ZONE_PAD = 8; // matches PortFace's zone p-1 (4px each side)
  const ZONE_GAP = 10; // matches PortFace's gap-2.5 between zones
  const mainRowCount = rows === 2 ? 2 : 1;
  const sfpRowCount = sfpRows === 2 ? 2 : 1;
  const naturalWidth =
    MAIN_ZONE_WIDTH + ZONE_PAD + (sfp > 0 ? ZONE_GAP + SFP_ZONE_WIDTH + ZONE_PAD : 0);
  const naturalHeight = Math.max(
    ZONE_PAD + mainRowCount * STANDARD_PORT_SIZE + (mainRowCount - 1) * PORT_GAP_PX,
    sfp > 0 ? ZONE_PAD + sfpRowCount * STANDARD_PORT_SIZE + (sfpRowCount - 1) * PORT_GAP_PX : 0
  );

  const previewBoxRef = useRef(null);
  const [previewBoxWidth, setPreviewBoxWidth] = useState(0);
  useLayoutEffect(() => {
    const el = previewBoxRef.current;
    if (!el) return;
    const update = () => setPreviewBoxWidth(el.clientWidth);
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    window.addEventListener("resize", update);
    return () => {
      ro.disconnect();
      window.removeEventListener("resize", update);
    };
  }, []);

  const previewScale = previewBoxWidth > 0 ? Math.min(1, (previewBoxWidth - 12) / naturalWidth) : 1;

  const canSave = manufacturer.trim() && model.trim() && ports >= 0;

  const showQr = type === "ups" || type === "pdu";

  const handleSave = () => {
    const hasPorts = COMPONENT_TYPES[type].hasPorts;
    const isCato = !!COMPONENT_TYPES[type].isCato;
    onSave({
      id: template?.id || nextId("lib"),
      type,
      manufacturer: manufacturer.trim(),
      model: model.trim(),
      // A fixed faceplate always saves its real counts, never whatever the
      // hidden generic fields happen to be holding.
      uHeight: isCato ? 1 : uHeight,
      photo,
      qrPhoto: showQr ? qrPhoto : undefined,
      ports: isCato ? CATO_COPPER.length : hasPorts ? ports : undefined,
      sfp: isCato ? CATO_SFP.length : hasPorts ? sfp : undefined,
      portLayout: isCato || !hasPorts ? undefined : { rows, mainAlign, sfpAlign, sfpRows },
    });
  };

  const previewDataPorts = Array.from({ length: ports }, (_, i) => i + 1);
  const previewSfpPorts = Array.from({ length: sfp }, (_, i) => i + 1);

  const AlignPicker = ({ value, onChange }) => (
    <div className="flex gap-1.5">
      {["left", "center", "right"].map((a) => (
        <button
          key={a}
          onClick={() => onChange(a)}
          className={`flex-1 text-xs font-medium py-1.5 rounded-lg border capitalize ${
            value === a ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"
          }`}
        >
          {a}
        </button>
      ))}
    </div>

  return (
    <div className="flex-1 px-4 py-6 max-w-2xl w-full mx-auto">
      <h2 className="text-xl font-bold text-gray-900 mb-1">{isEditing ? "Edit Component Layout" : "New Component Layout"}</h2>
      <p className="text-sm text-gray-500 mb-6">Design the physical port layout to match the real device.</p>

      <div className="grid grid-cols-2 gap-3 mb-3">
        <Field label="Manufacturer">
          <input list="designer-mfr-suggestions" className={inputClass} value={manufacturer} onChange={(e) => setManufacturer(e.target.value)} placeholder="e.g. Cisco Meraki" />

        </Field>
      </div>
      <datalist id="designer-mfr-suggestions">

      </datalist>
      <datalist id="designer-model-suggestions">
        {modelSuggestions.map((m) => <option key={m} value={m} />)}

            if (allowed && !allowed.includes(ports)) setPorts(allowed[0]);
            if (!supportsSfp(newType)) setSfp(0);
            const allowedSfp = getAllowedSfpCounts(newType);
            if (allowedSfp && !allowedSfp.includes(sfp)) setSfp(allowedSfp[0]);
          }}
        >
          {DESIGNER_TYPES.map((t) => <option key={t} value={t}>{COMPONENT_TYPES[t].label}</option>)}
        </select>
      </Field>

      <div className="grid grid-cols-2 gap-3 mb-1">
        <Field label={type === "fiber_tray" ? "Tray size" : "U height"}>
          {type === "fiber_tray" ? (
            <select
              className={inputClass}
              value={uHeight}
              onChange={(e) => {
                const u = Number(e.target.value);
                setUHeight(u);
                setPorts(u === 2 ? 6 : 3);
              }}
            >
              <option value={1}>1U &middot; 3 slots</option>
              <option value={2}>2U &middot; 6 slots</option>
            </select>
          ) : (
            <select
              className={inputClass}
              value={COMPONENT_TYPES[type].isCato ? 1 : uHeight}
              disabled={COMPONENT_TYPES[type].isCato}
              onChange={(e) => setUHeight(Number(e.target.value))}
            >
              {(COMPONENT_TYPES[type].isCato ? [1] : [1, 2, 3, 4]).map((u) => (
                <option key={u} value={u}>{u}U</option>
              ))}
            </select>
          )}
        </Field>
        {getAllowedPortCounts(type) && type !== "fiber_tray" && !COMPONENT_TYPES[type].isCato && (
          <Field label="Ethernet Port count">
            <select className={inputClass} value={ports} onChange={(e) => setPorts(Number(e.target.value))}>
              {getAllowedPortCounts(type).map((p) => <option key={p} value={p}>{p}</option>)}
            </select>
          </Field>
        )}
      </div>

      {type === "fiber_tray" && (
        <div className="mb-2 mt-6">
          <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Live Preview</div>
          <div className="bg-gray-900 rounded-lg p-1.5">
            <div className="bg-gray-100 rounded-md border border-gray-800 p-2.5">
              <div className="flex flex-col gap-2">
                <div className="flex items-center justify-between gap-2">
                  {Array.from({ length: Math.min(3, ports) }, (_, i) => (
                    <div key={i} className="flex-1 max-w-[130px] h-9 rounded-sm bg-gray-500 border border-gray-600 shadow-inner" />
                  ))}
                </div>
                {ports > 3 && (
                  <div className="flex items-center justify-between gap-2">
                    {Array.from({ length: Math.min(3, ports - 3) }, (_, i) => (
                      <div key={i} className="flex-1 max-w-[130px] h-9 rounded-sm bg-gray-500 border border-gray-600 shadow-inner" />
                    ))}
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* The Cato faceplate is a fixed physical arrangement — port count,
          row layout and alignment aren't adjustable, so showing those
          controls (and a generic 24-port preview) was just misleading. */}
      {COMPONENT_TYPES[type].isCato && (
        <div className="mb-2 mt-6">
          <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Live Preview</div>
          <div className="bg-gray-900 rounded-lg p-1.5 overflow-x-auto">
            <CatoRow
              comp={{
                name: manufacturer || "Cato Socket",
                uHeight: 1,
                type: "cato_socket",
                ports: [
                  ...CATO_COPPER.map((n) => ({ n, kind: "data" })),
                  ...CATO_SFP.map((n) => ({ n, kind: "sfp" })),
                ],
              }}
              cabinet={{ components: [], connections: [] }}
              mode={null}
              onPortClick={() => {}}
              onPortHover={() => {}}
              onSelect={() => {}}
            />
          </div>
          <div className="text-[11px] text-gray-500 mt-2 leading-snug">
            Fixed faceplate: console pair, ports 1 and 2 combo (SFP + copper share the port
            number), 3 and 4 SFP only, 5&ndash;8 copper, 12&nbsp;VDC input.
            10 mappable ports in total.
          </div>
        </div>
      )}

      {COMPONENT_TYPES[type].hasPorts && type !== "fiber_tray" && !COMPONENT_TYPES[type].isCato && (
        <>
      {ports > 0 && (
      <Field label="Row layout">
        <div className="flex gap-1.5">
          <button
            onClick={() => setRows(1)}
            className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${rows === 1 ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}
          >
            Single row
          </button>
          <button
            onClick={() => { setRows(2); setUHeight((u) => Math.max(u, 2)); }}
            className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${rows === 2 ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}
          >
            Two rows (odd top / even bottom)
          </button>
        </div>
      </Field>
      )}

      {ports > 0 && (
        <Field label="Port alignment">
          <AlignPicker value={mainAlign} onChange={setMainAlign} />
        </Field>
      )}

      {supportsSfp(type) && (
        <>
      <Field label="SFP / uplink count">
        {getAllowedSfpCounts(type) ? (
          <select className={inputClass} value={sfp} onChange={(e) => setSfp(Number(e.target.value))}>
            {getAllowedSfpCounts(type).map((p) => <option key={p} value={p}>{p}</option>)}
          </select>
        ) : (
          <input
            type="number" min={0} max={24} className={inputClass}
            value={sfp}
            onChange={(e) => setSfp(Math.max(0, Math.min(24, Number(e.target.value) || 0)))}
          />
        )}
      </Field>

      {sfp > 0 && (
        <Field label="SFP alignment">
          <AlignPicker value={sfpAlign} onChange={setSfpAlign} />
        </Field>
      )}

      {sfp > 0 && (
        <Field label="SFP row layout">
          <div className="flex gap-1.5">
            <button
              onClick={() => setSfpRows(1)}
              className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${sfpRows === 1 ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}
            >
              Single row
            </button>
            <button
              onClick={() => setSfpRows(2)}
              className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${sfpRows === 2 ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}
            >
              Two rows
            </button>
          </div>
        </Field>
      )}
        </>
      )}

      <div className="mb-2 mt-6">
        <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Live Preview</div>
        <div className="bg-gray-900 rounded-lg p-1.5">
          <div
            ref={previewBoxRef}
            className="bg-gray-100 rounded-md border border-gray-800 p-1.5 overflow-hidden"
            style={{ height: `${naturalHeight * previewScale + 12}px` }}
          >
            <div
              style={{
                width: `${naturalWidth}px`,
                height: `${naturalHeight}px`,
                transform: `scale(${previewScale})`,
                transformOrigin: "top left",
              }}
            >
              <PortFace
                dataPorts={previewDataPorts}
                sfpPorts={previewSfpPorts}
                layout={{ rows, mainAlign, sfpAlign, sfpRows }}
                gap="gap-[3px]"
                mainZoneWidth={MAIN_ZONE_WIDTH}
                sfpZoneWidth={SFP_ZONE_WIDTH}
                renderPort={(n) => (
                  <div
                    key={n}
                    style={{ width: `${previewPortSize}px`, height: `${previewPortSize}px`, fontSize: `${previewFontSize}px` }}
                    className="rounded-sm bg-white border border-gray-300 text-gray-400 font-semibold flex items-center justify-center shrink-0 leading-none"
                  >
                    {n}
                  </div>
                )}
                sfpRenderPort={(n) => (
                  <div
                    key={`sfp-${n}`}
                    style={{ width: `${Math.round(previewPortSize * 1.8)}px`, height: `${previewPortSize}px`, fontSize: `${previewFontSize}px` }}
                    className="rounded-sm bg-white border border-gray-300 text-gray-400 font-semibold flex items-center justify-center shrink-0 leading-none ring-1 ring-gray-400"
                  >
                    {n}
                  </div>
                )}
              />
            </div>
          </div>
        </div>
      </div>
        </>
      )}

      <div className="flex justify-end gap-3 mt-6">
        <button onClick={onCancel} className="px-5 py-2.5 rounded-lg text-sm font-medium text-gray-600 hover:bg-gray-100">
          Cancel
        </button>
        <button
          disabled={!canSave}
          onClick={handleSave}
          className="px-5 py-2.5 rounded-lg text-sm font-semibold bg-orange-500 hover:bg-orange-600 text-white disabled:opacity-40"
        >
          Save Layout
        </button>
      </div>
    </div>
  );
}

// ---------- Add component sheet ----------

function AddComponentSheet({ onClose, onAdd, library, setLibrary, existingComponents = [] }) {
  const [type, setType] = useState(null);
  const [fromTemplateId, setFromTemplateId] = useState(null);
  const [name, setName] = useState("");
  const [manufacturer, setManufacturer] = useState("");
  const [model, setModel] = useState("");
  const [ports, setPorts] = useState(24);
  const [sfp, setSfp] = useState(0);
  const [uHeight, setUHeight] = useState(1);

  // Autocomplete suggestions pulled from everything already saved — the
  // library of designed models plus whatever's already in this cabinet —
  // so common manufacturers/models suggest themselves as you type.
  const manufacturerSuggestions = Array.from(
    new Set([...library.map((l) => l.manufacturer), ...existingComponents.map((c) => c.manufacturer)].filter(Boolean))
  );
  const modelSuggestions = Array.from(
    new Set([...library.map((l) => l.model), ...existingComponents.map((c) => c.model)].filter(Boolean))
  );
  const [saveToLibrary, setSaveToLibrary] = useState(true);
  const [showDesigner, setShowDesigner] = useState(false);

  // A name is "lettered" if it matches the Patch Panel X convention exactly;
  // anything else is treated as a custom name so the dropdown falls back to
  // its Custom option instead of silently rewriting what the user typed.
  const isLetteredName = /^Patch Panel [A-Z]$/.test(name.trim()) && name === name.trim();
  // Flags letters already used in this rack, so you don't create a second
  // "Patch Panel B" without noticing.
  const takenPanelNames = new Set(
    existingComponents
      .filter((c) => c.type === "patch_panel")
      .map((c) => (c.name || "").trim().toLowerCase())
  );

  const meta = type ? COMPONENT_TYPES[type] : null;
  const templatesForType = library.filter((l) => l.type === type);

  const [portLayout, setPortLayout] = useState({ rows: 1, mainAlign: "left", sfpAlign: "right" });
  // PDU outlet banks. Front and rear are configured independently because
  // they routinely differ on real strips.
  const [pduLayout, setPduLayout] = useState({
    frontCount: 8, rearCount: 0, frontAlign: "left", rearAlign: "left",
  });
  // Component-level QR (the unit's own management card), prefilled from a
  // template when one carries a reference shot.
  const [qrPhoto, setQrPhoto] = useState(null);

  const applyTemplate = (tpl) => {
    setFromTemplateId(tpl.id);
    setManufacturer(tpl.manufacturer);
    setModel(tpl.model);
    if (tpl.ports) setPorts(tpl.ports);
    if (tpl.sfp !== undefined) setSfp(tpl.sfp);
    setUHeight(tpl.uHeight || 1);
    setPortLayout(tpl.portLayout || { rows: 1, mainAlign: "left", sfpAlign: "right" });
    // PDU templates carry their own outlet/meter arrangement.
    if (tpl.pduLayout) setPduLayout({ ...tpl.pduLayout });
    // A QR captured on the model carries onto the unit, where the PDF
    // reads it from. Still editable per-unit afterwards.
    if (tpl.qrPhoto) setQrPhoto(tpl.qrPhoto);
  };

  // Suggest the next auto-numbered name for a type (e.g. Switch.01,
  // Switch.02...) based on what's already installed in this cabinet.
  const getNextComponentName = (type, baseLabel) => {
    const sameType = existingComponents.filter((c) => c.type === type);
    if (sameType.length === 0) return `${baseLabel}.01`;
    const pattern = new RegExp(`^${baseLabel}\\.(\\d+)$`, "i");
    let maxNum = 0;
    sameType.forEach((c) => {
      const m = c.name && c.name.match(pattern);
      if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
    });
    const next = maxNum > 0 ? maxNum + 1 : sameType.length + 1;
    return `${baseLabel}.${String(next).padStart(2, "0")}`;
  };

  const selectType = (t) => {
    setType(t);
    if (t === "fiber_tray") {
      setUHeight(1);
      setPorts(3);
      // Plain sequential numbering: Fiber Tray 1, 2, 3. Fills the lowest
      // free number so deleting tray 2 and adding another reuses 2 rather
      // than jumping to 4.
      const used = new Set(
        existingComponents
          .filter((c) => c.type === "fiber_tray")
          .map((c) => {
            const m = /^fiber tray\s*#?\s*(\d+)$/i.exec((c.name || "").trim());
            return m ? parseInt(m[1], 10) : null;
          })
          .filter((n) => n !== null)
      );
      let n = 1;
      while (used.has(n)) n += 1;
      setName(`Fiber Tray ${n}`);
    }
    if (t === "patch_panel") {
      setPorts(24);
      // Pick the first letter not already on a panel in this rack, so
      // adding A then B then C needs no interaction at all.
      const used = new Set(
        existingComponents
          .filter((c) => c.type === "patch_panel")
          .map((c) => (c.name || "").trim().toLowerCase())
      );
      const free = PATCH_PANEL_LETTERS.find((l) => !used.has(`patch panel ${l.toLowerCase()}`));
      setName(`Patch Panel ${free || "A"}`);
    }
    if (t === "switch" || t === "fiber_switch") setPorts(24);
    if (t === "router") setPorts(1);
    if (t === "ups") setPorts(1);
    if (t === "name_plate") { setPorts(0); setName("RADEIN Name Plate"); setManufacturer("RADEIN"); }
    if (t === "pdu") { setPorts(0); setName("PDU"); }
    if (t === "cato_socket") {
      setPorts(6); setSfp(4); setUHeight(1);
      setName("Cato Socket"); setManufacturer("Cato Networks");
    }
    if (t === "provider_equipment") { setPorts(8); setSfp(1); }
    if (t === "switch") setName(getNextComponentName("switch", "Switch"));

    const isTwoRow = t === "switch" || t === "fiber_switch";
    if (isTwoRow) {
      setUHeight(2); // 24 ports defaults to two rows, which needs 2U of space
      setPortLayout({ rows: 2, mainAlign: "left", sfpAlign: "right" });
    } else {
      setUHeight(COMPONENT_TYPES[t].defaultU);
      setPortLayout({ rows: 1, mainAlign: "left", sfpAlign: "right" });
    }
  };

  const buildPorts = () => {
    const meta = COMPONENT_TYPES[type];
    // The Cato faceplate is fixed: copper on 1,2,5-8 and SFP cages on 1-4.
    // Ports 1 and 2 are combo, so each exists as both a data and an SFP port
    // under the same number.
    if (type === "cato_socket") {
      return [
        ...CATO_COPPER.map((n) => ({ n, kind: "data", label: "", vlan: "", device: "", notes: "" })),
        ...CATO_SFP.map((n) => ({ n, kind: "sfp", label: "", vlan: "", device: "", notes: "" })),
      ];
    }
    if (type === "pdu") {
      const mk = (kind, count) =>
        Array.from({ length: count }, (_, i) => ({
          n: i + 1, kind, label: "", device: "", notes: "",
        }));
      return [...mk("front", pduLayout.frontCount), ...mk("rear", pduLayout.rearCount)];
    }
    if (type === "ups") {
      return Array.from({ length: ports }, (_, i) => ({
        n: i + 1, kind: "data", label: ports > 1 ? `Cloud ${i + 1}` : "Cloud", vlan: "", device: "", notes: "",
      }));
    }
    if (!meta.hasPorts) return undefined;
    if (type === "fiber_tray") {
      return Array.from({ length: ports }, (_, i) => ({
        n: i + 1, fiberType: null, destination: "", notes: "",
      }));
    }
    const dataPorts = Array.from({ length: ports }, (_, i) => ({
      n: i + 1, kind: "data", label: "", vlan: "", device: "", notes: "",
    }));
    const sfpPorts = Array.from({ length: sfp }, (_, i) => ({
      n: i + 1, kind: "sfp", label: "", vlan: "", device: "", notes: "",
    }));
    return [...dataPorts, ...sfpPorts];
  };

  const canSave = type && name.trim().length > 0;

  const handleAdd = () => {
    if (saveToLibrary && manufacturer && model && !fromTemplateId) {
      const tpl = {
        id: nextId("lib"), type, manufacturer, model,
        ports: meta.hasPorts ? ports : undefined,
        sfp: type === "switch" ? sfp : undefined,
        uHeight, portLayout,
        ...(type === "pdu" ? { pduLayout } : {}),
      };
      setLibrary((prev) => [...prev, tpl]);
    }
    onAdd({
      type,
      name,
      manufacturer,
      model,
      serial: "",
      mac: "",
      notes: "",
      photo: qrPhoto || null,
      uHeight,
      ports: buildPorts(),
      portLayout,
      ...(type === "pdu" ? { pduLayout } : {}),
    });
  };

  return (
    <>
    <Sheet open={true} onClose={onClose} title={type ? `Add ${meta.label}` : "Add Component"}>
      {!type && (
        <div className="grid grid-cols-2 gap-2">
          {Object.entries(COMPONENT_TYPES).map(([key, m]) => {
            const Icon = m.icon;
            return (
              <button
                key={key}
                onClick={() => selectType(key)}
                style={{ background: typeTone(key).bg, borderColor: typeTone(key).border }}
                className="flex items-center gap-2 border rounded-lg px-3 py-3 hover:border-orange-400 text-left transition-colors"
              >
                <IconBadge Icon={Icon} className="w-8 h-8 shrink-0" />
                <span className="text-sm font-medium" style={{ color: toneFg(typeTone(key)) }}>{m.label}</span>
              </button>
            );
          })}
        </div>
      )}

      {type && (
        <>
          {templatesForType.length > 0 && (
            <Field label="Model">
              <div className="flex gap-2">
                <select
                  className={inputClass + " flex-1"}
                  value={fromTemplateId || ""}
                  onChange={(e) => {
                    const tpl = templatesForType.find((t) => t.id === e.target.value);
                    if (tpl) applyTemplate(tpl);
                    else setFromTemplateId(null);
                  }}
                >
                  <option value="">Select a model…</option>
                  {templatesForType.map((tpl) => (
                    <option key={tpl.id} value={tpl.id}>{tpl.manufacturer} {tpl.model}</option>
                  ))}
                </select>
                <button
                  onClick={() => setShowDesigner(true)}
                  title="Design a new layout"
                  className="shrink-0 w-10 flex items-center justify-center border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50"
                >
                  <Plus size={16} />
                </button>
              </div>
            </Field>
          )}

          {templatesForType.length === 0 && meta.hasPorts && (
            <Field label="Model">
              <button
                onClick={() => setShowDesigner(true)}
                className="w-full flex items-center justify-center gap-1.5 border border-dashed border-gray-300 rounded-lg py-2.5 text-sm text-gray-500 hover:border-orange-400 hover:text-orange-500"
              >
                <Plus size={14} />
                No saved models yet — design one
              </button>
            </Field>
          )}

          {type === "patch_panel" ? (
            // Patch panels are almost always lettered A, B, C in order, so
            // the dropdown covers the common case in one tap. The custom
            // field beside it handles the racks that don't follow that.
            <div className="grid grid-cols-2 gap-3">
              <Field label="Patch Panel name">
                <select
                  className={inputClass}
                  value={isLetteredName ? name : "__custom__"}
                  onChange={(e) => setName(e.target.value === "__custom__" ? "" : e.target.value)}
                >
                  {PATCH_PANEL_LETTERS.map((letter) => {
                    const label = `Patch Panel ${letter}`;
                    return (
                      <option key={letter} value={label}>
                        {label}{takenPanelNames.has(label.toLowerCase()) ? "  (in use)" : ""}
                      </option>
                    );
                  })}
                  <option value="__custom__">Custom name...</option>
                </select>
              </Field>
              <Field label="Custom name">
                <input
                  className={inputClass}
                  value={isLetteredName ? "" : name}
                  onChange={(e) => setName(e.target.value)}
                  placeholder="e.g. Voice Panel 1"
                />
              </Field>
            </div>
          ) : (
            <Field label={`${meta.label} name`}>
              <input className={inputClass} value={name} onChange={(e) => setName(e.target.value)} placeholder={`e.g. ${meta.label} A`} />
            </Field>
          )}

          <div className="grid grid-cols-2 gap-3">
            <Field label="Manufacturer">
              <input list="mfr-suggestions" className={inputClass} value={manufacturer} onChange={(e) => setManufacturer(e.target.value)} placeholder="e.g. Cisco" />
            </Field>
            <Field label="Model">
              <input list="model-suggestions" className={inputClass} value={model} onChange={(e) => setModel(e.target.value)} placeholder="e.g. Catalyst 2960X" />
            </Field>
          </div>
          <datalist id="mfr-suggestions">
            {manufacturerSuggestions.map((m) => <option key={m} value={m} />)}
          </datalist>
          <datalist id="model-suggestions">
            {modelSuggestions.map((m) => <option key={m} value={m} />)}
          </datalist>

          {type === "pdu" && (
            <div className="space-y-4">
              {[
                { face: "front", label: "Front", countKey: "frontCount", alignKey: "frontAlign" },
                { face: "rear", label: "Back", countKey: "rearCount", alignKey: "rearAlign" },
              ].map(({ face, label, countKey, alignKey }) => (
                <div key={face} className="border border-gray-200 rounded-xl p-3 space-y-3">
                  <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide">{label} of PDU</div>
                  <Field label={`Outlets on ${label.toLowerCase()}`}>
                    <div className="flex flex-wrap gap-1.5">
                      {PDU_OUTLET_COUNTS.map((n) => (
                        <button
                          key={n}
                          onClick={() => setPduLayout((pl) => ({ ...pl, [countKey]: n }))}
                          className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${
                            pduLayout[countKey] === n
                              ? "bg-black text-white border-black"
                              : "bg-white text-gray-600 border-gray-300"
                          }`}
                        >
                          {n === 0 ? "None" : n}
                        </button>
                      ))}
                    </div>
                  </Field>
                  {pduLayout[countKey] > 0 && (
                    <Field label="Position">
                      <div className="flex gap-2">
                        {PDU_ALIGNMENTS.map((a) => (
                          <button
                            key={a.id}
                            onClick={() => setPduLayout((pl) => ({ ...pl, [alignKey]: a.id }))}
                            className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${
                              pduLayout[alignKey] === a.id
                                ? "bg-black text-white border-black"
                                : "bg-white text-gray-600 border-gray-300"
                            }`}
                          >
                            {a.label}
                          </button>
                        ))}
                      </div>
                    </Field>
                  )}
                </div>
              ))}
              <div className="border border-gray-200 rounded-xl p-3 space-y-3">
                <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Digital Meter</div>
                <Field label="Amp meter on front">
                  <div className="flex gap-2">
                    {PDU_METER_POSITIONS.map((m) => (
                      <button
                        key={m.id}
                        onClick={() => setPduLayout((pl) => ({ ...pl, meter: m.id }))}
                        className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${
                          (pduLayout.meter || "none") === m.id
                            ? "bg-black text-white border-black"
                            : "bg-white text-gray-600 border-gray-300"
                        }`}
                      >
                        {m.label}
                      </button>
                    ))}
                  </div>
                </Field>
              </div>

              <div className="text-[11px] text-gray-400">
                Total {pduLayout.frontCount + pduLayout.rearCount} outlets. Tap any outlet in the rack to record what's plugged into it.
              </div>
            </div>
          )}

          {(type === "patch_panel") && (
            <Field label="Ethernet Port count">
              <div className="flex flex-wrap gap-1.5">
                {PATCH_PANEL_PORT_COUNTS.map((p) => (
                  <button key={p} onClick={() => setPorts(p)} className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${ports === p ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}>
                    {p}
                  </button>
                ))}
              </div>
            </Field>
          )}

          {(type === "switch" || type === "router" || type === "fiber_switch") && (
            <>
              <Field label="Ethernet Port count">
                <div className="flex flex-wrap gap-1.5">
                  {(type === "router" ? ROUTER_PORT_COUNTS : type === "fiber_switch" ? FIBER_SWITCH_PORT_COUNTS : SWITCH_PORT_COUNTS).map((p) => (
                    <button
                      key={p}
                      onClick={() => {
                        setPorts(p);
                        const twoRow = p > 16;
                        setPortLayout((pl) => ({ ...pl, rows: twoRow ? 2 : 1 }));
                        setUHeight(twoRow ? 2 : 1);
                      }}
                      className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${ports === p ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}
                    >
                      {p}
                    </button>
                  ))}
                </div>
              </Field>
              <Field label="SFP / uplink slots">
                <div className="flex flex-wrap gap-1.5">
                  {(getAllowedSfpCounts(type) || SWITCH_SFP_COUNTS).map((p) => (
                    <button key={p} onClick={() => setSfp(p)} className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${sfp === p ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}>
                      {p}
                    </button>
                  ))}
                </div>
              </Field>
              {/* Plenty of switches stack even a single pair of SFP cages
                  vertically, so this needs to be available at 2 slots, not
                  just on high-count fiber switches. */}
              {sfp >= 2 && (
                <Field label="SFP arrangement">
                  <div className="flex gap-2">
                    <button
                      onClick={() => setPortLayout((pl) => ({ ...pl, sfpRows: 1 }))}
                      className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${(portLayout.sfpRows || 1) === 1 ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}
                    >
                      Side by side
                    </button>
                    <button
                      onClick={() => setPortLayout((pl) => ({ ...pl, sfpRows: 2 }))}
                      className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${portLayout.sfpRows === 2 ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}
                    >
                      Stacked (2 rows)
                    </button>
                  </div>
                </Field>
              )}
            </>
          )}

          {type === "provider_equipment" && (
            <>
              <Field label="Ethernet Port count">
                <select className={inputClass} value={ports} onChange={(e) => setPorts(Number(e.target.value))}>
                  {PROVIDER_EQUIPMENT_PORT_COUNTS.map((p) => <option key={p} value={p}>{p}</option>)}
                </select>
              </Field>
              <Field label="SFP / uplink count">
                <select className={inputClass} value={sfp || PROVIDER_EQUIPMENT_SFP_COUNTS[0]} onChange={(e) => setSfp(Number(e.target.value))}>
                  {PROVIDER_EQUIPMENT_SFP_COUNTS.map((p) => <option key={p} value={p}>{p}</option>)}
                </select>
              </Field>
            </>
          )}

          {type === "ups" && (
            <Field label="Cloud ports">
              <div className="flex flex-wrap gap-1.5">
                {UPS_PORT_COUNTS.map((p) => (
                  <button key={p} onClick={() => setPorts(p)} className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${ports === p ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}>
                    {p}
                  </button>
                ))}
              </div>
            </Field>
          )}

          {type === "fiber_tray" && (
            <Field label="Tray size">
              <div className="flex flex-wrap gap-1.5">
                {[1, 2].map((u) => (
                  <button
                    key={u}
                    onClick={() => { setUHeight(u); setPorts(u === 2 ? 6 : 3); }}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${uHeight === u ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}
                  >
                    {u}U &middot; {u === 2 ? 6 : 3} slots
                  </button>
                ))}
              </div>
            </Field>
          )}

          {type !== "fiber_tray" && (
          <Field label="Rack space (U)">
            <div className="flex flex-wrap gap-1.5">
              {[1, 2, 3, 4].map((u) => (
                <button key={u} onClick={() => setUHeight(u)} className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${uHeight === u ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"}`}>
                  {u}U
                </button>
              ))}
            </div>
          </Field>
          )}

          {manufacturer && model && !fromTemplateId && (
            <label className="flex items-center gap-2 text-xs text-gray-600 mb-3">
              <input type="checkbox" checked={saveToLibrary} onChange={(e) => setSaveToLibrary(e.target.checked)} />
              Save "{manufacturer} {model}" to my component library for reuse
            </label>
          )}

          <div className="flex gap-2 mt-2">
            <button onClick={() => setType(null)} className="flex-1 border border-gray-300 rounded-lg py-3 text-sm font-medium text-gray-600">
              Back
            </button>
            <button
              disabled={!canSave}
              onClick={handleAdd}
              className="flex-1 bg-orange-500 disabled:bg-gray-200 disabled:text-gray-400 text-white font-medium rounded-lg py-3 text-sm hover:bg-orange-600"
            >
              Add to Rack
            </button>
          </div>
        </>
      )}
    </Sheet>

    {showDesigner && (
      <div className="fixed inset-0 z-[60] bg-white overflow-y-auto flex flex-col">
        <div className="flex items-center justify-between px-4 py-3 border-b border-gray-200 sticky top-0 bg-white z-10">
          <div className="font-semibold text-gray-900 text-sm">New Component Layout</div>
          <button onClick={() => setShowDesigner(false)} className="p-1.5 rounded-full hover:bg-gray-100">
            <X size={18} className="text-gray-500" />
          </button>
        </div>
        <ComponentDesignerView
          template={null}
          initialType={type}
          library={library}
          onCancel={() => setShowDesigner(false)}
          onSave={(tpl) => {
            setLibrary((prev) => [...prev, tpl]);
            applyTemplate(tpl);
            setShowDesigner(false);
          }}
        />
      </div>
    )}
  </>
  );
}

// ---------- Component detail sheet (ports, mapping, UPS photo, etc.) ----------

function ComponentSheet({ cabinet, allCabinets, comp, onClose, onUpdate, onRemove, onUpdateCabinet, initialTab }) {
  const [tab, setTab] = useState(initialTab || "overview");
  const meta = COMPONENT_TYPES[comp.type];
  const Icon = meta.icon;

  return (
    <Sheet open={true} onClose={onClose} title={comp.name} scrollKey={`${comp.id}-${tab}`} hideHeader={tab === "ports"}>
      <div className="flex items-center gap-2 mb-4">
        <IconBadge Icon={Icon} className="w-9 h-9" />
        <div className="text-xs text-gray-500">{meta.label}{comp.manufacturer ? ` \u00b7 ${comp.manufacturer} ${comp.model}` : ""}</div>
      </div>

      {meta.hasPorts && (
        <div className="flex gap-1 mb-4 bg-gray-100 rounded-lg p-1">
          <button onClick={() => setTab("overview")} className={`flex-1 text-xs font-medium py-1.5 rounded-md ${tab === "overview" ? "bg-white shadow-sm text-gray-900" : "text-gray-500"}`}>Overview</button>
          <button onClick={() => setTab("ports")} className={`flex-1 text-xs font-medium py-1.5 rounded-md ${tab === "ports" ? "bg-white shadow-sm text-gray-900" : "text-gray-500"}`}>
            {comp.type === "fiber_tray" ? "Slots" : "Ports"}
          </button>
        </div>
      )}

      {tab === "overview" && (
        <OverviewTab comp={comp} onUpdate={onUpdate} cabinet={cabinet} onUpdateCabinet={onUpdateCabinet} />
      )}

      {tab === "ports" && meta.hasPorts && (
        <PortsTab
          cabinet={cabinet}
          comp={comp}
          onUpdate={onUpdate}
          onUpdateCabinet={onUpdateCabinet}
          isFiber={comp.type === "fiber_tray"}
        />
      )}

      <button
        onClick={onRemove}
        className="w-full mt-5 flex items-center justify-center gap-1.5 text-xs font-medium text-red-500 border border-red-200 rounded-lg py-2.5 hover:bg-red-50"
      >
        <Trash2 size={13} />
        Remove from rack
      </button>
    </Sheet>
  );
}

function OverviewTab({ comp, onUpdate, cabinet, onUpdateCabinet }) {
  const isUps = comp.type === "ups";
  const [showBackPanel, setShowBackPanel] = useState(false);
  const [showConfig, setShowConfig] = useState(false);
  // Still show a field if this unit already carries a value, so data
  // recorded before this rule can't become stranded and uneditable.
  const showSerial = typeHasSerial(comp.type) || !!comp.serial;
  const showMac = typeHasMac(comp.type) || !!comp.mac;
  // Same lettered/custom split as the Add sheet. Letters used by *other*
  // panels in this rack are flagged; this panel's own letter isn't.
  const panelIsLettered = /^Patch Panel [A-Z]$/.test(comp.name || "");
  const panelNamesInUse = new Set(
    (cabinet?.components || [])
      .filter((c) => c.type === "patch_panel" && c.id !== comp.id)
      .map((c) => (c.name || "").trim().toLowerCase())
  );

  return (
    <div>
      {comp.type === "patch_panel" ? (
        <div className="grid grid-cols-2 gap-3">
          <Field label="Name">
            <select
              className={inputClass}
              value={panelIsLettered ? comp.name : "__custom__"}
              onChange={(e) => onUpdate({ name: e.target.value === "__custom__" ? "" : e.target.value })}
            >
              {PATCH_PANEL_LETTERS.map((letter) => {
                const label = `Patch Panel ${letter}`;
                return (
                  <option key={letter} value={label}>
                    {label}{panelNamesInUse.has(label.toLowerCase()) ? "  (in use)" : ""}
                  </option>
                );
              })}
              <option value="__custom__">Custom name...</option>
            </select>
          </Field>
          <Field label="Custom name">
            <input
              className={inputClass}
              value={panelIsLettered ? "" : comp.name}
              onChange={(e) => onUpdate({ name: e.target.value })}
              placeholder="e.g. Voice Panel 1"
            />
          </Field>
        </div>
      ) : (
        <Field label="Name">
          <input className={inputClass} value={comp.name} onChange={(e) => onUpdate({ name: e.target.value })} />
        </Field>
      )}
      {comp.type === "fiber_tray" && (
        <div className="border border-gray-200 rounded-xl p-3 space-y-3">
          <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Adapter Plates</div>
          {(comp.ports || []).map((p) => (
            <div key={p.n} className="flex items-center gap-3 border border-gray-100 rounded-lg p-2">
              <div className="text-[11px] font-bold text-gray-400 w-10 shrink-0">Slot {p.n}</div>
              {p.adapter ? (
                <div className="min-w-0 flex-1">
                  <div className="overflow-x-auto pb-1">
                    <FiberAdapterFace adapter={p.adapter} fiberType={p.fiberType} />
                  </div>
                  <div className="text-[10px] text-gray-500 mt-1 truncate">
                    {[p.adapter.manufacturer, p.adapter.model].filter(Boolean).join(" ") || "Unspecified plate"}
                    {" \u00b7 "}{p.adapter.count}F{rowsForCount(p.adapter.count) === 2 ? " \u00b7 2 rows" : ""}
                    {p.destination ? ` \u00b7 ${p.destination}` : ""}
                  </div>
                </div>
              ) : (
                <div className="flex-1 text-[11px] text-gray-400">Empty \u2014 open the slot in the rack to fit a plate</div>
              )}
            </div>
          ))}
          <div className="text-[10px] text-gray-400">
            Tap a slot in the rack view to add or edit its adapter plate.
          </div>
        </div>
      )}

      {comp.type === "pdu" && (
        <div className="border border-gray-200 rounded-xl p-3 space-y-3">
          <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Outlet Layout</div>
          {[
            { label: "Front", countKey: "frontCount", alignKey: "frontAlign", kind: "front" },
            { label: "Back", countKey: "rearCount", alignKey: "rearAlign", kind: "rear" },
          ].map(({ label, countKey, alignKey, kind }) => {
            const layout = comp.pduLayout || {};
            const current = (comp.ports || []).filter((p) => p.kind === kind).length;
            return (
              <div key={kind} className="space-y-2">
                <Field label={`${label} outlets`}>
                  <select
                    className={inputClass}
                    value={current}
                    onChange={(e) => {
                      const next = parseInt(e.target.value, 10);
                      const all = comp.ports || [];
                      // Resize one bank while preserving what's recorded on
                      // the outlets that survive. Always rebuild as
                      // front-then-rear so ordering stays predictable.
                      const resize = (k, count) => {
                        const have = all.filter((p) => p.kind === k);
                        return Array.from({ length: count }, (_, i) =>
                          have[i] || { n: i + 1, kind: k, label: "", device: "", notes: "" }
                        );
                      };
                      const frontCount = kind === "front" ? next : all.filter((p) => p.kind === "front").length;
                      const rearCount = kind === "rear" ? next : all.filter((p) => p.kind === "rear").length;
                      onUpdate({
                        ports: [...resize("front", frontCount), ...resize("rear", rearCount)],
                        pduLayout: { ...layout, frontCount, rearCount },

                    {PDU_OUTLET_COUNTS.map((n) => (
                      <option key={n} value={n}>{n === 0 ? "None" : `${n} outlets`}</option>

                  <Field label={`${label} position`}>
                    <div className="flex gap-2">
                      {PDU_ALIGNMENTS.map((a) => (
                        <button
                          key={a.id}
                          onClick={() => onUpdate({ pduLayout: { ...layout, [alignKey]: a.id } })}
                          className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${
                            (layout[alignKey] || "left") === a.id
                              ? "bg-black text-white border-black"
                              : "bg-white text-gray-600 border-gray-300"
                          }`}
                        >
                          {a.label}

                      ))}
                    </div>
                  </Field>
                )}
              </div>
            );
          })}

          <div className="pt-2 border-t border-gray-100 space-y-3">
            <Field label="Amp meter on front">
              <div className="flex gap-2">
                {PDU_METER_POSITIONS.map((m) => (
                  <button
                    key={m.id}
                    onClick={() => onUpdate({ pduLayout: { ...(comp.pduLayout || {}), meter: m.id } })}
                    className={`flex-1 text-xs font-medium py-1.5 rounded-lg border ${
                      ((comp.pduLayout || {}).meter || "none") === m.id
                        ? "bg-black text-white border-black"
                        : "bg-white text-gray-600 border-gray-300"
                    }`}

                    {m.label}
                  </button>
                ))}
              </div>
            </Field>
            {((comp.pduLayout || {}).meter || "none") !== "none" && (
              <Field label="Meter reading (amps)">
                <input
                  className={`${inputClass} font-mono`}
                  value={comp.pduAmps || ""}
                  onChange={(e) => onUpdate({ pduAmps: e.target.value })}
                  placeholder="e.g. 7.5"
                />
              </Field>
            )}
          </div>
        </div>
      )}

      {comp.type === "name_plate" && (
        <div className="border border-gray-200 rounded-xl p-3 space-y-3">
          <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Plate Artwork</div>
          <div className="rounded-md overflow-hidden bg-gray-900/90 p-1">
            <NamePlateFace comp={comp} height={40} />
          </div>
          <Field label="Text on plate">
            <input
              className={inputClass}
              value={comp.plateText ?? "RADEIN"}
              onChange={(e) => onUpdate({ plateText: e.target.value })}
              placeholder="Leave blank for a plain plate"
            />
          </Field>
          <Field label="Colour">
            <div className="flex flex-wrap gap-1.5">
              {Object.entries(PLATE_THEMES).map(([key, t]) => {
                const active = (comp.plateTheme || "radein") === key;
                return (
                  <button
                    key={key}
                    onClick={() => onUpdate({ plateTheme: key })}
                    className={`flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-xs font-medium capitalize ${
                      active ? "border-gray-900 bg-gray-900 text-white" : "border-gray-300 text-gray-600 hover:bg-gray-50"
                    }`}
                  >
                    <span className="w-3 h-3 rounded-sm border border-black/20" style={{ background: t.accent }} />
                    {key}
                  </button>
                );
              })}
            </div>
          </Field>
        </div>
      )}

      <div className="grid grid-cols-2 gap-3">
        <Field label="Manufacturer">
          <input className={inputClass} value={comp.manufacturer || ""} onChange={(e) => onUpdate({ manufacturer: e.target.value })} />
        </Field>
        <Field label="Model">
          <input className={inputClass} value={comp.model || ""} onChange={(e) => onUpdate({ model: e.target.value })} />

      </div>
      {(showSerial || showMac) && (
        <div className="grid grid-cols-2 gap-3">
          {showSerial && (

              <input className={`${inputClass} font-mono text-xs`} value={comp.serial || ""} onChange={(e) => onUpdate({ serial: e.target.value })} placeholder="Unique to this unit" />

          )}
          {showMac && (
            <Field label="MAC address">
              <input className={`${inputClass} font-mono text-xs`} value={comp.mac || ""} onChange={(e) => onUpdate({ mac: e.target.value })} placeholder="Unique to this unit" />

      {isUps && (
        <Field label="Ethernet management card / QR code">

      {isUps && (

      {showBackPanel && (

      <Field label="Notes">
        <textarea
          className={`${inputClass} min-h-[70px] resize-none`}

          onChange={(e) => onUpdate({ notes: e.target.value })}

      </Field>

      {/* Hardware-level edits live behind their own button, since changing
          port counts is a different kind of action than fixing a typo in
          the model number. */}
      <button
        onClick={() => setShowConfig(true)}
        className="w-full flex items-center justify-center gap-1.5 border border-gray-300 rounded-lg py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 mb-3"
      >
        <GearIcon size={14} className="text-gray-500" />
        Edit Configuration
      </button>

      {showConfig && (
        <ComponentConfigSheet
          comp={comp}
          cabinet={cabinet}
          onClose={() => setShowConfig(false)}
          onUpdate={onUpdate}
          onUpdateCabinet={onUpdateCabinet}
        />
      )}
    </div>
  );
}

// Edits the *hardware* of a component already installed in a rack — size,
// port counts, and layout — as opposed to the Overview tab which only edits
// its identity fields. Port data is preserved positionally when counts
// change, and anything that would be destroyed is spelled out first.
function ComponentConfigSheet({ comp, cabinet, onClose, onUpdate, onUpdateCabinet }) {
  const meta = COMPONENT_TYPES[comp.type] || {};
  const isFiberTray = comp.type === "fiber_tray";
  const isUps = comp.type === "ups";

  const existingData = (comp.ports || []).filter((p) => (p.kind || "data") !== "sfp");
  const existingSfp = (comp.ports || []).filter((p) => p.kind === "sfp");

  const [uHeight, setUHeight] = useState(comp.uHeight || 1);
  const [dataCount, setDataCount] = useState(existingData.length);
  const [sfpCount, setSfpCount] = useState(existingSfp.length);
  const [rows, setRows] = useState(comp.portLayout?.rows === 2 ? 2 : 1);
  const [sfpRows, setSfpRows] = useState(comp.portLayout?.sfpRows === 2 ? 2 : 1);
  const [mainAlign, setMainAlign] = useState(comp.portLayout?.mainAlign || "left");
  const [sfpAlign, setSfpAlign] = useState(comp.portLayout?.sfpAlign || "right");

  const allowedPorts = isFiberTray ? FIBER_STRAND_COUNTS : getAllowedPortCounts(comp.type);
  const allowedSfp = getAllowedSfpCounts(comp.type);
  const canHaveSfp = supportsSfp(comp.type) && !isFiberTray && !isUps;
  const hasPorts = meta.hasPorts || isUps;

  // How much free space sits below this component, so growing it can't
  // silently overlap the unit underneath.
  const maxUHeight = (() => {
    let limit = cabinet.size - comp.uStart;
    cabinet.components.forEach((c) => {
      if (c.id === comp.id) return;
      if (c.uStart > comp.uStart) limit = Math.min(limit, c.uStart - comp.uStart);
    });
    return Math.max(1, limit);
  })();

  const droppedData = Math.max(0, existingData.length - dataCount);
  const droppedSfp = Math.max(0, existingSfp.length - sfpCount);
  const losing = [];
  existingData.slice(dataCount).forEach((p) => {
    if (p.label || p.vlan || p.device || p.notes || p.destination || p.fiberType) losing.push(p);
  });
  existingSfp.slice(sfpCount).forEach((p) => {
    if (p.label || p.vlan || p.device || p.notes) losing.push(p);
  });

  const save = () => {
    if (droppedData + droppedSfp > 0) {
      const detail = losing.length
        ? ` ${losing.length} of them ${losing.length === 1 ? "has" : "have"} data recorded that will be lost.`
        : "";
      const ok = window.confirm(
        `Removing ${droppedData + droppedSfp} port${droppedData + droppedSfp === 1 ? "" : "s"}.${detail} Continue?`
      );
      if (!ok) return;
    }

    // Preserve each surviving port's data positionally, and renumber.
    const blank = isFiberTray
      ? { fiberType: null, destination: "", notes: "" }
      : { label: "", vlan: "", device: "", notes: "" };
    const nextData = Array.from({ length: dataCount }, (_, i) => ({
      ...blank,
      ...(existingData[i] || {}),
      n: i + 1,
      ...(isFiberTray ? {} : { kind: "data" }),
    }));
    const nextSfp = Array.from({ length: sfpCount }, (_, i) => ({
      label: "", vlan: "", device: "", notes: "",
      ...(existingSfp[i] || {}),
      n: i + 1,
      kind: "sfp",
    }));
    const nextPorts = hasPorts ? [...nextData, ...nextSfp] : comp.ports;

    // Drop any links that pointed at ports which no longer exist.
    const highest = Math.max(dataCount, sfpCount);
    onUpdateCabinet((cab) => ({
      ...cab,
      components: cab.components.map((c) =>
        c.id === comp.id
          ? {
              ...c,
              uHeight,
              ports: nextPorts,
              portLayout: hasPorts ? { rows, mainAlign, sfpAlign, sfpRows } : c.portLayout,
            }
          : c
      ),
      connections: cab.connections.filter((cn) => {
        const touches = (end) => end.compId === comp.id && end.port > highest;
        return !touches(cn.a) && !touches(cn.b);
      }),
    }));
    onClose();
  };

  const NumberPicker = ({ label, value, onChange, allowed, max }) => (
    <Field label={label}>
      {allowed ? (
        <select className={inputClass} value={value} onChange={(e) => onChange(Number(e.target.value))}>
          {allowed.map((n) => <option key={n} value={n}>{n}</option>)}
        </select>
      ) : (
        <input
          type="number"
          min={0}
          max={max || 48}
          className={inputClass}
          value={value}
          onChange={(e) => onChange(Math.max(0, Math.min(max || 48, Number(e.target.value) || 0)))}
        />
      )}
    </Field>
  );

  return (
    <Sheet open={true} onClose={onClose} title={`Configure ${comp.name}`}>
      <div className="text-xs text-gray-500 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 mb-3">
        Changes the physical make-up of this unit. Port labels, VLANs, and links are kept wherever the port still exists.
      </div>

      <Field label="Rack Size (U)">
        <select className={inputClass} value={uHeight} onChange={(e) => setUHeight(Number(e.target.value))}>
          {Array.from({ length: maxUHeight }, (_, i) => i + 1).map((n) => (
            <option key={n} value={n}>{n}U</option>
          ))}
        </select>
      </Field>
      {maxUHeight < 4 && (
        <div className="text-[11px] text-amber-600 -mt-1 mb-3">
          Capped at {maxUHeight}U — another component sits directly below.
        </div>
      )}

      {hasPorts && (
        <NumberPicker
          label={isFiberTray ? "Strands / Slots" : isUps ? "Cloud Ports" : "Ethernet Ports"}
          value={dataCount}
          onChange={setDataCount}
          allowed={allowedPorts}
        />
      )}

      {canHaveSfp && (
        <NumberPicker label="SFP Ports" value={sfpCount} onChange={setSfpCount} allowed={allowedSfp} max={24} />
      )}

      {hasPorts && !isFiberTray && !isUps && (
        <>
          <div className="grid grid-cols-2 gap-3">
            <Field label="Port Rows">
              <select className={inputClass} value={rows} onChange={(e) => setRows(Number(e.target.value))}>
                <option value={1}>1 row</option>
                <option value={2}>2 rows</option>
              </select>
            </Field>
            <Field label="Port Alignment">
              <select className={inputClass} value={mainAlign} onChange={(e) => setMainAlign(e.target.value)}>
                <option value="left">Left</option>
                <option value="center">Center</option>
                <option value="right">Right</option>
              </select>
            </Field>
          </div>
          {sfpCount > 0 && (
            <div className="grid grid-cols-2 gap-3">
              <Field label="SFP Rows">
                <select className={inputClass} value={sfpRows} onChange={(e) => setSfpRows(Number(e.target.value))}>
                  <option value={1}>1 row</option>
                  <option value={2}>2 rows</option>
                </select>
              </Field>
              <Field label="SFP Alignment">
                <select className={inputClass} value={sfpAlign} onChange={(e) => setSfpAlign(e.target.value)}>
                  <option value="left">Left</option>
                  <option value="center">Center</option>
                  <option value="right">Right</option>
                </select>
              </Field>
            </div>
          )}
        </>
      )}

      {(droppedData > 0 || droppedSfp > 0) && (
        <div className="text-xs text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2 mb-3">
          Removing {droppedData + droppedSfp} port{droppedData + droppedSfp === 1 ? "" : "s"} from the end.
          {losing.length > 0 && ` ${losing.length} of them ${losing.length === 1 ? "has" : "have"} data recorded.`}
        </div>
      )}

      <button
        onClick={save}
        className="w-full bg-orange-500 text-white rounded-lg py-2.5 text-sm font-medium hover:bg-orange-600 mt-1"
      >
        Save Configuration
      </button>
    </Sheet>
  );
}
