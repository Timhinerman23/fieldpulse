// A component's data ports and its SFP ports are numbered independently —
// both start at 1 — so a connection is only identified by compId + port
// number + kind. Matching on number alone made data port 1 and SFP 1 the
// same port. Connections saved before kind was stored default to "data".
const connKind = (end) => end.kind || "data";

function findConnection(cabinet, compId, portN, kind = "data") {
  return cabinet.connections.find(
    (cn) =>
      (cn.a.compId === compId && cn.a.port === portN && connKind(cn.a) === kind) ||
      (cn.b.compId === compId && cn.b.port === portN && connKind(cn.b) === kind)
  );
}

function otherEnd(connection, compId, portN, kind = "data") {
  if (
    connection.a.compId === compId &&
    connection.a.port === portN &&
    connKind(connection.a) === kind
  ) {
    return connection.b;
  }
  return connection.a;
}

// Returns a base64 data URL jsPDF can embed, or null if there's nothing
// usable. Photos captured in-app are already data URLs and pass straight
// through; legacy blob: URLs from an earlier session will fail the fetch
// and return null rather than breaking the whole export.
async function blobUrlToDataUrl(url) {
  if (!url) return null;
  if (typeof url === "string" && url.startsWith("data:")) return url;
  try {
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onloadend = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    return null;
  }
}

async function exportRackPdf(cabinet, site, client) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "pt", format: "letter" });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margin = 40;

  // ---------- Cover page: site info + rack layout diagram ----------
  doc.setFont("helvetica", "bold");
  doc.setFontSize(20);
  doc.setTextColor(0);
  doc.text(cabinet.name, margin, 50);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(11);
  doc.setTextColor(100);
  const subtitle = [
    client?.name,
    site?.name,
    RACK_TYPES.find((t) => t.id === cabinet.rackType)?.label,
    `${cabinet.size}U`,
    cabinet.category,
  ].filter(Boolean).join("   \u00b7   ");
  doc.text(subtitle, margin, 68);

  let infoY = 90;
  if (site) {
    doc.setDrawColor(220);
    doc.setLineWidth(0.5);
    doc.line(margin, infoY, pageWidth - margin, infoY);
    infoY += 16;

    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.setTextColor(140);
    doc.text("SITE INFORMATION", margin, infoY);
    infoY += 14;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(9.5);
    doc.setTextColor(30);
    const fullAddress = [site.address, site.city, site.state, site.zip].filter(Boolean).join(", ");
    const infoLines = [
      [`Client: ${client?.name || "\u2014"}`],
      [`Location ID: ${site.code || "\u2014"}`, `Building: ${cabinet.location || "\u2014"}`],
      [`Address: ${fullAddress || "\u2014"}`],
      [
        `Last Modified: ${cabinet.lastModified ? new Date(cabinet.lastModified).toLocaleString() : "\u2014"}`,
        `Exported: ${new Date().toLocaleString()}`,
      ],
    ];
    infoLines.forEach((cols) => {
      doc.text(cols.join("     "), margin, infoY);
      infoY += 13;
    });

    const contacts = site.contacts || [];
    if (contacts.length > 0) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(8.5);
      doc.setTextColor(140);
      doc.text("CONTACTS", margin, infoY);
      infoY += 12;
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(30);
      contacts.forEach((c) => {
        const line = [c.name, c.role, c.phone, c.email].filter(Boolean).join("   \u00b7   ");
        doc.text(line, margin, infoY);
        infoY += 12;
      });
    }
    infoY += 8;
    doc.setDrawColor(220);
    doc.line(margin, infoY, pageWidth - margin, infoY);
    infoY += 16;
  } else {
    infoY = 100;
  }

  // ---------- Page 1 photos ----------
  // Two rows: where it is (site + building) above what it looked like
  // (before + after). Location context reads first, then the work itself.
  const building = (site?.buildings || []).find((b) => b.id === cabinet.buildingId);
  const siteImg = await blobUrlToDataUrl(site?.snapshot);
  const buildingImg = await blobUrlToDataUrl(building?.photo);
  const beforeImg = await blobUrlToDataUrl(cabinet.photoBefore);
  const afterImg = await blobUrlToDataUrl(cabinet.photoAfter);

  const slotGap = 14;
  const totalW = pageWidth - margin * 2;

  // Draws one labelled photo box, fitted to preserve aspect ratio so a
  // portrait phone photo isn't stretched into a landscape smear.
  const drawShot = (img, label, x, y, w, h) => {
    if (!img) return;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8);
    doc.setTextColor(90);
    doc.text(label, x, y + 8);

    const boxY = y + 13;
    doc.setDrawColor(210);
    doc.setLineWidth(0.6);
    doc.rect(x, boxY, w, h);
    try {
      const props = doc.getImageProperties(img);
      const scale = Math.min((w - 6) / props.width, (h - 6) / props.height);
      const iw = props.width * scale;
      const ih = props.height * scale;
      doc.addImage(img, x + (w - iw) / 2, boxY + (h - ih) / 2, iw, ih);
    } catch (e) {
      doc.setFont("helvetica", "normal");
      doc.setFontSize(8);
      doc.setTextColor(160);
      doc.text("Photo unavailable", x + 8, boxY + h / 2);
    }
  };

  // Renders a row of up to two photos. A lone photo takes half the width so
  // it doesn't balloon across the page.
  const drawPhotoRow = (heading, entries, y, rowH) => {
    const shown = entries.filter((e) => !!e.img);
    if (!shown.length) return y;
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9);
    doc.setTextColor(140);
    doc.text(heading, margin, y);
    let rowY = y + 10;
    const w = shown.length === 1 ? (totalW - slotGap) / 2 : (totalW - slotGap) / 2;
    shown.forEach((e, i) => drawShot(e.img, e.label, margin + i * (w + slotGap), rowY, w, rowH));
    return rowY + 13 + rowH + 18;
  };

  const hasLocationShots = !!(siteImg || buildingImg);
  const hasRackShots = !!(beforeImg || afterImg);

  if (hasLocationShots || hasRackShots) {
    const rowH = hasLocationShots && hasRackShots ? 150 : 190;

    infoY = drawPhotoRow("SITE & BUILDING", [
      { img: siteImg, label: "SITE" },
      { img: buildingImg, label: "BUILDING" },
    ], infoY, rowH);

    infoY = drawPhotoRow("CABINET", [
      { img: beforeImg, label: "BEFORE" },
      { img: afterImg, label: "AFTER" },
    ], infoY, rowH);
  }

  // ---------- Page 2: rack elevation with component names ----------
  // Always its own page now, so the elevation prints full height instead of
  // fighting the photos for whatever space is left on the cover.
  doc.addPage();
  doc.setFont("helvetica", "bold");
  doc.setFontSize(16);
  doc.setTextColor(0);
  doc.text("Rack Elevation", margin, 40);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(8);
  doc.setTextColor(110);
  doc.text(
    `${cabinet.name}${site?.name ? "  \u00b7  " + site.name : ""}${cabinet.location ? "  \u00b7  " + cabinet.location : ""}`,
    margin, 54
  );

  const diagramTop = 72;
  const gutterWidth = 26;
  const rackLeft = margin + gutterWidth;
  const rackWidth = pageWidth - margin * 2 - gutterWidth;

  const uHeightPx = (pageHeight - diagramTop - margin) / cabinet.size;

  doc.setDrawColor(20);
  doc.setLineWidth(1.2);
  doc.rect(rackLeft, diagramTop, rackWidth, uHeightPx * cabinet.size);

  const occ = new Array(cabinet.size).fill(null);
  cabinet.components.forEach((c) => {
    for (let i = 0; i < c.uHeight; i++) {
      const idx = c.uStart + i;
      if (idx < cabinet.size) occ[idx] = c;
    }
  });

  let u = 0;
  while (u < cabinet.size) {
    const comp = occ[u];
    const y = diagramTop + u * uHeightPx;

    doc.setFont("helvetica", "normal");
    doc.setFontSize(6.5);
    doc.setTextColor(140);
    doc.text(String(u + 1), margin, y + uHeightPx / 2 + 2);

    if (comp) {
      const h = comp.uHeight * uHeightPx;
      doc.setFillColor(236, 236, 241);
      doc.setDrawColor(70);
      doc.setLineWidth(0.6);
      doc.rect(rackLeft, y, rackWidth, h, "FD");

      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.setTextColor(20);
      doc.text(comp.name, rackLeft + 6, y + 13);

      const metaLine = [comp.manufacturer, comp.model].filter(Boolean).join(" ");
      if (metaLine && h > 16) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(7.5);
        doc.setTextColor(100);
        doc.text(metaLine, rackLeft + 6, y + 24);
      }
      u += comp.uHeight;
    } else {
      doc.setDrawColor(225);
      doc.setLineWidth(0.4);
      doc.rect(rackLeft, y, rackWidth, uHeightPx);
      u += 1;
    }
  }

  // ---------- Page 2: the same elevation, drawn with every port ----------
  // The cover diagram answers "what's in this rack"; this one answers
  // "what's patched where" at a glance, mirroring the on-screen rack view
  // including active/PoE/fiber colouring.
  // Tall racks are split across pages. Squeezing 48U onto one sheet gives
  // about 14pt per unit, which is where the component names start colliding
  // with the port rows below them. 24U per page keeps every row readable and
  // matches how these racks are usually talked about.
  const U_PER_PAGE = 24;
  const detailLeft = margin + gutterWidth;
  const detailWidth = pageWidth - margin * 2 - gutterWidth;
  const detailTop = 86;

  const legend = [
    { label: "Active", fill: [34, 197, 94] },
    { label: "PoE", fill: [245, 158, 11] },
    { label: "Mapped", fill: [255, 237, 213] },
    { label: "Empty", fill: [255, 255, 255] },
    { label: "No jack", fill: [244, 244, 245] },
  ];

  // Header, subtitle and legend repeat on every page so each sheet stands
  // on its own if they get separated.
  const drawDetailHeader = (fromU, toU, showRange) => {
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.setTextColor(0);
    doc.text("Rack Elevation \u2014 Port Detail", margin, 40);

    if (showRange) {
      doc.setFont("helvetica", "bold");
      doc.setFontSize(9);
      doc.setTextColor(120);
      const rangeText = `U${fromU}\u2013U${toU}`;
      doc.text(rangeText, pageWidth - margin - doc.getTextWidth(rangeText), 40);
    }

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(110);
    doc.text(
      `${cabinet.name}${site?.name ? "  \u00b7  " + site.name : ""}${cabinet.location ? "  \u00b7  " + cabinet.location : ""}`,
      margin, 54
    );

    let legendX = margin;
    const legendY = 68;
    doc.setFontSize(7);
    legend.forEach((item) => {
      doc.setFillColor(...item.fill);
      doc.setDrawColor(150);
      doc.setLineWidth(0.4);
      doc.rect(legendX, legendY - 5, 7, 7, "FD");
      doc.setTextColor(90);
      doc.text(item.label, legendX + 10, legendY + 0.5);
      legendX += 12 + doc.getTextWidth(item.label) + 12;
    });
  };

  // Draws one component's ports as a grid of small squares, laid out to
  // match its configured row count and honouring unfitted keystones.
  const drawPortsForComponent = (comp, x, y, w, h) => {
    const allPorts = comp.ports || [];
    if (!allPorts.length) return;
    const dataPorts = comp.type === "fiber_tray" ? allPorts : allPorts.filter((p) => (p.kind || "data") !== "sfp");
    const sfpPorts = comp.type === "fiber_tray" ? [] : allPorts.filter((p) => p.kind === "sfp");
    const rows = comp.portLayout?.rows === 2 ? 2 : 1;
    const sfpRows = comp.portLayout?.sfpRows === 2 ? 2 : 1;

    const rowsOf = (list, n) =>
      n === 2
        ? [list.filter((_, i) => i % 2 === 0), list.filter((_, i) => i % 2 === 1)]
        : [list, []];
    const [dRow1, dRow2] = rowsOf(dataPorts, rows);
    const [sRow1, sRow2] = rowsOf(sfpPorts, sfpRows);

    const perRow = Math.max(dRow1.length, dRow2.length, 1);
    const sfpPerRow = Math.max(sRow1.length, sRow2.length, 0);
    // Reserve room for the SFP cluster on the right when there is one.
    const sfpZone = sfpPerRow ? Math.min(w * 0.22, sfpPerRow * 16 + 8) : 0;
    const mainZone = w - sfpZone - (sfpZone ? 8 : 0);

    const gap = 1.6;
    const boxW = Math.min(13, (mainZone - 10 - gap * (perRow - 1)) / perRow);
    const rowCount = dRow2.length ? 2 : 1;
    const boxH = Math.min(boxW, (h - 20 - (rowCount - 1) * gap) / rowCount);
    const startY = y + h / 2 - (rowCount * boxH + (rowCount - 1) * gap) / 2 + 4;

    const drawBox = (p, bx, by, bw, bh) => {
      if (p.absent) {
        // Unfitted position: hollow dashed-looking outline that still
        // occupies its slot, so numbering doesn't visually shift.
        doc.setFillColor(244, 244, 245);
        doc.setDrawColor(205);
        doc.setLineWidth(0.3);
        doc.rect(bx, by, bw, bh, "FD");
        return;
      }
      const conn = findConnection(cabinet, comp.id, p.n, p.kind || "data");
      if (p.fiberType) {
        const hex = fiberColor(p.fiberType).replace("#", "");
        doc.setFillColor(
          parseInt(hex.slice(0, 2), 16), parseInt(hex.slice(2, 4), 16), parseInt(hex.slice(4, 6), 16)
        );
      } else if (p.isActive) doc.setFillColor(34, 197, 94);
      else if (p.hasPoe) doc.setFillColor(245, 158, 11);
      else if (conn) doc.setFillColor(255, 237, 213);
      else doc.setFillColor(255, 255, 255);

      doc.setDrawColor(120);
      doc.setLineWidth(0.35);
      doc.rect(bx, by, bw, bh, "FD");

      if (bw >= 8) {
        doc.setFont("helvetica", "normal");
        doc.setFontSize(Math.min(5.5, bw * 0.55));
        doc.setTextColor(p.isActive || p.hasPoe ? 255 : 90);
        const label = String(p.n);
        doc.text(label, bx + bw / 2 - doc.getTextWidth(label) / 2, by + bh / 2 + 1.6);
      }
    };

    [dRow1, dRow2].forEach((rowPorts, rIdx) => {
      if (!rowPorts.length) return;
      const by = startY + rIdx * (boxH + gap);
      rowPorts.forEach((p, cIdx) => drawBox(p, x + 5 + cIdx * (boxW + gap), by, boxW, boxH));
    });

    if (sfpPerRow) {
      const sBoxW = Math.min(15, (sfpZone - 6 - gap * (sfpPerRow - 1)) / sfpPerRow);
      const sRowCount = sRow2.length ? 2 : 1;
      const sBoxH = Math.min(boxH, (h - 20 - (sRowCount - 1) * gap) / sRowCount);
      const sStartY = y + h / 2 - (sRowCount * sBoxH + (sRowCount - 1) * gap) / 2 + 4;
      const sStartX = x + w - sfpZone;
      [sRow1, sRow2].forEach((rowPorts, rIdx) => {
        if (!rowPorts.length) return;
        const by = sStartY + rIdx * (sBoxH + gap);
        rowPorts.forEach((p, cIdx) => drawBox(p, sStartX + cIdx * (sBoxW + gap), by, sBoxW, sBoxH));
      });
    }
  };

  const pageCount = Math.ceil(cabinet.size / U_PER_PAGE);

  for (let page = 0; page < pageCount; page++) {
    const startU = page * U_PER_PAGE;
    const endU = Math.min(startU + U_PER_PAGE, cabinet.size); // exclusive
    const unitsHere = endU - startU;

    doc.addPage();
    drawDetailHeader(startU + 1, endU, pageCount > 1);

    // Every page uses the same per-U height so a 48U rack's two sheets are
    // directly comparable rather than one being stretched.
    const detailUHeight = Math.min(46, (pageHeight - detailTop - margin) / Math.min(cabinet.size, U_PER_PAGE));

    doc.setDrawColor(20);
    doc.setLineWidth(1.2);
    doc.rect(detailLeft, detailTop, detailWidth, detailUHeight * unitsHere);

    let du = startU;
    while (du < endU) {
      const comp = occ[du];
      const y = detailTop + (du - startU) * detailUHeight;

      doc.setFont("helvetica", "normal");
      doc.setFontSize(6.5);
      doc.setTextColor(140);
      doc.text(String(du + 1), margin, y + detailUHeight / 2 + 2);

      if (comp) {
        // A component can start before this page (if it straddles the
        // boundary). Draw only the part that belongs here, and skip its
        // label on the continuation page.
        const compStart = cabinet.components.find((c) => c.id === comp.id)?.uStart ?? du;
        const startsOnThisPage = compStart >= startU;
        const drawnU = Math.min(comp.uHeight - (du - compStart), endU - du);
        const h = drawnU * detailUHeight;

        doc.setFillColor(248, 248, 250);
        doc.setDrawColor(70);
        doc.setLineWidth(0.6);
        doc.rect(detailLeft, y, detailWidth, h, "FD");

        doc.setFont("helvetica", "bold");
        doc.setFontSize(6.5);
        doc.setTextColor(40);
        doc.text(startsOnThisPage ? comp.name : `${comp.name} (cont.)`, detailLeft + 5, y + 9);

        const portCount = (comp.ports || []).filter((p) => !p.absent).length;
        if (portCount && startsOnThisPage) {
          doc.setFont("helvetica", "normal");
          doc.setTextColor(150);
          doc.text(`${portCount} ports`, detailLeft + detailWidth - 5 - doc.getTextWidth(`${portCount} ports`), y + 9);
        }

        if (startsOnThisPage) drawPortsForComponent(comp, detailLeft, y, detailWidth, h);
        du += drawnU;
      } else {
        doc.setDrawColor(225);
        doc.setLineWidth(0.4);
        doc.rect(detailLeft, y, detailWidth, detailUHeight);
        du += 1;
      }
    }
  }

  // ---------- Detail sections: full port tables per device ----------
  // Picks the largest font and padding that still lets the whole table land
  // on one page. A 48-port switch is 52 rows; at the default 8pt/4pad that
  // needs ~900pt of height and only ~660pt is available, so it has to tighten
  // rather than spill.
  const tableDensity = (rowCount, startY) => {
    const avail = pageHeight - startY - margin;
    const budget = avail / (rowCount + 1); // +1 for the header row
    const steps = [
      { fontSize: 8, cellPadding: 4 },
      { fontSize: 7.5, cellPadding: 3 },
      { fontSize: 7, cellPadding: 2.5 },
      { fontSize: 6.5, cellPadding: 2 },
      { fontSize: 6.2, cellPadding: 1.6 },
      { fontSize: 5.6, cellPadding: 1.2 },
    ];
    const fits = steps.find((s) => s.fontSize * 1.15 + s.cellPadding * 2 <= budget);
    return fits || steps[steps.length - 1];
  };

  const addDeviceSection = async (title, comps, opts = {}) => {
    if (comps.length === 0) return;
    doc.addPage();
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.setTextColor(0);
    doc.text(title, margin, 40);
    let cursorY = 62;

    for (let idx = 0; idx < comps.length; idx++) {
      const comp = comps[idx];
      // Every device gets its own sheet. A port table split across a page
      // break is hard to read in the field — you lose the header and can't
      // tell at a glance which device the second half belongs to.
      if (idx > 0) {
        doc.addPage();
        cursorY = 40;
      }
      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      doc.setTextColor(0);
      doc.text(comp.name, margin, cursorY);

      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(100);
      const metaBits = [
        comp.manufacturer,
        comp.model,
        comp.serial ? `SN: ${comp.serial}` : null,
        comp.mac ? `MAC: ${comp.mac}` : null,
        comp.ports ? `${comp.ports.length} ports` : null,
      ].filter(Boolean);
      doc.text(metaBits.join("   \u00b7   "), margin, cursorY + 13);
      cursorY += 20;

      // Optional per-component extra content (e.g. UPS QR photo)
      if (opts.extraContent) {
        cursorY = await opts.extraContent(doc, comp, cursorY, margin, pageWidth);
      }

      // PDUs get their own table — outlets have nothing to say about VLANs
      // or patch mappings, so the standard columns would print mostly empty.
      if (comp.type === "pdu") {
        const outletRows = (comp.ports || []).map((p) => [
          `${p.kind === "rear" ? "Rear" : "Front"} ${p.n}`,
          p.device || "\u2014",
          p.label || "\u2014",
          p.notes || "",
        ]);
        if (outletRows.length) {
          const dp = tableDensity(outletRows.length, cursorY);
          doc.autoTable({
            startY: cursorY,
            head: [["Outlet", "Plugged In", "Circuit / Label", "Notes"]],
            body: outletRows,
            theme: "grid",
            styles: { fontSize: dp.fontSize, cellPadding: dp.cellPadding },
            headStyles: { fillColor: [31, 41, 55], textColor: 255, fontSize: dp.fontSize },
            margin: { left: margin, right: margin },
          });
          cursorY = doc.lastAutoTable.finalY + 18;
        }
        continue;
      }

      // Unfitted keystone positions aren't ports — leave them out of the
      // printed table rather than listing two dozen empty rows.
      const rows = (comp.ports || []).filter((p) => !p.absent).map((p) => {
        const conn = findConnection(cabinet, comp.id, p.n, (p.kind || "data"));
        let mappedTo = "\u2014";
        if (conn) {
          const other = otherEnd(conn, comp.id, p.n, (p.kind || "data"));
          const otherComp = cabinet.components.find((c) => c.id === other.compId);
          mappedTo = otherComp ? `${otherComp.name} \u00b7 Port ${other.port}` : "\u2014";
        }
        // An SFP uplink usually leaves the rack, so its free-text
        // destination is the only record of where the run actually goes.
        if (mappedTo === "\u2014" && p.destination) mappedTo = p.destination;
        const flags = [
          p.isActive ? "Active" : null,
          p.hasPoe ? "PoE" : null,
          p.fiberType ? fiberLabel(p.fiberType) : null,
        ].filter(Boolean).join(", ") || "\u2014";
        return [
          String(p.n) + (p.kind === "sfp" ? " (SFP)" : ""),
          p.label || "\u2014",
          p.vlan || "\u2014",
          p.device || "\u2014",
          mappedTo,
          flags,
          p.notes || "",
        ];
      });

      if (rows.length > 0) {
        const d = tableDensity(rows.length, cursorY);
        doc.autoTable({
          startY: cursorY,
          margin: { left: margin, right: margin },
          head: [["Port", "Label", "VLAN", "Device", "Mapped To", "Flags", "Notes"]],
          body: rows,
          styles: { fontSize: d.fontSize, cellPadding: d.cellPadding, overflow: "linebreak" },
          headStyles: { fillColor: [30, 30, 30], fontSize: d.fontSize },
          theme: "grid",
        });
        cursorY = doc.lastAutoTable.finalY + 8;
      }
    }
  };

  // Fiber trays use slots (color + destination) rather than the
  // VLAN/device port model, so they get their own table layout.
  const addFiberTraySection = (comps) => {
    if (comps.length === 0) return;
    doc.addPage();
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.setTextColor(0);
    doc.text("Fiber Tray Configuration", margin, 40);
    let cursorY = 62;

    comps.forEach((comp, idx) => {
      if (idx > 0) {
        cursorY += 18;
        if (cursorY > pageHeight - 140) { doc.addPage(); cursorY = 40; }
      }
      doc.setFont("helvetica", "bold");
      doc.setFontSize(12);
      doc.setTextColor(0);
      doc.text(comp.name, margin, cursorY);
      doc.setFont("helvetica", "normal");
      doc.setFontSize(9);
      doc.setTextColor(100);
      const metaBits = [comp.manufacturer, comp.model, `${(comp.ports || []).length} slots`].filter(Boolean);
      doc.text(metaBits.join("   \u00b7   "), margin, cursorY + 13);

      const rows = (comp.ports || []).map((p) => [
        String(p.n),
        p.fiberType ? fiberLabel(p.fiberType) : "Unassigned",
        p.destination || "\u2014",
        p.notes || "",
      ]);

      doc.autoTable({
        startY: cursorY + 20,
        margin: { left: margin, right: margin },
        head: [["Slot", "Fiber Type / Color", "What's in this Slot", "Notes"]],
        body: rows,
        styles: { fontSize: 8, cellPadding: 4, overflow: "linebreak" },
        headStyles: { fillColor: [30, 30, 30] },
        theme: "grid",
      });
      cursorY = doc.lastAutoTable.finalY + 8;
    });
  };

  // Devices with no ports at all (Shelf, Provider Equipment w/o ports,
  // Generic/Other) — just a compact identity table, one row each.
  const addNonPortSection = (comps) => {
    if (comps.length === 0) return;
    doc.addPage();
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.setTextColor(0);
    doc.text("Other Installed Equipment", margin, 40);

    const rows = comps.map((c) => [
      `U${c.uStart + 1}${c.uHeight > 1 ? `-U${c.uStart + c.uHeight}` : ""}`,
      c.name,
      COMPONENT_TYPES[c.type]?.label || c.type,
      c.manufacturer || "\u2014",
      c.model || "\u2014",
      c.serial || "\u2014",
      c.notes || "",
    ]);

    doc.autoTable({
      startY: 62,
      margin: { left: margin, right: margin },
      head: [["U Position", "Name", "Type", "Manufacturer", "Model", "Serial", "Notes"]],
      body: rows,
      styles: { fontSize: 8, cellPadding: 4, overflow: "linebreak" },
      headStyles: { fillColor: [30, 30, 30] },
      theme: "grid",
    });
  };

  const patchPanels = cabinet.components.filter((c) => c.type === "patch_panel");
  const switches = cabinet.components.filter(
    (c) => c.type === "switch" || c.type === "fiber_switch" || c.type === "router" || c.type === "provider_equipment"
  );
  const upsUnits = cabinet.components.filter((c) => c.type === "ups");
  const fiberTrays = cabinet.components.filter((c) => c.type === "fiber_tray");
  const otherEquipment = cabinet.components.filter(
    (c) => !c.ports || (c.type !== "patch_panel" && c.type !== "switch" && c.type !== "fiber_switch" &&
      c.type !== "router" && c.type !== "provider_equipment" && c.type !== "ups" && c.type !== "fiber_tray")
  );

  await addDeviceSection("Patch Panel Configuration", patchPanels);
  await addDeviceSection("Switch & Network Equipment Configuration", switches);
  await addDeviceSection("UPS Configuration", upsUnits, {
    extraContent: async (doc, comp, cursorY, margin) => {
      if (!comp.photo) return cursorY;
      try {
        const dataUrl = await blobUrlToDataUrl(comp.photo);
        const box = 78;
        // A QR has to stay square to remain scannable, so fit it inside the
        // box rather than stretching it to fixed dimensions.
        const props = doc.getImageProperties(dataUrl);
        const scale = Math.min(box / props.width, box / props.height);
        const w = props.width * scale;
        const h = props.height * scale;

        // Start a new page rather than letting the code run off the bottom.
        let y = cursorY;
        if (y + h + 30 > doc.internal.pageSize.getHeight() - margin) {
          doc.addPage();
          y = margin;
        }

        doc.setFont("helvetica", "bold");
        doc.setFontSize(8);
        doc.setTextColor(90);
        doc.text("QR CODE / MANAGEMENT CARD", margin, y + 10);

        doc.setDrawColor(215);
        doc.setLineWidth(0.6);
        doc.rect(margin, y + 16, box, box);
        doc.addImage(dataUrl, margin + (box - w) / 2, y + 16 + (box - h) / 2, w, h);
        return y + box + 28;
      } catch (e) {
        return cursorY;
      }
    },
  });
  addFiberTraySection(fiberTrays);
  addNonPortSection(otherEquipment);

  const safeName = cabinet.name.replace(/[^a-z0-9]/gi, "_");
  const safeClientName = (client?.name || "").replace(/[^a-z0-9]/gi, "_");
  doc.save(`${safeClientName ? safeClientName + "_" : ""}${safeName}_rack_report.pdf`);
}

function exportRackXlsx(cabinet, site, client) {
  // Sheet 1: full site details + contacts, so the file is self-contained
  // without needing to cross-reference the app.
  const fullAddress = site ? [site.address, site.city, site.state, site.zip].filter(Boolean).join(", ") : "";
  const siteInfoRows = [
    ["Site Information"],
    ["Client", client?.name || ""],
    ["Site Name", site?.name || ""],
    ["Location ID", site?.code || ""],
    ["Address", fullAddress],
    ["City", site?.city || ""],
    ["State", site?.state || ""],
    ["Zip", site?.zip || ""],
    ["Building", cabinet.location || ""],
    ["Rack / Cabinet", cabinet.name],
    ["Rack Category", cabinet.category || ""],
    ["Last Modified", cabinet.lastModified ? new Date(cabinet.lastModified).toLocaleString() : ""],
    ["Exported", new Date().toLocaleString()],
    [],
    ["Contacts"],
    ["Name", "Role", "Phone", "Email"],
    ...((site?.contacts || []).map((c) => [c.name || "", c.role || "", c.phone || "", c.email || ""])),
  ];

  // Sheet 2: every component in the rack, one row each.
  const componentRows = cabinet.components
    .slice()
    .sort((a, b) => a.uStart - b.uStart)
    .map((c) => ({
      "U Position": `U${c.uStart + 1}${c.uHeight > 1 ? `-U${c.uStart + c.uHeight}` : ""}`,
      "Name": c.name,
      "Type": COMPONENT_TYPES[c.type]?.label || c.type,
      "Manufacturer": c.manufacturer || "",
      "Model": c.model || "",
      "Serial Number": c.serial || "",
      "MAC Address": c.mac || "",
      "Port Count": c.ports ? c.ports.length : "",
      "Photo Attached": c.photo ? "Yes" : "No",
      "Notes": c.notes || "",
    }));

  // Sheet 3: every port across every port-having component, with full
  // mapping detail — the "deep dive" sheet for filtering/pivoting.
  const portRows = [];
  cabinet.components.forEach((comp) => {
    (comp.ports || []).filter((p) => !p.absent).forEach((p) => {
      const conn = findConnection(cabinet, comp.id, p.n, (p.kind || "data"));
      let mappedToComponent = "";
      let mappedToPort = "";
      if (conn) {
        const other = otherEnd(conn, comp.id, p.n, (p.kind || "data"));
        const otherComp = cabinet.components.find((c) => c.id === other.compId);
        mappedToComponent = otherComp ? otherComp.name : "";
        mappedToPort = other.port;
      }
      portRows.push({
        "Component": comp.name,
        "Component Type": COMPONENT_TYPES[comp.type]?.label || comp.type,
        "Manufacturer": comp.manufacturer || "",
        "Model": comp.model || "",
        "Port #": p.n,
        "Port Kind": p.kind === "sfp" ? "SFP" : "Data",
        "Label": p.label || "",
        "VLAN": p.vlan || "",
        "Connected Device": p.device || "",
        "Mapped To Component": mappedToComponent,
        "Mapped To Port": mappedToPort,
        "Active": p.isActive ? "Yes" : "No",
        "PoE": p.hasPoe ? "Yes" : "No",
        "Fiber Type": p.fiberType ? fiberLabel(p.fiberType) : "",
        "Destination": p.destination || "",
        "Notes": p.notes || "",
      });
    });
  });

  const wb = XLSX.utils.book_new();
  const wsSiteInfo = XLSX.utils.aoa_to_sheet(siteInfoRows);
  const wsComponents = XLSX.utils.json_to_sheet(componentRows);
  const wsPorts = XLSX.utils.json_to_sheet(portRows);
  XLSX.utils.book_append_sheet(wb, wsSiteInfo, "Site Info");
  XLSX.utils.book_append_sheet(wb, wsComponents, "Components");
  XLSX.utils.book_append_sheet(wb, wsPorts, "Port Mapping");

  const safeName = cabinet.name.replace(/[^a-z0-9]/gi, "_");
  const safeSite = (site?.name || "").replace(/[^a-z0-9]/gi, "_");
  const safeClient = (client?.name || "").replace(/[^a-z0-9]/gi, "_");
  XLSX.writeFile(
    wb,
    `${safeClient ? safeClient + "_" : ""}${safeSite ? safeSite + "_" : ""}${safeName}_mapping.xlsx`
  );
}

function PortsTab({ cabinet, comp, onUpdateCabinet, isFiber, onClose }) {
  const [openPort, setOpenPort] = useState(null);

  const cols = comp.ports.length > 24 ? "grid-cols-6" : "grid-cols-4";

  return (
    <div className="flex flex-col h-full -mx-5 -my-4">
      <div className={`grid ${cols} gap-2 p-4 flex-1 overflow-y-auto`}>
        {comp.ports.map((p) => {
          if (p.absent) {
            // Keeps the grid cell so the numbering stays visually aligned
            // with the physical panel, but makes clear nothing is fitted.
            return (
              <div
                key={`${p.kind || "data"}-${p.n}`}
                className="border border-dashed border-gray-200 rounded-lg p-2 flex items-center justify-center text-[11px] text-gray-300"
              >
                {p.n} · no jack
              </div>
            );
          }
          const conn = findConnection(cabinet, comp.id, p.n, (p.kind || "data"));
          const bg = isFiber && p.fiberType ? fiberColor(p.fiberType) : null;
          const linkedEnd = conn ? otherEnd(conn, comp.id, p.n, (p.kind || "data")) : null;
          const linkedComp = linkedEnd ? cabinet.components.find((c) => c.id === linkedEnd.compId) : null;
          const isActive = p.isActive || false;
          const hasPoe = p.hasPoe || false;
          
          // If port is active or linked port is active, show green
          let linkedPortIsActive = false;
          if (linkedComp && linkedEnd) {
            const linkedPort = linkedComp.ports.find(port => port.n === linkedEnd.port && port.kind === (linkedEnd.kind || "data"));
            linkedPortIsActive = linkedPort?.isActive || false;
          }
          const shouldBeGreen = isActive || linkedPortIsActive;
          
          return (
            <button
              key={`${p.kind || "data"}-${p.n}`}
              onClick={() => setOpenPort(p)}
              style={bg ? { backgroundColor: bg } : undefined}
              className={`aspect-square rounded-md border text-[10px] font-semibold flex flex-col items-center justify-center gap-0.5 relative
                ${bg ? "border-black/10 text-black/70" : shouldBeGreen ? "bg-green-100 border-green-400 text-green-700" : conn ? "bg-orange-50 border-orange-300 text-orange-700" : "bg-white border-gray-300 text-gray-500"}
                ${p.kind === "sfp" ? "ring-1 ring-gray-400" : ""}
              `}
            >
              <span>{p.n}</span>
              {linkedComp && !isFiber && (
                <span className="text-[8px] leading-none opacity-75">{linkedComp.name.split(" ")[0]}</span>
              )}
              <div className="absolute bottom-1 right-1 flex items-center gap-0.5">
                {hasPoe && <Zap size={8} className="text-amber-500" />}
                {conn && !isFiber && <Link2 size={9} />}
              </div>
            </button>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-3 text-[11px] text-gray-400">
        {isFiber ? (
          FIBER_TYPES.map((f) => (
            <span key={f.id} className="flex items-center gap-1">
              <span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ backgroundColor: f.color }} />
              {f.label}
            </span>
          ))
        ) : (
          <>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-orange-50 border border-orange-300 inline-block" /> Mapped</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm bg-white border border-gray-300 inline-block" /> Open</span>
            <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-sm ring-1 ring-gray-400 inline-block" /> SFP</span>
          </>
        )}
      </div>

      {openPort && (
        <PortEditor
          cabinet={cabinet}
          comp={comp}
          port={openPort}
          isFiber={isFiber}
          onClose={() => setOpenPort(null)}
          onUpdateCabinet={onUpdateCabinet}
        />
      )}
    </div>
  );
}

function PortEditor({ cabinet, comp, port, isFiber, onClose, onUpdateCabinet, library, setLibrary }) {
  const existingConn = findConnection(cabinet, comp.id, port.n, (port.kind || "data"));
  const linkedEnd = existingConn ? otherEnd(existingConn, comp.id, port.n, (port.kind || "data")) : null;
  const linkedComp = linkedEnd ? cabinet.components.find((c) => c.id === linkedEnd.compId) : null;

  // Slide in from the right on mount, and slide back out before actually
  // closing, instead of appearing/disappearing instantly.
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const raf = requestAnimationFrame(() => setVisible(true));
    return () => cancelAnimationFrame(raf);
  }, []);
  const handleClose = () => {
    setVisible(false);
    setTimeout(onClose, 300);
  };

  const [targetCompId, setTargetCompId] = useState(linkedEnd?.compId || "");
  const [targetPort, setTargetPort] = useState(
    linkedEnd ? `${linkedEnd.kind || "data"}:${linkedEnd.port}` : ""
  );
  const [fiberType, setFiberType] = useState(port.fiberType || "");
  const [destination, setDestination] = useState(port.destination || "");
  const [label, setLabel] = useState(port.label || "");
  const [vlan, setVlan] = useState(port.vlan || "");
  const initialDeviceType = DEVICE_TYPES.includes(port.device) ? port.device : (port.device ? "Other" : "");
  const [deviceType, setDeviceType] = useState(initialDeviceType);
  const [deviceOther, setDeviceOther] = useState(DEVICE_TYPES.includes(port.device) ? "" : (port.device || ""));
  const [notes, setNotes] = useState(port.notes || "");
  const [isActive, setIsActive] = useState(port.isActive || false);
  const [hasPoe, setHasPoe] = useState(port.hasPoe || false);
  // The adapter plate fitted into this tray slot, if any.
  const [adapter, setAdapter] = useState(port.adapter || null);
  // An SFP cage can terminate on one strand of a tray adapter plate.
  // A duplex link occupies two strands (TX and RX), so this holds up to two.
  // Older saves stored a single number — normalise those to an array.
  const [fiberLink, setFiberLink] = useState(() => {
    const l = port.fiberLink;
    if (!l) return { compId: "", slot: "", fibers: [] };
    const fibers = Array.isArray(l.fibers)
      ? l.fibers
      : l.fiber != null && l.fiber !== "" ? [l.fiber] : [];
    return { compId: l.compId || "", slot: l.slot || "", fibers };
  });

  // Tapping a strand toggles it. Two is the cap — a duplex pair — and
  // picking a third replaces the oldest so it stays a two-tap operation.
  const toggleStrand = (n) =>
    setFiberLink((l) => {
      const cur = l.fibers || [];
      if (cur.includes(n)) return { ...l, fibers: cur.filter((x) => x !== n) };
      if (cur.length >= 2) return { ...l, fibers: [cur[1], n] };
      return { ...l, fibers: [...cur, n].sort((a, b) => a - b) };
    });

  const fiberTrays = cabinet.components.filter((c) => c.type === "fiber_tray");
  const linkTray = fiberTrays.find((t) => t.id === fiberLink.compId);
  const linkTraySlots = (linkTray?.ports || []).slice().sort((a, b) => a.n - b.n);
  const linkSlot = linkTraySlots.find((s) => s.n === fiberLink.slot);
  // Flag strands already claimed by another SFP so two uplinks don't get
  // recorded on the same physical fiber without you noticing.
  const linkStrands = linkSlot?.adapter
    ? Array.from({ length: linkSlot.adapter.count || 0 }, (_, i) => {
        const n = i + 1;
        const fp = (linkSlot.adapter.ports || []).find((x) => x.n === n) || {};
        let takenBy = null, takenByLabel = "";
        cabinet.components.forEach((c) =>
          (c.ports || []).forEach((p) => {
            if (
              p.kind === "sfp" && p.fiberLink &&
              p.fiberLink.compId === linkTray.id && p.fiberLink.slot === linkSlot.n &&
              linkFibers(p.fiberLink).includes(n)
            ) {
              takenBy = `${c.id}:${p.n}`;
              takenByLabel = `${c.name} \u00b7 SFP ${p.n}`;
            }
          })
        );
        return { n, label: fp.label || fp.destination || "", takenBy, takenByLabel };
      })
    : [];
  // Which physical slot of the tray the plate should sit in. Defaults to the
  // one you opened; changing it moves (or swaps) the plate on save.
  const [targetSlot, setTargetSlot] = useState(port.n);

  const traySlots = isFiber ? (comp.ports || []).map((p) => p.n).sort((a, b) => a - b) : [];
  // A 3-slot tray reads naturally as left/middle/right; anything else is
  // clearer numbered.
  const slotLabels = traySlots.length === 3
    ? ["Left", "Middle", "Right"]
    : traySlots.map((n) => `Slot ${n}`);
  const slotOptions = traySlots.map((n, i) => ({
    n,
    label: slotLabels[i],
    occupied: !!(comp.ports || []).find((p) => p.n === n)?.adapter,
  }));

  const otherComponents = cabinet.components.filter((c) => c.id !== comp.id && COMPONENT_TYPES[c.type].hasPorts);
  const targetComponent = otherComponents.find((c) => c.id === targetCompId);
  const isSfp = !isFiber && port.kind === "sfp";

  const patchPort = (fields) => {
    onUpdateCabinet((cab) => ({
      ...cab,
      components: cab.components.map((c) =>
        c.id === comp.id
          ? { ...c, ports: c.ports.map((p) => (p.n === port.n && p.kind === port.kind ? { ...p, ...fields } : p)) }
          : c
      ),
    }));
  };

  const saveLink = () => {
    const device = deviceType === "Other" ? deviceOther : deviceType;
    if (isFiber) {
      const moving = targetSlot !== port.n;
      onUpdateCabinet((cab) => ({
        ...cab,
        components: cab.components.map((c) => {
          if (c.id !== comp.id) return c;
          // The plate currently sitting in the destination slot, if any —
          // it moves back here rather than being silently destroyed.
          const displaced = moving ? (c.ports.find((p) => p.n === targetSlot) || {}).adapter || null : null;
          return {
            ...c,
            ports: c.ports.map((p) => {
              if (p.n === port.n) {
                return moving
                  ? { ...p, adapter: displaced }
                  : { ...p, fiberType: fiberType || null, destination, isActive, hasPoe, adapter };
              }
              if (moving && p.n === targetSlot) {
                return { ...p, fiberType: fiberType || null, destination, isActive, hasPoe, adapter };
              }
              return p;
            }),
          };
        }),
      }));
      handleClose();
      return;
    }

    const myKind = port.kind || "data";
    const [tgtKind, tgtNum] = targetPort ? String(targetPort).split(":") : [null, null];

    onUpdateCabinet((cab) => {
      const hitsMe = (end) =>
        end.compId === comp.id && end.port === port.n && connKind(end) === myKind;
      let connections = cab.connections.filter((cn) => !hitsMe(cn.a) && !hitsMe(cn.b));
      // also strip any existing connection the target port had (one link per port)
      if (targetCompId && tgtNum) {
        const hitsTarget = (end) =>
          end.compId === targetCompId && end.port === Number(tgtNum) && connKind(end) === tgtKind;
        connections = connections.filter((cn) => !hitsTarget(cn.a) && !hitsTarget(cn.b));
        connections.push({
          id: nextId("conn"),
          a: { compId: comp.id, port: port.n, kind: myKind },
          b: { compId: targetCompId, port: Number(tgtNum), kind: tgtKind },
        });
      }
      // The SFP-to-strand link is stored on both ends so either side can
      // show it without hunting through the whole rack.
      const cleanLink = isSfp && fiberLink.compId && fiberLink.slot && (fiberLink.fibers || []).length
        ? { compId: fiberLink.compId, slot: fiberLink.slot, fibers: [...fiberLink.fibers].sort((a, b) => a - b) }
        : null;
      const meRef = { compId: comp.id, port: port.n };

      return {
        ...cab,
        connections,
        components: cab.components.map((c) => {
          if (c.id === comp.id) {
            return {
              ...c,
              ports: c.ports.map((p) =>
                p.n === port.n && p.kind === port.kind
                  ? {
                      ...p, label, vlan, device, notes, isActive, hasPoe,
                      ...(isSfp ? { fiberType: fiberType || null, destination, fiberLink: cleanLink } : {}),
                    }
                  : p
              ),
            };
          }
          if (!isSfp || c.type !== "fiber_tray") return c;
          // Refresh the reverse reference on every tray: drop any stale
          // pointer back to this SFP, then add the current one.
          return {
            ...c,
            ports: c.ports.map((slot) => {
              if (!slot.adapter) return slot;
              const isTarget = cleanLink && c.id === cleanLink.compId && slot.n === cleanLink.slot;
              const strands = (slot.adapter.ports || []).map((f) => {
                const pointsAtMe = f.sfpLink && f.sfpLink.compId === comp.id && f.sfpLink.port === port.n;
                if (isTarget && cleanLink.fibers.includes(f.n)) return { ...f, sfpLink: meRef };
                if (pointsAtMe) return { ...f, sfpLink: null };
                return f;
              });
              return { ...slot, adapter: { ...slot.adapter, ports: strands } };
            }),
          };
        }),
      };
    });
    handleClose();
  };

  const clearLink = () => {
    const myKind = port.kind || "data";
    const hitsMe = (end) =>
      end.compId === comp.id && end.port === port.n && connKind(end) === myKind;
    onUpdateCabinet((cab) => ({
      ...cab,
      connections: cab.connections.filter((cn) => !hitsMe(cn.a) && !hitsMe(cn.b)),
    }));
    setTargetCompId("");
    setTargetPort("");
  };

  const clearFiberSlot = () => {
    patchPort({ fiberType: null, destination: "", isActive: false, hasPoe: false });
    setFiberType("");
    setDestination("");
    handleClose();
  };

  // Port editor: let touch scroll work naturally inside the overlay

  return (
    <div className="fixed inset-0 z-50 flex justify-end">
      <div
        className={`absolute inset-0 bg-black/40 transition-opacity duration-300 ${visible ? "opacity-100" : "opacity-0"}`}
        onClick={handleClose}
      />
      <div
        className={`relative h-full w-full max-w-md bg-white shadow-2xl flex flex-col transition-transform duration-300 ease-out ${
          visible ? "translate-x-0" : "translate-x-full"
        }`}
      >
        <div className="sticky top-0 bg-white flex items-center justify-between px-5 pt-4 pb-3 border-b border-gray-200 z-10">
          <h4 className="font-semibold text-gray-900 text-sm truncate pr-3">
            {comp.name} &middot; {isFiber ? "Slot" : port.kind === "sfp" ? "SFP" : "Port"} {port.n}
          </h4>
          <button onClick={handleClose} className="p-1 rounded-full hover:bg-gray-100 shrink-0"><X size={16} /></button>
        </div>
        <div className="overflow-y-auto px-5 py-4 flex-1">

        {isFiber ? (
          <>
            <Field label="Slot color / fiber type">
              <div className="flex flex-wrap gap-1.5">
                {FIBER_TYPES.map((f) => (
                  <button
                    key={f.id}
                    onClick={() => {
                      setFiberType(f.id);
                      // The fiber type determines the part number, so fill
                      // the plate in rather than making it a second lookup.
                      const spec = FIBER_PLATE_MODELS[f.id];
                      if (spec) {
                        setAdapter((prev) => ({
                          ...(prev || { align: "center" }),
                          manufacturer: spec.manufacturer,
                          model: spec.model,
                          count: spec.count,
                          rows: rowsForCount(spec.count),
                          ports: Array.from({ length: spec.count }, (_, i) => {
                            const kept = (prev?.ports || []).find((p) => p.n === i + 1);
                            return kept || { n: i + 1, label: "", destination: "" };
                          }),
                        }));
                      }
                    }}
                    className={`px-2.5 py-1.5 rounded-lg text-xs font-medium border flex items-center gap-1.5 ${fiberType === f.id ? "border-black" : "border-gray-300"}`}
                  >
                    <span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ backgroundColor: f.color }} />
                    {f.label}
                  </button>
                ))}
              </div>
            </Field>
            <Field label="What's in this slot">
              <input className={inputClass} value={destination} onChange={(e) => setDestination(e.target.value)} placeholder="e.g. Uplink to IDF Building B" />
            </Field>

            <AdapterPlateBuilder
              adapter={adapter}
              fiberType={fiberType}
              library={library}
              setLibrary={setLibrary}
              onChange={setAdapter}
              cabinet={cabinet}
              slotOptions={slotOptions}
              currentSlot={port.n}
              targetSlot={targetSlot}
              onMoveSlot={setTargetSlot}
            />
          </>
        ) : (
          <>
            {linkedComp && (
              <div className="text-xs bg-orange-50 border border-orange-200 text-orange-700 rounded-lg px-3 py-2 mb-3 flex items-center gap-1.5">
                <Link2 size={12} />
                Linked to {linkedComp.name} &middot; Port {linkedEnd.port}
              </div>
            )}
            <Field label="Port label">
              <input className={inputClass} value={label} onChange={(e) => setLabel(e.target.value)} placeholder="e.g. Room 204 drop" />
            </Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="VLAN">
                <input className={inputClass} value={vlan} onChange={(e) => setVlan(e.target.value)} placeholder="e.g. 20" />
              </Field>
              <Field label="Connected device">
                <select className={inputClass} value={deviceType} onChange={(e) => setDeviceType(e.target.value)}>
                  <option value="">Select...</option>
                  {DEVICE_TYPES.map((d) => <option key={d} value={d}>{d}</option>)}
                </select>
                {deviceType === "Other" && (
                  <input
                    className={`${inputClass} mt-2`}
                    value={deviceOther}
                    onChange={(e) => setDeviceOther(e.target.value)}
                    placeholder="Describe the device"
                  />
                )}
              </Field>
            </div>
            {/* Copper ports patch to another component; an SFP terminates on
                a fiber strand or leaves the rack, so it uses the fiber
                controls below instead. */}
            {!isSfp && (
            <Field label="Map to">
              <div className="flex gap-2">
                <select className={inputClass} value={targetCompId} onChange={(e) => { setTargetCompId(e.target.value); setTargetPort(""); }}>
                  <option value="">Select component...</option>
                  {otherComponents.map((c) => (
                    <option key={c.id} value={c.id}>{c.name}</option>
                  ))}
                </select>
                <select className={`${inputClass} max-w-[100px]`} value={targetPort} onChange={(e) => setTargetPort(e.target.value)} disabled={!targetComponent}>
                  <option value="">Port</option>
                  {targetComponent?.ports.map((p) => (
                    <option key={`${p.kind}-${p.n}`} value={`${p.kind || "data"}:${p.n}`}>
                      {p.n}{p.kind === "sfp" ? " (SFP)" : ""}
                    </option>
                  ))}
                </select>
              </div>
            </Field>
            )}

            {/* SFP uplinks often leave the rack entirely, so they get a
                patch-cable color and a free-text destination instead of
                being forced to map to a component that isn't here. */}
            {isSfp && (
              <>
                <Field label="Fiber patch cable color">
                  <div className="flex flex-wrap gap-1.5">
                    <button
                      onClick={() => setFiberType("")}
                      className={`px-2.5 py-1.5 rounded-lg text-xs font-medium border flex items-center gap-1.5 ${!fiberType ? "border-black" : "border-gray-300"}`}
                    >
                      <span className="w-2.5 h-2.5 rounded-sm inline-block border border-gray-300 bg-white" />
                      None
                    </button>
                    {CABLE_FIBER_TYPES.map((f) => (
                      <button
                        key={f.id}
                        onClick={() => setFiberType(f.id)}
                        className={`px-2.5 py-1.5 rounded-lg text-xs font-medium border flex items-center gap-1.5 ${fiberType === f.id ? "border-black" : "border-gray-300"}`}
                      >
                        <span className="w-2.5 h-2.5 rounded-sm inline-block" style={{ backgroundColor: f.color }} />
                        {f.label}
                      </button>
                    ))}
                  </div>
                </Field>
                <Field label="Goes to (if not in this rack)">
                  <input
                    className={inputClass}
                    value={destination}
                    onChange={(e) => setDestination(e.target.value)}
                    placeholder="e.g. Uplink to MDF Building A"
                  />
                </Field>

                {/* Individual strands are physically tiny on screen, so the
                    link is picked from lists rather than by tapping an 8px
                    adapter. Same result, works on a phone. */}
                {fiberTrays.length > 0 && (
                  <div className="border border-gray-200 rounded-xl p-3 space-y-3">
                    <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide">
                      Fiber Strand In This Rack
                    </div>

                    <Field label="Fiber tray">
                      <select
                        className={inputClass}
                        value={fiberLink.compId || ""}
                        onChange={(e) => setFiberLink({ compId: e.target.value, slot: "", fibers: [] })}
                      >
                        <option value="">Not connected to a tray</option>
                        {fiberTrays.map((t) => (
                          <option key={t.id} value={t.id}>{t.name}</option>
                        ))}
                      </select>
                    </Field>

                    {fiberLink.compId && (
                      <Field label="Slot">
                        <select
                          className={inputClass}
                          value={fiberLink.slot || ""}
                          onChange={(e) => setFiberLink((l) => ({ ...l, slot: Number(e.target.value) || "", fibers: [] }))}
                        >
                          <option value="">Select a slot...</option>
                          {linkTraySlots.map((s) => (
                            <option key={s.n} value={s.n}>
                              {slotDisplayName(linkTraySlots, s.n)}
                              {s.adapter ? ` \u00b7 ${s.adapter.count}F${s.adapter.model ? " " + s.adapter.model : ""}` : " \u00b7 no plate fitted"}
                            </option>
                          ))}
                        </select>
                      </Field>
                    )}

                    {fiberLink.slot && (
                      <Field label={`Strand${(fiberLink.fibers || []).length === 2 ? "s (duplex pair)" : " \u2014 pick one or two"}`}>
                        {linkStrands.length ? (
                          <div className="flex flex-wrap gap-1.5">
                            {linkStrands.map((s) => {
                              const taken = s.takenBy && s.takenBy !== `${comp.id}:${port.n}`;
                              return (
                                <button
                                  key={s.n}
                                  onClick={() => toggleStrand(s.n)}
                                  title={taken ? `Already used by ${s.takenByLabel}` : s.label || undefined}
                                  className={`relative w-9 py-1.5 rounded-lg text-xs font-medium border ${
                                    (fiberLink.fibers || []).includes(s.n)
                                      ? "bg-black text-white border-black"
                                      : taken
                                      ? "bg-amber-50 text-amber-700 border-amber-300"
                                      : "bg-white text-gray-600 border-gray-300"
                                  }`}
                                >
                                  {s.n}
                                </button>
                              );
                            })}
                          </div>
                        ) : (
                          <div className="text-[11px] text-gray-400">
                            That slot has no adapter plate yet — add one from the tray first.
                          </div>
                        )}
                      </Field>
                    )}

                    {fiberLink.compId && (
                      <button
                        onClick={() => setFiberLink({ compId: "", slot: "", fibers: [] })}
                        className="text-[11px] font-medium text-red-600 hover:underline"
                      >
                        Clear fiber link
                      </button>
                    )}
                  </div>
                )}
              </>
            )}
            <div className="flex items-center gap-5 mb-2">
              <label className="flex items-center gap-2 text-xs text-gray-600">
                <input type="checkbox" checked={isActive} onChange={(e) => setIsActive(e.target.checked)} />
                Active (shows green activity light)
              </label>
              {/* PoE is a copper concept — an optical cage never carries it. */}
              {!isSfp && (
                <label className="flex items-center gap-2 text-xs text-gray-600">
                  <input type="checkbox" checked={hasPoe} onChange={(e) => setHasPoe(e.target.checked)} />
                  PoE
                </label>
              )}
            </div>
            <div className="flex items-center gap-4 text-[11px] text-gray-400 mb-3">
              <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-green-500 inline-block" /> Top-right dot = Active</span>
              {!isSfp && (
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-red-500 inline-block" /> Top-left dot = PoE</span>
              )}
            </div>
            <Field label="Notes">
              <textarea className={`${inputClass} min-h-[50px] resize-none`} value={notes} onChange={(e) => setNotes(e.target.value)} />
            </Field>
          </>
        )}

        <div className="flex gap-2 mt-3 mb-1">
          {isFiber ? (
            (port.fiberType || port.destination) && (
              <button onClick={clearFiberSlot} className="flex-1 border border-gray-300 rounded-lg py-2.5 text-xs font-medium text-gray-500">
                Remove
              </button>
            )
          ) : (
            existingConn && (
              <button onClick={clearLink} className="flex-1 border border-gray-300 rounded-lg py-2.5 text-xs font-medium text-gray-500">
                Clear link
              </button>
            )
          )}
          <button onClick={saveLink} className="flex-1 bg-orange-500 text-white rounded-lg py-2.5 text-xs font-medium hover:bg-orange-600">
            Save
          </button>
        </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<FieldPulseApp />);
</script>
</body>
</html>
