// ---------- Site edit view (adjust buildings & racks after the fact) ----------

function SiteEditView({ site, cabinets, clients = [], onSaveClientId, onSaveBuildings, onSaveCabinets, onSaveSnapshot, onDeleteSite, onDone }) {
  const [editingBuilding, setEditingBuilding] = useState(null);
  const [editingCabinet, setEditingCabinet] = useState(null);
  const buildings = site.buildings || [];

  const handleBuildingCountChange = (e) => {
    const n = Number(e.target.value);
    const next = buildings.slice(0, n);
    while (next.length < n) {
      const num = next.length + 1;
      next.push({ id: nextId("bldg"), number: String(num), name: "", description: "", photo: null });
    }
    onSaveBuildings(next);
  };

  const saveBuilding = (b) => {
    onSaveBuildings(buildings.map((x) => (x.id === b.id ? b : x)));
    setEditingBuilding(null);
  };

  // Deleting a building keeps its racks — they just become unassigned, so
  // hours of port mapping are never lost to a building-level delete.
  const deleteBuilding = (b) => {
    const inBuilding = cabinets.filter((c) => c.buildingId === b.id);
    const label = b.name || `Bldg ${b.number}`;
    const msg = inBuilding.length
      ? `Delete "${label}"? Its ${inBuilding.length} rack${inBuilding.length !== 1 ? "s" : ""} will be kept but left unassigned.`
      : `Delete "${label}"?`;
    if (!window.confirm(msg)) return;
    onSaveBuildings(buildings.filter((x) => x.id !== b.id));
    if (inBuilding.length) {
      onSaveCabinets(cabinets.map((c) => (c.buildingId === b.id ? { ...c, buildingId: "" } : c)));
    }
    setEditingBuilding(null);
  };

  // Racks are the one thing that really does get destroyed, since the
  // components and port mapping live inside them — so warn hard.
  const deleteCabinet = (c) => {
    const msg = c.components.length
      ? `Delete "${c.name}"? This permanently removes ${c.components.length} component${c.components.length !== 1 ? "s" : ""} and all port mapping in this rack. This can't be undone.`
      : `Delete "${c.name}"?`;
    if (!window.confirm(msg)) return;
    onSaveCabinets(cabinets.filter((x) => x.id !== c.id));
    setEditingCabinet(null);
  };

  const handleCabinetCountChange = (e) => {
    const n = Number(e.target.value);
    if (n < cabinets.length) {
      const removed = cabinets.slice(n);
      const hasComponents = removed.some((c) => c.components.length > 0);
      if (hasComponents) {
        const ok = window.confirm(
          `Reducing to ${n} rack${n !== 1 ? "s" : ""} will permanently delete ${removed.length} rack${removed.length !== 1 ? "s" : ""} and everything installed in them. Continue?`
        );
        if (!ok) return;
      }
    }
    const next = cabinets.slice(0, n);
    while (next.length < n) {
      const idx = next.length + 1;
      next.push({
        id: nextId("cab"),
        name: `Rack ${idx}`,
        siteId: site.id,
        buildingId: buildings[0]?.id || "",
        category: "IT-MDF",
        owner: "",
        serviceTeam: "",
        rackType: "four_post_rack",
        size: 24,
        features: [],
        photo: null,
        components: [],
        connections: [],
      });
    }
    onSaveCabinets(next);
  };

  const saveCabinet = (c) => {
    onSaveCabinets(cabinets.map((x) => (x.id === c.id ? c : x)));
    setEditingCabinet(null);
  };

  return (
    <div className="flex-1 px-4 py-6 max-w-4xl w-full mx-auto">
      <div className="flex items-center justify-between mb-6">
        <div>
          <div className="text-xs font-mono text-gray-400">{site.code}</div>
          <h2 className="text-xl font-bold text-gray-900">{site.name}</h2>
        </div>
        <button
          onClick={onDone}
          className="px-4 py-2 rounded-lg text-sm font-semibold bg-orange-500 hover:bg-orange-600 text-white"
        >
          Done
        </button>
      </div>

      {/* Lets a site be moved between clients, or re-homed if its client
          was deleted and it came back unassigned. */}
      <div className="border border-gray-200 rounded-xl p-4 mb-5">
        <label className="block text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Client</label>
        <select
          value={site.clientId || ""}
          onChange={(e) => onSaveClientId(e.target.value || null)}
          className={inputClass}
        >
          <option value="">— No client assigned —</option>
          {clients.map((c) => (
            <option key={c.id} value={c.id}>{c.name}</option>
          ))}
        </select>
      </div>

      <div className="border border-gray-200 rounded-xl p-4 mb-8">
        <div className="flex items-center justify-between mb-3">
          <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide">Site Snapshot</div>
          {[site.address, site.city, site.state, site.zip].filter(Boolean).length > 0 && (
            <a
              href={`https://www.google.com/maps?q=${encodeURIComponent([site.address, site.city, site.state, site.zip].filter(Boolean).join(", "))}`}
              target="_blank"
              rel="noopener noreferrer"
              className="text-xs text-orange-600 hover:text-orange-700 underline"
            >
              Open in Maps &rarr;
            </a>
          )}
        </div>
        <ImageDropZone
          value={site.snapshot}
          onChange={onSaveSnapshot}
          captureLabel={site.snapshot ? "Retake snapshot" : "Capture snapshot"}
          hint="Paste a screenshot (Ctrl+V), drop an image, or browse"
        />
      </div>

      <div className="mb-10">
        <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Buildings</div>
        <select
          value={buildings.length || ""}
          onChange={handleBuildingCountChange}
          className={inputClass + " w-40 mb-4"}
        >
          <option value="">Select…</option>
          {Array.from({ length: 20 }, (_, i) => i + 1).map((n) => (
            <option key={n} value={n}>{n}</option>
          ))}
        </select>

        {buildings.length > 0 && (
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            {buildings.map((b) => (
              <button
                key={b.id}
                onClick={() => setEditingBuilding(b)}
                className="border border-gray-200 rounded-xl overflow-hidden text-left hover:border-orange-300 hover:shadow-sm transition-all flex flex-col"
              >
                {b.photo ? (
                  <img src={b.photo} alt={b.name || `Bldg ${b.number}`} {...zoomable(b.photo, b.name || `Building ${b.number}`)} className="w-full h-20 object-cover" />
                ) : (
                  <div className="w-full h-20 bg-gray-50 flex items-center justify-center">
                    <Building2 size={20} className="text-gray-300" />
                  </div>
                )}
                <div className="p-2.5">
                  <div className="text-sm font-semibold text-gray-900 truncate">{b.name || `Bldg ${b.number}`}</div>
                  {b.description && <div className="text-[11px] text-gray-400 mt-1 line-clamp-2">{b.description}</div>}
                </div>
              </button>
            ))}
          </div>
        )}
      </div>

      <div>
        <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Network Racks / Cabinets</div>
        <select
          value={cabinets.length || ""}
          onChange={handleCabinetCountChange}
          className={inputClass + " w-40 mb-4"}
        >
          <option value="">Select…</option>
          {Array.from({ length: 20 }, (_, i) => i + 1).map((n) => (
            <option key={n} value={n}>{n}</option>
          ))}
        </select>

        {cabinets.length > 0 && (
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            {cabinets.map((c) => {
              const bldg = buildings.find((b) => b.id === c.buildingId);
              return (
                <button
                  key={c.id}
                  onClick={() => setEditingCabinet(c)}
                  className="border border-gray-200 rounded-xl p-4 flex flex-col items-center gap-1.5 hover:border-orange-300 hover:shadow-sm transition-all"
                >
                  <Server size={22} className="text-gray-400" />
                  <div className="text-sm font-semibold text-gray-900 truncate max-w-full">{c.name}</div>
                  <div className="text-xs text-gray-500">{bldg ? (bldg.name || `Bldg ${bldg.number}`) : "—"} &middot; {c.size}U</div>
                  {c.components.length > 0 && (
                    <div className="text-[10px] text-orange-500 font-medium">{c.components.length} component{c.components.length !== 1 ? "s" : ""}</div>
                  )}
                </button>
              );
            })}
          </div>
        )}
      </div>

      {editingBuilding && (
        <BuildingEditSheet
          building={editingBuilding}
          onClose={() => setEditingBuilding(null)}
          onSave={saveBuilding}
          onDelete={() => deleteBuilding(editingBuilding)}
        />
      )}

      {editingCabinet && (
        <CabinetMetaEditSheet
          cabinet={editingCabinet}
          buildings={buildings}
          onClose={() => setEditingCabinet(null)}
          onSave={saveCabinet}
          onDelete={() => deleteCabinet(editingCabinet)}
        />
      )}

      {/* Site-level delete lives at the very bottom, away from everything
          else, so it can't be hit by accident while editing. */}
      <div className="mt-10 pt-6 border-t border-gray-200">
        <div className="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-2">Danger Zone</div>
        <button
          onClick={() => {
            const msg = cabinets.length
              ? `Delete the site "${site.name}"? This permanently removes ${buildings.length} building${buildings.length !== 1 ? "s" : ""} and ${cabinets.length} rack${cabinets.length !== 1 ? "s" : ""}, including every component and port mapping inside them. This can't be undone.`
              : `Delete the site "${site.name}"? This can't be undone.`;
            if (window.confirm(msg)) onDeleteSite();
          }}
          className="flex items-center gap-2 text-sm font-medium text-red-600 border border-red-200 rounded-lg px-4 py-2.5 hover:bg-red-50"
        >
          <Trash2 size={15} /> Delete This Site
        </button>
        <div className="text-xs text-gray-400 mt-2">
          Everything under this site is removed. Export a backup first if you might need it.
        </div>
      </div>
    </div>
  );
}

function CabinetMetaEditSheet({ cabinet, buildings, onClose, onSave, onDelete }) {
  const [name, setName] = useState(cabinet.name || "");
  const [buildingId, setBuildingId] = useState(cabinet.buildingId || buildings[0]?.id || "");
  const [category, setCategory] = useState(cabinet.category || "IT-MDF");
  const [rackType, setRackType] = useState(cabinet.rackType || "four_post_rack");
  const [size, setSize] = useState(cabinet.size || 24);

  const canSave = name.trim() && buildingId;
  const hasComponents = cabinet.components.length > 0;

  return (
    <Sheet open={true} onClose={onClose} title="Edit Rack">
      {hasComponents && (
        <div className="text-xs text-gray-500 bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 mb-3">
          This rack has {cabinet.components.length} component{cabinet.components.length !== 1 ? "s" : ""} installed — they'll stay put, only the details below change.
        </div>
      )}
      <Field label="Rack Name">
        <input value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. MDF Rack 1" className={inputClass} />
      </Field>
      <Field label="Building">
        <select value={buildingId} onChange={(e) => setBuildingId(e.target.value)} className={inputClass}>
          {buildings.map((b) => (
            <option key={b.id} value={b.id}>{b.name || `Bldg ${b.number}`}</option>
          ))}
        </select>
      </Field>
      <Field label="Category">
        <select value={category} onChange={(e) => setCategory(e.target.value)} className={inputClass}>
          {RACK_CATEGORY_OPTIONS.map((c) => <option key={c} value={c}>{c}</option>)}
        </select>
      </Field>
      <Field label="Rack Type">
        <select value={rackType} onChange={(e) => setRackType(e.target.value)} className={inputClass}>
          {RACK_TYPES.map((t) => <option key={t.id} value={t.id}>{t.label}</option>)}
        </select>
      </Field>
      <Field label="Size (U)">
        <select value={size} onChange={(e) => setSize(Number(e.target.value))} className={inputClass}>
          {RACK_SIZES.map((s) => <option key={s} value={s}>{s}U</option>)}
        </select>
      </Field>
      <button
        disabled={!canSave}
        onClick={() => onSave({ ...cabinet, name: name.trim(), buildingId, category, rackType, size })}
        className="w-full bg-orange-500 text-white rounded-lg py-2.5 text-sm font-medium hover:bg-orange-600 disabled:opacity-40 mt-2"
      >
        Save
      </button>
      {onDelete && (
        <button
          onClick={onDelete}
          className="w-full flex items-center justify-center gap-1.5 text-sm text-red-600 hover:bg-red-50 rounded-lg py-2.5 border border-red-200 mt-2"
        >
          <Trash2 size={14} /> Delete Rack
        </button>
      )}
    </Sheet>
  );
}

// ---------- New cabinet sheet ----------

function NewCabinetSheet({ onClose, onCreate }) {
  const [name, setName] = useState("");
  const [location, setLocation] = useState("");
  const [category, setCategory] = useState(CABINET_CATEGORIES[0]);
  const [owner, setOwner] = useState("");
  const [serviceTeam, setServiceTeam] = useState("");
  const [rackType, setRackType] = useState(RACK_TYPES[3].id);
  const [size, setSize] = useState(24);
  const [features, setFeatures] = useState([]);

  const toggleFeature = (id) =>
    setFeatures((prev) => (prev.includes(id) ? prev.filter((f) => f !== id) : [...prev, id]));

  const canSave = name.trim().length > 0;

  return (
    <Sheet open={true} onClose={onClose} title="New Cabinet">
      <Field label="Cabinet name">
        <input className={inputClass} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. IDF - Building C" />
      </Field>
      <Field label="Location / Building">
        <input className={inputClass} value={location} onChange={(e) => setLocation(e.target.value)} placeholder="e.g. Building C" />
      </Field>
      <Field label="Cabinet category">
        <div className="flex flex-wrap gap-1.5">
          {CABINET_CATEGORIES.map((c) => (
            <button
              key={c}
              onClick={() => setCategory(c)}
              className={`px-2.5 py-1.5 rounded-lg text-xs font-medium border ${
                category === c ? "bg-orange-500 text-white border-orange-500" : "bg-white text-gray-600 border-gray-300"
              }`}
            >
              {c}
            </button>
          ))}
        </div>
      </Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Owner">
          <input className={inputClass} value={owner} onChange={(e) => setOwner(e.target.value)} placeholder="e.g. IT Operations" />
        </Field>
        <Field label="Serviced by">
          <input className={inputClass} value={serviceTeam} onChange={(e) => setServiceTeam(e.target.value)} placeholder="e.g. Field Tech Team" />
        </Field>
      </div>
      <Field label="Rack type">
        <select className={inputClass} value={rackType} onChange={(e) => setRackType(e.target.value)}>
          {RACK_TYPES.map((t) => (
            <option key={t.id} value={t.id}>{t.label}</option>
          ))}
        </select>
      </Field>
      <Field label="Rack size (U)">
        <div className="flex flex-wrap gap-1.5">
          {RACK_SIZES.map((s) => (
            <button
              key={s}
              onClick={() => setSize(s)}
              className={`px-3 py-1.5 rounded-lg text-xs font-medium border ${
                size === s ? "bg-black text-white border-black" : "bg-white text-gray-600 border-gray-300"
              }`}
            >
              {s}U
            </button>
          ))}
        </div>
      </Field>
      <Field label="Features">
        <div className="flex flex-wrap gap-1.5">
          {RACK_FEATURES.map((f) => (
            <button
              key={f.id}
              onClick={() => toggleFeature(f.id)}
              className={`px-2.5 py-1.5 rounded-lg text-xs font-medium border flex items-center gap-1 ${
                features.includes(f.id) ? "bg-gray-800 text-white border-gray-800" : "bg-white text-gray-600 border-gray-300"
              }`}
            >
              {features.includes(f.id) && <Check size={12} />}
              {f.label}
            </button>
          ))}
        </div>
      </Field>

      <button
        disabled={!canSave}
        onClick={() =>
          onCreate({ name, location, category, owner, serviceTeam, rackType, size, features })
        }
        className="w-full mt-2 bg-orange-500 disabled:bg-gray-200 disabled:text-gray-400 text-white font-medium rounded-lg py-3 text-sm hover:bg-orange-600"
      >
        Create Cabinet
      </button>
    </Sheet>
  );
}

// ---------- Rack builder ----------

// Pinch-to-zoom + pan viewport for the rack diagram, so ports are easy to
// hit precisely on a phone. Transforms are applied directly to the DOM via
// refs (not React state) during the gesture so it stays fluid at 60fps;
// state is only used to know when to show the "Reset zoom" button.
function ZoomableRackFrame({ children }) {
  const containerRef = useRef(null);
  const wrapperRef = useRef(null);
  const stateRef = useRef({ zoom: 1, panX: 0, panY: 0 });
  const pinchRef = useRef(null);
  const panRef = useRef(null);
  const lastTapRef = useRef(0);
  const [naturalHeight, setNaturalHeight] = useState(null);
  const [isZoomed, setIsZoomed] = useState(false);

  useEffect(() => {
    if (!wrapperRef.current) return;
    const ro = new ResizeObserver((entries) => {
      const h = entries[0]?.contentRect?.height;
      if (h) setNaturalHeight(h);
    });
    ro.observe(wrapperRef.current);
    return () => ro.disconnect();
  }, []);

  const applyTransform = () => {
    const { zoom, panX, panY } = stateRef.current;
    if (wrapperRef.current) {
      wrapperRef.current.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    }
  };

  const clamp = (v, min, max) => Math.min(max, Math.max(min, v));

  const clampPan = () => {
    const c = containerRef.current;
    if (!c) return;
    const rect = c.getBoundingClientRect();
    const { zoom } = stateRef.current;
    stateRef.current.panX = clamp(stateRef.current.panX, Math.min(0, rect.width - rect.width * zoom), 0);
    stateRef.current.panY = clamp(stateRef.current.panY, Math.min(0, rect.height - rect.height * zoom), 0);
  };

  const resetZoom = () => {
    stateRef.current = { zoom: 1, panX: 0, panY: 0 };
    applyTransform();
    setIsZoomed(false);
  };

  const handleTouchStart = (e) => {
    // A one-finger touch starting on a rack row's grip is a reorder drag,
    // not a pan — bail out so the two gestures don't fight each other.
    if (e.touches.length === 1 && e.target.closest && e.target.closest("[data-drag-handle]")) {
      pinchRef.current = null;
      panRef.current = null;
      return;
    }
    if (e.touches.length === 2) {
      const [t1, t2] = e.touches;
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const rect = containerRef.current.getBoundingClientRect();
      pinchRef.current = {
        startDist: dist,
        startZoom: stateRef.current.zoom,
        startPanX: stateRef.current.panX,
        startPanY: stateRef.current.panY,
        mx: (t1.clientX + t2.clientX) / 2 - rect.left,
        my: (t1.clientY + t2.clientY) / 2 - rect.top,
      };
      panRef.current = null;
    } else if (e.touches.length === 1) {
      const now = Date.now();
      if (now - lastTapRef.current < 300) {
        resetZoom();
        lastTapRef.current = 0;
        return;
      }
      lastTapRef.current = now;

      if (stateRef.current.zoom > 1.02) {
        const t = e.touches[0];
        panRef.current = {
          startX: t.clientX,
          startY: t.clientY,
          startPanX: stateRef.current.panX,
          startPanY: stateRef.current.panY,
        };
      }
      pinchRef.current = null;
    }
  };

  const handleTouchMove = (e) => {
    if (e.touches.length === 2 && pinchRef.current) {
      e.preventDefault();
      const [t1, t2] = e.touches;
      const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      const g = pinchRef.current;
      const newZoom = clamp(g.startZoom * (dist / g.startDist), 1, 4);
      const contentX = (g.mx - g.startPanX) / g.startZoom;
      const contentY = (g.my - g.startPanY) / g.startZoom;
      stateRef.current.zoom = newZoom;
      stateRef.current.panX = g.mx - contentX * newZoom;
      stateRef.current.panY = g.my - contentY * newZoom;
      clampPan();
      applyTransform();
      setIsZoomed(newZoom > 1.02);
    } else if (e.touches.length === 1 && panRef.current) {
      e.preventDefault();
      const t = e.touches[0];
      const g = panRef.current;
      stateRef.current.panX = g.startPanX + (t.clientX - g.startX);
      stateRef.current.panY = g.startPanY + (t.clientY - g.startY);
      clampPan();
      applyTransform();
    }
  };

  const handleTouchEnd = (e) => {
    if (e.touches.length < 2) pinchRef.current = null;
    if (e.touches.length < 1) panRef.current = null;
  };

  return (
    <div
      ref={containerRef}
      className="relative overflow-hidden"
      style={{ height: naturalHeight ? `${naturalHeight}px` : "auto", touchAction: isZoomed ? "none" : "pan-y" }}
      onTouchStart={handleTouchStart}
      onTouchMove={handleTouchMove}
      onTouchEnd={handleTouchEnd}
    >
      <div ref={wrapperRef} style={{ transformOrigin: "0 0", willChange: "transform" }}>
        {children}
      </div>
      {isZoomed && (
        <button
          onClick={resetZoom}
          className="absolute bottom-3 right-3 z-20 bg-black/75 text-white text-xs font-medium px-3.5 py-2 rounded-full shadow-lg backdrop-blur-sm"
        >
          Reset Zoom
        </button>
      )}
    </div>
  );
}

function RackBuilder({ cabinet, allCabinets, library, setLibrary, presets, onUpdate, onUpdateSite, site, client, focusComponentId, onFocusHandled }) {
  const [addAtU, setAddAtU] = useState(null); // U slot index where "+" was tapped
  const [selectedComponentId, setSelectedComponentId] = useState(null);
  const [selectedTab, setSelectedTab] = useState("overview");

  // Arriving here from a global search result for a component or a port
  // label: open that unit's sheet straight away rather than making the
  // user hunt for it in the rack.
  useEffect(() => {
    if (!focusComponentId) return;
    if (cabinet.components.some((c) => c.id === focusComponentId)) {
      setSelectedComponentId(focusComponentId);
      setSelectedTab("overview");
    }
    onFocusHandled && onFocusHandled();
  }, [focusComponentId, cabinet.id]);

  // Rack-level mode toggle: null (neutral), "edit" (tap a port to edit it
  // directly, or tap a U number to open the full component sheet),
  // "map"/"unmap" (link or unlink port pairs), or the bulk-tagging modes
  // "active"/"poe" — tap port after port to flip that one flag, so a whole
  // patch panel can be marked up in seconds instead of one editor at a
  // time. All modes are mutually exclusive; tapping the lit button exits.
  const [mode, setMode] = useState(null);
  const [mapSelection, setMapSelection] = useState(null); // { compId, port, kind }
  const [portEditorTarget, setPortEditorTarget] = useState(null); // { comp, port }
  const [hoverInfo, setHoverInfo] = useState(null); // { x, y, connText, vlan, device }
  const [editingOutlet, setEditingOutlet] = useState(null); // { compId, outlet }
  const [quickMapFirst, setQuickMapFirst] = useState(null); // first component picked
  const [showRackSettings, setShowRackSettings] = useState(false);
  const [showPresetPicker, setShowPresetPicker] = useState(false);
  const hasPatchPanel = cabinet.components.some((c) => c.type === "patch_panel");
  const [tagMenuOpen, setTagMenuOpen] = useState(false);
  const [exportMenuOpen, setExportMenuOpen] = useState(false);
  // The site shot lives on the site record, since every rack at that site
  // shares it; before and after belong to this rack alone.
  const setPhoto = (key, url) => {
    if (key === "siteSnapshot") onUpdateSite && onUpdateSite({ snapshot: url });
    else onUpdate((cab) => ({ ...cab, [key]: url }));
  };
  const [draggedId, setDraggedId] = useState(null);
  const dragIdRef = useRef(null);
  const [dragOverKey, setDragOverKey] = useState(null);

  // Picking the two components for a quick map. Order doesn't matter — the
  // panel and the device are worked out from the types, and odd-vs-even
  // from which one sits higher in the rack.
  // Duplicate a component into the next free slot. Ports and their labels
  // come along; patch links deliberately don't, because the copy isn't
  // physically wired to anything yet.
  const nextCopyName = (name, taken) => {
    const used = new Set(taken.map((n) => (n || "").trim().toLowerCase()));
    const bump = (s) => {
      // "Patch Panel A" -> B, "Switch.01" -> 02, otherwise append a counter.
      const letter = /^(.*?)([A-Y])$/.exec(s);
      if (letter) return `${letter[1]}${String.fromCharCode(letter[2].charCodeAt(0) + 1)}`;
      const num = /^(.*?)(\d+)$/.exec(s);
      if (num) {
        const width = num[2].length;
        return `${num[1]}${String(parseInt(num[2], 10) + 1).padStart(width, "0")}`;
      }
      return `${s} copy`;
    };
    let candidate = bump((name || "Component").trim());
    let guard = 0;
    while (used.has(candidate.trim().toLowerCase()) && guard < 60) {
      candidate = bump(candidate);
      guard += 1;
    }
    return candidate;
  };

  const handleCopyComponent = (comp) => {
    // First gap tall enough to take it.
    const occupied = new Array(cabinet.size).fill(false);
    cabinet.components.forEach((c) => {
      for (let i = 0; i < c.uHeight; i++) if (c.uStart + i < cabinet.size) occupied[c.uStart + i] = true;
    });
    let target = -1;
    for (let u = 0; u + comp.uHeight <= cabinet.size; u++) {
      let free = true;
      for (let i = 0; i < comp.uHeight; i++) if (occupied[u + i]) { free = false; break; }
      if (free) { target = u; break; }
    }
    if (target === -1) {
      alert(`No free ${comp.uHeight}U space in this rack for a copy.`);
      return;
    }

    const clone = JSON.parse(JSON.stringify(comp));
    clone.id = nextId("comp");
    clone.uStart = target;
    clone.serial = "";
    clone.mac = "";
    clone.name = nextCopyName(comp.name, cabinet.components.map((c) => c.name));
    // Strip anything that identifies the original unit rather than the model.
    (clone.ports || []).forEach((p) => { delete p.fiberLink; });

    onUpdate((cab) => ({ ...cab, components: [...cab.components, clone] }));
    setMode(null);
  };

  const handleQuickMapPick = (comp) => {
    if (!quickMapFirst) { setQuickMapFirst(comp.id); return; }
    if (quickMapFirst === comp.id) { setQuickMapFirst(null); return; }

    const a = cabinet.components.find((c) => c.id === quickMapFirst);
    const b = comp;
    if (!a) { setQuickMapFirst(comp.id); return; }

    const isPanel = (c) => c.type === "patch_panel";
    let panel = null, device = null;
    if (isPanel(a) && !isPanel(b)) { panel = a; device = b; }
    else if (isPanel(b) && !isPanel(a)) { panel = b; device = a; }
    else if (isPanel(a) && isPanel(b)) {
      alert("Pick a patch panel and a switch — two panels can't be sequence-mapped this way.");
      setQuickMapFirst(null);
      return;
    } else {
      // Neither is a panel: treat the higher one as the "panel" side so
      // switch-to-switch uplink runs still work.
      panel = a.uStart < b.uStart ? a : b;
      device = panel === a ? b : a;
    }

    const { pairs, skipped, panelAbove } = quickMapPairs(panel, device, cabinet);

    if (!pairs.length) {
      alert(
        `Nothing to map.\n\n${skipped.alreadyMapped} port(s) already mapped, ` +
        `${skipped.noPort} had no matching port on ${device.name}.`
      );
      setQuickMapFirst(null);
      return;
    }

    const parts = [
      `Map ${pairs.length} port${pairs.length === 1 ? "" : "s"}:`,
      `${panel.name} \u2192 ${device.name} (${panelAbove ? "odd" : "even"} ports)`,
      "",
      pairs.slice(0, 3).map((p) => `  Port ${p.panelPort} \u2192 Port ${p.devicePort}`).join("\n"),
      pairs.length > 3 ? `  ...and ${pairs.length - 3} more` : "",
    ];
    if (skipped.alreadyMapped) parts.push(`\nSkipping ${skipped.alreadyMapped} already-mapped port(s).`);
    if (skipped.noPort) parts.push(`Skipping ${skipped.noPort} with no matching port.`);

    if (!window.confirm(parts.filter(Boolean).join("\n"))) { setQuickMapFirst(null); return; }

    onUpdate((cab) => ({
      ...cab,
      connections: [
        ...cab.connections,
        ...pairs.map((p) => ({
          id: nextId("conn"),
          a: { compId: panel.id, port: p.panelPort, kind: "data" },
          b: { compId: device.id, port: p.devicePort, kind: "data" },
        })),
      ],
    }));
    setQuickMapFirst(null);
  };

  const setModeExclusive = (next) => {
    setMode((cur) => (cur === next ? null : next));
    setMapSelection(null);
    // A hover card left open from before the mode switch would otherwise
    // stay pinned over the ports until the next mouse move.
    setHoverInfo(null);
    setTagMenuOpen(false);
    setExportMenuOpen(false);
    setQuickMapFirst(null);
  };

  // Measure the rack's actual content width. Each installed component
  // renders using the SAME fixed 24+4 column budget as the Component
  // Designer's preview (STANDARD_PORT_SIZE, MAIN_ZONE_WIDTH, etc.) and
  // scales itself down only if it doesn't fit — so a switch looks
  // identical here as it did when you designed it.
  const frameRef = useRef(null);
  const [frameWidth, setFrameWidth] = useState(0);
  useEffect(() => {
    const el = frameRef.current;
    if (!el) return;
    const update = () => setFrameWidth(el.clientWidth);
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);

  // Build an occupancy map: index 0 = top U
  // Backfill a cloud port onto any UPS units that predate this feature
  // (older saves, imported backups) so the mapping system always has
  // real port data to work with.
  useEffect(() => {
    const missing = cabinet.components.filter((c) => c.type === "ups" && (!c.ports || c.ports.length === 0));
    if (missing.length === 0) return;
    onUpdate((cab) => ({
      ...cab,
      components: cab.components.map((c) =>
        c.type === "ups" && (!c.ports || c.ports.length === 0)
          ? { ...c, ports: [{ n: 1, kind: "data", label: "Cloud", vlan: "", device: "", notes: "" }] }
          : c
      ),
    }));
  }, [cabinet.components]);

  const occupancy = useMemo(() => {
    const slots = new Array(cabinet.size).fill(null);
    cabinet.components.forEach((comp) => {
      for (let i = 0; i < comp.uHeight; i++) {
        const idx = comp.uStart + i;
        if (idx < cabinet.size) slots[idx] = comp.id;
      }
    });
    return slots;
  }, [cabinet]);

  const selectedComponent = cabinet.components.find((c) => c.id === selectedComponentId);

  const addComponent = (compData) => {
    onUpdate((cab) => ({
      ...cab,
      components: [...cab.components, compData],
    }));
    setAddAtU(null);
    setSelectedComponentId(compData.id);
    setSelectedTab("overview");
  };

  const removeComponent = (id) => {
    onUpdate((cab) => ({
      ...cab,
      components: cab.components.filter((c) => c.id !== id),
      connections: cab.connections.filter((cn) => cn.a.compId !== id && cn.b.compId !== id),
    }));
    setSelectedComponentId(null);
  };

  const updateComponent = (id, patch) => {
    onUpdate((cab) => ({
      ...cab,
      components: cab.components.map((c) => (c.id === id ? { ...c, ...patch } : c)),
    }));
  };

  const openComponentSheet = (compId, tab = "overview") => {
    setSelectedComponentId(compId);
    setSelectedTab(tab);
  };

  // Complete a Map-mode pairing: link two ports, replacing any existing
  // link either port already had (a port can only carry one connection).
  // Every comparison includes kind, so linking data port 1 never disturbs
  // SFP 1 on the same component.
  const completeMapping = (a, b) => {
    const sameEnd = (end, ref) =>
      end.compId === ref.compId && end.port === ref.port && connKind(end) === (ref.kind || "data");
    onUpdate((cab) => {
      const connections = cab.connections.filter(
        (cn) => !sameEnd(cn.a, a) && !sameEnd(cn.b, a) && !sameEnd(cn.a, b) && !sameEnd(cn.b, b)
      );
      connections.push({
        id: nextId("conn"),
        a: { compId: a.compId, port: a.port, kind: a.kind || "data" },
        b: { compId: b.compId, port: b.port, kind: b.kind || "data" },
      });
      return { ...cab, connections };
    });
  };

  const removeConnectionTouching = (compId, portN, kind = "data") => {
    const hits = (end) => end.compId === compId && end.port === portN && connKind(end) === kind;
    onUpdate((cab) => ({
      ...cab,
      connections: cab.connections.filter((cn) => !hits(cn.a) && !hits(cn.b)),
    }));
  };

  const handlePortClick = (comp, port) => {
    const kind = port.kind || "data";

    if (mode === "map") {
      const isPendingPort = mapSelection && mapSelection.compId === comp.id && mapSelection.port === port.n && mapSelection.kind === kind;
      if (isPendingPort) {
        setMapSelection(null); // tapped the same pending port again — cancel it
        return;
      }
      if (findConnection(cabinet, comp.id, port.n, (port.kind || "data"))) {
        alert("Port already in use.");
        return;
      }
      if (!mapSelection) {
        setMapSelection({ compId: comp.id, port: port.n, kind });
        return;
      }
      completeMapping(mapSelection, { compId: comp.id, port: port.n, kind });
      setMapSelection(null);
      return;
    }

    if (mode === "unmap") {
      if (!findConnection(cabinet, comp.id, port.n, (port.kind || "data"))) {
        return; // nothing linked here — no-op
      }
      removeConnectionTouching(comp.id, port.n, kind);
      return;
    }

    // Bulk tagging: tapping a port flips just that one flag and leaves the
    // editor closed, so you can run down a whole panel tap-tap-tap. Tapping
    // an already-tagged port turns it back off, so a mis-tap is one tap to
    // undo rather than a trip into the port editor.
    if (mode === "active" || mode === "poe") {
      const field = mode === "active" ? "isActive" : "hasPoe";
      onUpdate((cab) => ({
        ...cab,
        components: cab.components.map((c) =>
          c.id === comp.id
            ? {
                ...c,
                ports: c.ports.map((p) =>
                  p.n === port.n && (p.kind || "data") === kind ? { ...p, [field]: !p[field] } : p
                ),
              }
            : c
        ),
      }));
      return;
    }

    // Jack editing: toggle whether a keystone is physically fitted at this
    // position. The port object is kept either way so numbering and spacing
    // never shift — only its `absent` flag changes.
    if (mode === "jacks") {
      const kindHere = port.kind || "data";
      const conn = findConnection(cabinet, comp.id, port.n, kindHere);
      if (!port.absent) {
        const hasData = !!(port.label || port.vlan || port.device || port.notes);
        if (conn || hasData) {
          const what = [conn ? "a mapped link" : null, hasData ? "port details" : null].filter(Boolean).join(" and ");
          if (!window.confirm(`Port ${port.n} has ${what}. Removing the jack clears that. Continue?`)) return;
        }
        if (conn) removeConnectionTouching(comp.id, port.n, kindHere);
      }
      onUpdate((cab) => ({
        ...cab,
        components: cab.components.map((c) =>
          c.id === comp.id
            ? {
                ...c,
                ports: c.ports.map((p) => {
                  if (!(p.n === port.n && (p.kind || "data") === kindHere)) return p;
                  return p.absent
                    ? { ...p, absent: false }
                    : { ...p, absent: true, label: "", vlan: "", device: "", notes: "", isActive: false, hasPoe: false };
                }),
              }
            : c
        ),
      }));
      return;
    }

    // Any other state (Edit mode or neutral) — tapping a port always opens
    // that exact port's editor directly. The U number is the only way in
    // to the full component editor.
    setPortEditorTarget({ comp, port });
  };

  // Drag-to-reorder using Pointer Events (works with both mouse and touch,
  // unlike native HTML5 drag which only supports mouse). A dedicated grip
  // handle starts the drag so it never conflicts with tapping ports.
  const finishDrag = (targetKey, draggedIdOverride) => {
    // Read from the ref, not state: the pointerup handler was created during
    // the render where draggedId was still null, so the captured state value
    // is stale and the drop would silently do nothing.
    const activeId = draggedIdOverride || dragIdRef.current;
    const draggedComp = cabinet.components.find((c) => c.id === activeId);
    if (draggedComp && targetKey) {
      if (targetKey.startsWith("empty-")) {
        const emptyUStart = Number(targetKey.slice(6));
        const tempOcc = new Array(cabinet.size).fill(null);
        cabinet.components.forEach((c) => {
          if (c.id === draggedComp.id) return;
          for (let i = 0; i < c.uHeight; i++) {
            const idx = c.uStart + i;
            if (idx < cabinet.size) tempOcc[idx] = c.id;
          }
        });
        let free = true;
        for (let i = 0; i < draggedComp.uHeight; i++) {
          const idx = emptyUStart + i;
          if (idx >= cabinet.size || tempOcc[idx]) { free = false; break; }
        }
        if (!free) {
          alert(`Not enough free space starting at U${emptyUStart + 1} for this component.`);
        } else {
          onUpdate((cab) => ({
            ...cab,
            components: cab.components.map((c) => (c.id === draggedComp.id ? { ...c, uStart: emptyUStart } : c)),
          }));
        }
      } else if (targetKey !== draggedComp.id) {
        const targetComp = cabinet.components.find((c) => c.id === targetKey);
        if (targetComp) {
          onUpdate((cab) => ({
            ...cab,
            components: cab.components.map((c) => {
              if (c.id === draggedComp.id) return { ...c, uStart: targetComp.uStart };
              if (c.id === targetComp.id) return { ...c, uStart: draggedComp.uStart };
              return c;
            }),
          }));
        }
      }
    }
    dragIdRef.current = null;
    setDraggedId(null);
    setDragOverKey(null);
  };

  const handleHandlePointerDown = (compId) => (e) => {
    e.preventDefault();
    e.stopPropagation();
    dragIdRef.current = compId;
    setDraggedId(compId);

    const rowAt = (x, y) => {
      const el = document.elementFromPoint(x, y);
      const rowEl = el && el.closest ? el.closest("[data-row-key]") : null;
      return rowEl ? rowEl.getAttribute("data-row-key") : null;
    };

    const cleanup = () => {
      document.removeEventListener("pointermove", handleMove);
      document.removeEventListener("pointerup", handleUp);
      document.removeEventListener("pointercancel", handleCancel);
    };

    const handleMove = (moveEvent) => {
      moveEvent.preventDefault();
      setDragOverKey(rowAt(moveEvent.clientX, moveEvent.clientY));
    };
    const handleUp = (upEvent) => {
      finishDrag(rowAt(upEvent.clientX, upEvent.clientY), compId);
      cleanup();
    };
    // The browser can steal the gesture (scroll, zoom, context menu). Without
    // this the row would stay stuck in its dragging state with no way out.
    const handleCancel = () => {
      dragIdRef.current = null;
      setDraggedId(null);
      setDragOverKey(null);
      cleanup();
    };

    document.addEventListener("pointermove", handleMove, { passive: false });
    document.addEventListener("pointerup", handleUp);
    document.addEventListener("pointercancel", handleCancel);
  };

  // render rows top -> bottom, grouping components that span multiple U
  const rows = [];
  let i = 0;
  while (i < cabinet.size) {
    const compId = occupancy[i];
    if (compId) {
      const comp = cabinet.components.find((c) => c.id === compId);
      rows.push({ type: "component", comp, uStart: i });
      i += comp.uHeight;
    } else {
      rows.push({ type: "empty", uStart: i });
      i += 1;
    }
  }

  const addComponentAt = (payload) => {
    const uHeight = payload.uHeight;
    const start = addAtU;
    let free = start !== null;
    if (free) {
      for (let i = 0; i < uHeight; i++) {
        if (start + i >= cabinet.size || occupancy[start + i]) { free = false; break; }
      }
    }
    if (!free) {
      alert(`Not enough free space starting at U${start + 1} for a ${uHeight}U component. Try a different U slot or a smaller device.`);
      return;
    }
    addComponent({
      id: nextId("comp"),
      uStart: start,
      uHeight,
      ...payload,

                    <button

                      <NamePlateRow

                        onSelect={() => openComponentSheet(row.comp.id, "overview")}
                      />
                    ) : row.comp.type === "ups" ? (
                      <UpsRow
                        comp={row.comp}
                        cabinet={cabinet}
                        mode={mode}
                        mapSelection={mapSelection}
                        onPortClick={handlePortClick}
                        onPortHover={setHoverInfo}
                        onSelect={() => openComponentSheet(row.comp.id, "overview")}

                    ) : COMPONENT_TYPES[row.comp.type].hasPorts ? (
                      <PortsRow
                        comp={row.comp}
                        cabinet={cabinet}
                        mode={mode}
                        mapSelection={mapSelection}
                        onPortClick={handlePortClick}
                        onPortHover={setHoverInfo}
                        frameWidth={frameWidth}
                      />
                    ) : (
                      <ComponentRow
                        comp={row.comp}
                        onSelect={() => openComponentSheet(row.comp.id, "overview")}
                      />
                    )}
                  </div>
                </div>
              ) : (
                <div
                  key={`empty-wrap-${row.uStart}`}
                  data-row-key={`empty-${row.uStart}`}
                  className={`border-b border-dashed border-gray-300 last:border-b-0 ${dragOverKey === `empty-${row.uStart}` && draggedId ? "ring-2 ring-inset ring-orange-400" : ""}`}
                >
                  <EmptySlotRow uStart={row.uStart} onAdd={() => setAddAtU(row.uStart)} />
                </div>

          </div>
        </div>
        </ZoomableRackFrame>

          onUpdate={(patch) => updateComponent(selectedComponent.id, patch)}

          {hoverInfo.device !== undefined && <div className="text-gray-300">Device: {hoverInfo.device}</div>}
        </div>
      )}

      {showPresetPicker && (
        <PresetPickerSheet
          presets={presets || []}
          cabinet={cabinet}
          onClose={() => setShowPresetPicker(false)}
          onApply={(preset) => {
            // Place each component where the standard says, falling back to
            // the next free slot if that space is already taken. Existing
            // components are never displaced.
            const occupied = new Array(cabinet.size).fill(false);
            cabinet.components.forEach((c) => {
              for (let i = 0; i < c.uHeight; i++) if (c.uStart + i < cabinet.size) occupied[c.uStart + i] = true;
            });

            const fits = (u, h) => {
              if (u < 0 || u + h > cabinet.size) return false;
              for (let i = 0; i < h; i++) if (occupied[u + i]) return false;
              return true;
            };

            const added = [];
            const skipped = [];
            (preset.components || []).forEach((spec) => {
              const h = spec.uHeight || 1;
              let u = fits(spec.uStart, h) ? spec.uStart : -1;
              if (u === -1) {
                for (let t = 0; t + h <= cabinet.size; t++) if (fits(t, h)) { u = t; break; }
              }
              if (u === -1) { skipped.push(spec.name); return; }
              for (let i = 0; i < h; i++) occupied[u + i] = true;
              added.push({ ...JSON.parse(JSON.stringify(spec)), id: nextId("comp"), uStart: u, uHeight: h });
            });

            if (!added.length) {
              alert(`No free space in this rack for "${preset.name}".`);
              return;
            }
            const msg =
              `Add ${added.length} component${added.length === 1 ? "" : "s"} from "${preset.name}"?` +
              (skipped.length ? `\n\nNo room for: ${skipped.join(", ")}` : "");
            if (!window.confirm(msg)) return;

            onUpdate((cab) => ({ ...cab, components: [...cab.components, ...added] }));
            setShowPresetPicker(false);
          }}
        />
      )}

      {showRackSettings && (
        <RackEditSheet
          rack={cabinet}
          buildings={site?.buildings || []}
          onClose={() => setShowRackSettings(false)}
          onSave={(next) => {
            // Shrinking a rack can strand components below the new floor.
            // Warn with specifics rather than silently hiding them.
            const stranded = cabinet.components.filter((c) => c.uStart + c.uHeight > next.size);
            if (stranded.length) {
              const names = stranded.map((c) => c.name).join(", ");
              const ok = window.confirm(
                `${next.size}U doesn't fit ${stranded.length} component${stranded.length === 1 ? "" : "s"} ` +
                `currently mounted above that height:\n\n${names}\n\n` +
                `They'll be moved down into free space, or removed if there's no room. Continue?`
              );
              if (!ok) return;
            }

            onUpdate((cab) => {
              let components = cab.components;
              if (stranded.length) {
                // Repack anything that no longer fits into the lowest free slot.
                const kept = cab.components.filter((c) => c.uStart + c.uHeight <= next.size);
                const occupied = new Array(next.size).fill(false);
                kept.forEach((c) => {
                  for (let i = 0; i < c.uHeight; i++) if (c.uStart + i < next.size) occupied[c.uStart + i] = true;
                });
                const moved = [];
                cab.components
                  .filter((c) => c.uStart + c.uHeight > next.size)
                  .forEach((c) => {
                    for (let u = 0; u + c.uHeight <= next.size; u++) {
                      let free = true;
                      for (let i = 0; i < c.uHeight; i++) if (occupied[u + i]) { free = false; break; }
                      if (free) {
                        for (let i = 0; i < c.uHeight; i++) occupied[u + i] = true;
                        moved.push({ ...c, uStart: u });
                        return;
                      }
                    }
                    // No room anywhere — drop it.
                  });
                components = [...kept, ...moved];
              }
              const keptIds = new Set(components.map((c) => c.id));
              return {
                ...cab,
                name: next.name,
                buildingId: next.buildingId,
                category: next.category,
                rackType: next.rackType,
                size: next.size,
                components,
                // Don't leave links pointing at components that got dropped.
                connections: (cab.connections || []).filter(
                  (cn) => keptIds.has(cn.a.compId) && keptIds.has(cn.b.compId)
                ),
              };
            });
            setShowRackSettings(false);
          }}
        />
      )}

      {editingOutlet && (
        <OutletEditor
          comp={cabinet.components.find((c) => c.id === editingOutlet.compId)}
          outlet={editingOutlet.outlet}
          onClose={() => setEditingOutlet(null)}
          onSave={(fields) => {
            const { compId, outlet } = editingOutlet;
            onUpdate((cab) => ({
              ...cab,
              components: cab.components.map((c) =>
                c.id === compId
                  ? {
                      ...c,
                      ports: c.ports.map((p) =>
                        p.n === outlet.n && p.kind === outlet.kind ? { ...p, ...fields } : p
                      ),
                    }
                  : c
              ),
            }));
            setEditingOutlet(null);
          }}
        />
      )}
    </div>
  );
}

function EmptySlotRow({ uStart, onAdd }) {
  return (
    <button
      onClick={onAdd}
      style={{ height: `${U_HEIGHT_PX}px` }}
      className="w-full flex items-center justify-center hover:bg-orange-50 group"
    >
      <Plus size={16} className="text-gray-300 group-hover:text-orange-500" />
    </button>
  );
}

function PortsRow({ comp, cabinet, mode, mapSelection, onPortClick, onPortHover, frameWidth }) {
  // While tagging or mapping, the hover card sits on top of the very ports
  // you're trying to hit next. Suppress it so the row stays clickable.
  const suppressHover = mode === "active" || mode === "poe" || mode === "map" || mode === "unmap" || mode === "jacks" || mode === "quickmap" || mode === "copy";
  const meta = COMPONENT_TYPES[comp.type];
  const isFiber = meta.isFiber;
  const tone = typeTone(comp.type);
  const portSize = STANDARD_PORT_SIZE;
  const fontSize = STANDARD_PORT_FONT_SIZE;

  const dataPorts = isFiber ? comp.ports : comp.ports.filter((p) => (p.kind || "data") !== "sfp");
  const sfpPorts = isFiber ? [] : comp.ports.filter((p) => p.kind === "sfp");
  const layout = comp.portLayout || { rows: 1, mainAlign: "left", sfpAlign: "right" };

  // Same fixed 24+4 column budget the Component Designer uses, so a
  // switch renders identically here as it did in the Designer preview.
  // Only scales down (uniformly, via CSS transform) if the rack itself
  // is too narrow to fit it at full standard size.
  const ZONE_PAD = 8;
  const ZONE_GAP = 10;
  const hasSfp = sfpPorts.length > 0;
  const mainRowCount = layout.rows === 2 ? 2 : 1;
  const sfpRowCount = layout.sfpRows === 2 ? 2 : 1;
  const naturalWidth = MAIN_ZONE_WIDTH + ZONE_PAD + (hasSfp ? ZONE_GAP + SFP_ZONE_WIDTH + ZONE_PAD : 0);
  const naturalHeight = Math.max(
    ZONE_PAD + mainRowCount * portSize + (mainRowCount - 1) * PORT_GAP_PX,
    hasSfp ? ZONE_PAD + sfpRowCount * portSize + (sfpRowCount - 1) * PORT_GAP_PX : 0
  );
  const scale =
    frameWidth > 0
      ? Math.min(1, (frameWidth - 12) / naturalWidth, (comp.uHeight * U_HEIGHT_PX - 12) / naturalHeight)
      : Math.min(1, (comp.uHeight * U_HEIGHT_PX - 12) / naturalHeight);

  const isActiveState = (p) => {
    if (p.isActive) return true;
    const conn = findConnection(cabinet, comp.id, p.n, (p.kind || "data"));
    if (!conn) return false;
    const kind = p.kind || "data";
    const linkedEnd = otherEnd(conn, comp.id, p.n, (p.kind || "data"));
    const linkedComp = cabinet.components.find((c) => c.id === linkedEnd.compId);
    const linkedPort = linkedComp?.ports.find((lp) => lp.n === linkedEnd.port && (lp.kind || "data") === (linkedEnd.kind || "data"));
    return linkedPort?.isActive || false;
  };

  const buildHoverInfo = (p, e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const conn = findConnection(cabinet, comp.id, p.n, (p.kind || "data"));
    let connText = "Not connected";
    if (conn) {
      const linkedEnd = otherEnd(conn, comp.id, p.n, (p.kind || "data"));
      const linkedComp = cabinet.components.find((c) => c.id === linkedEnd.compId);
      connText = linkedComp ? `${linkedComp.name} \u00b7 Port ${linkedEnd.port}` : "Connected";
    }
    const kind = p.kind || "data";
    const title = `${comp.name} \u00b7 ${kind === "sfp" ? "SFP" : isFiber ? "Strand" : "Port"} ${p.n}`;
    // Fiber type only means something on fiber strands and SFP cages.
    const fiber = (isFiber || kind === "sfp")
      ? (p.fiberType ? fiberLabel(p.fiberType) : "No adapter set")
      : undefined;
    // Which physical strand this SFP lands on, resolved to readable names.
    let strand;
    if (kind === "sfp" && p.fiberLink?.compId) {
      const tray = cabinet.components.find((c) => c.id === p.fiberLink.compId);
      if (tray) {
        const slots = (tray.ports || []).slice().sort((x, y) => x.n - y.n);
        const fl = linkFibers(p.fiberLink);
        if (fl.length) {
          strand = `${tray.name} \u00b7 ${slotDisplayName(slots, p.fiberLink.slot)} \u00b7 Strand${fl.length > 1 ? "s" : ""} ${fl.join(" + ")}`;
        }
      }
    }
    if (isFiber) {
      return { x: rect.left + rect.width / 2, y: rect.top, title, fiber, connText: p.destination || "Not connected" };
    }
    return {
      x: rect.left + rect.width / 2, y: rect.top, title, fiber, strand,
      connText: kind === "sfp" ? (p.destination || connText) : connText,
      vlan: p.vlan || "—", device: p.device || "—",
    };
  };

  const renderPort = (p) => {
    const kind = p.kind || "data";

    // Modular panels only have keystones in some positions. An absent jack
    // still occupies its slot so the surviving ports keep their real
    // positions — remove jack 11 and port 24 stays at the far right where
    // it physically is, rather than sliding left.
    if (p.absent) {
      const inJackMode = mode === "jacks";
      return (
        <button
          key={`${kind}-${p.n}`}
          onClick={() => inJackMode && onPortClick(comp, p)}
          disabled={!inJackMode}
          title={inJackMode ? `Add a jack at position ${p.n}` : `No jack fitted at position ${p.n}`}
          style={{ width: `${portSize}px`, height: `${portSize}px`, fontSize: `${fontSize}px` }}
          className={`rounded-sm border border-dashed flex items-center justify-center shrink-0 leading-none ${
            inJackMode
              ? "border-gray-400 bg-white/60 text-gray-400 hover:border-orange-400 hover:text-orange-500 cursor-pointer"
              : "border-gray-300 bg-transparent text-transparent"
          }`}
        >
          {inJackMode ? p.n : ""}
        </button>
      );
    }

    const conn = findConnection(cabinet, comp.id, p.n, (p.kind || "data"));
    const bg = isFiber && p.fiberType ? fiberColor(p.fiberType) : null;
    const isPending = mode === "map" && mapSelection && mapSelection.compId === comp.id && mapSelection.port === p.n && mapSelection.kind === kind;
    const active = !isFiber && isActiveState(p);
    const unmapTarget = mode === "unmap" && !!conn;
    // While bulk tagging, fill the whole port so a hit is confirmable at a
    // glance instead of hunting for a 3px corner dot on a phone screen.
    const poeTagged = mode === "poe" && !isFiber && !!p.hasPoe;
    const activeTagged = mode === "active" && !isFiber && !!p.isActive;
    // In jack-editing mode a fitted keystone reads as a solid dark block, so
    // fitted vs empty is unmistakable while you're editing.
    const jackMode = mode === "jacks" && !isFiber;
    return (
      <button
        key={`${kind}-${p.n}`}
        onClick={() => onPortClick(comp, p)}
        onMouseEnter={(e) => !suppressHover && onPortHover && onPortHover(buildHoverInfo(p, e))}
        onMouseLeave={() => onPortHover && onPortHover(null)}
        style={{
          width: `${portSize}px`,
          height: `${portSize}px`,
          fontSize: `${fontSize}px`,
          ...(!isPending && !unmapTarget && bg ? { backgroundColor: bg } : {}),
        }}
        className={`group rounded-sm border font-semibold flex items-center justify-center shrink-0 leading-none
          ${isPending
            ? "bg-orange-500 border-orange-600 text-white"
            : unmapTarget
            ? "bg-red-100 border-red-400 text-red-700"
            : jackMode
            ? "bg-slate-700 border-slate-800 text-white"
            : activeTagged
            ? "bg-green-500 border-green-600 text-white"
            : poeTagged
            ? "bg-amber-500 border-amber-600 text-white"
            : bg
            ? "border-black/10 text-black/70"
            : active
            ? "bg-green-100 border-green-400 text-green-700"
            : conn
            ? "bg-orange-50 border-orange-300 text-orange-700"
            : "bg-white border-gray-300 text-gray-400"}
          relative
        `}
      >
        {p.n}
        {!isFiber && (
          <span
            className={`absolute rounded-full ${active ? "bg-green-500" : "bg-gray-300"}`}
            style={{
              width: Math.max(3, Math.round(portSize * 0.18)),
              height: Math.max(3, Math.round(portSize * 0.18)),
              top: 1,
              right: 1,
            }}
          />
        )}
        {!isFiber && p.hasPoe && (
          <span
            className="absolute rounded-full bg-red-500"
            style={{
              width: Math.max(3, Math.round(portSize * 0.18)),
              height: Math.max(3, Math.round(portSize * 0.18)),
              top: 1,
              left: 1,
            }}
          />
        )}
      </button>
    );
  };

  // SFP/uplink ports render as wide rectangles in their own separated box,
  // matching how real switches visually set uplinks apart from data ports.
  const renderSfp = (p) => {
    const conn = findConnection(cabinet, comp.id, p.n, "sfp");
    const isPending = mode === "map" && mapSelection && mapSelection.compId === comp.id && mapSelection.port === p.n && mapSelection.kind === "sfp";
    const unmapTarget = mode === "unmap" && !!conn;
    // While bulk tagging, fill the whole port so a hit is confirmable at a
    // glance instead of hunting for a 3px corner dot on a phone screen.
    const poeTagged = mode === "poe" && !isFiber && !!p.hasPoe;
    const activeTagged = mode === "active" && !isFiber && !!p.isActive;
    // An SFP with a fiber type set paints the whole box in that patch
    // cable's color. The common case is an uplink that leaves the rack
    // entirely, so there's no linked component to infer anything from.
    const sfpFiber = p.fiberType ? fiberColor(p.fiberType) : null;
    const sfpActive = isActiveState(p);
    return (
      <button
        key={`sfp-${p.n}`}
        onClick={() => onPortClick(comp, p)}
        onMouseEnter={(e) => !suppressHover && onPortHover && onPortHover(buildHoverInfo(p, e))}
        onMouseLeave={() => onPortHover && onPortHover(null)}
        style={{
          width: `${Math.round(portSize * 1.8)}px`,
          height: `${portSize}px`,
          fontSize: `${fontSize}px`,
          ...(!isPending && !unmapTarget && !activeTagged && !poeTagged && sfpFiber
            ? { backgroundColor: sfpFiber }
            : {}),
        }}
        className={`group rounded-sm border font-semibold flex items-center justify-center shrink-0 leading-none ring-1 ring-gray-400 relative
          ${isPending
            ? "bg-orange-500 border-orange-600 text-white"
            : unmapTarget
            ? "bg-red-100 border-red-400 text-red-700"
            : activeTagged
            ? "bg-green-500 border-green-600 text-white"
            : poeTagged
            ? "bg-amber-500 border-amber-600 text-white"
            : sfpFiber
            ? "border-black/20 text-black/70"
            : conn
            ? "bg-orange-50 border-orange-300 text-orange-700"
            : "bg-white border-gray-300 text-gray-400"}
        `}
      >
        {p.n}
        <span
          className={`absolute rounded-full ${sfpActive ? "bg-green-500" : "bg-gray-300"}`}
          style={{
            width: Math.max(3, Math.round(portSize * 0.18)),
            height: Math.max(3, Math.round(portSize * 0.18)),
            top: 1,
            right: 1,
          }}
        />
      </button>
    );
  };

  // Fiber tray slots render as large rectangular openings spread evenly
  // across the full width of the unit — matching a real adapter plate
  // tray, not small copper-port squares.
  const renderFiberSlot = (p) => {
    const bg = p.fiberType ? fiberColor(p.fiberType) : null;
    // A slot with a plate fitted shows the plate itself rather than a flat
    // colour block, so the tray reads the way it does in the rack.
    if (p.adapter) {
      return (
        <button
          key={p.n}
          onClick={() => onPortClick(comp, p)}
          onMouseEnter={(e) => !suppressHover && onPortHover && onPortHover(buildHoverInfo(p, e))}
          onMouseLeave={() => onPortHover && onPortHover(null)}
          className="group relative shrink-0 flex items-center justify-center"
        >
          <FiberAdapterFace adapter={p.adapter} fiberType={p.fiberType} />
        </button>
      );
    }
    return (
      <button
        key={p.n}
        onClick={() => onPortClick(comp, p)}
        onMouseEnter={(e) => !suppressHover && onPortHover && onPortHover(buildHoverInfo(p, e))}
        onMouseLeave={() => onPortHover && onPortHover(null)}
        // Steel grey reads as an empty metal blanking slot rather than a
        // populated one; a fitted plate supplies its own colour instead.
        style={{ backgroundColor: bg || "#6B7280", borderColor: bg ? undefined : "#4B5563" }}
        className="group relative flex-1 max-w-[130px] h-9 rounded-sm border border-black/30 shadow-inner flex items-center justify-center text-[11px] font-semibold text-white/90"
      >
        {p.n}
      </button>
    );
  };

  return (
    <div
      style={{
        height: `${comp.uHeight * U_HEIGHT_PX}px`,
        overflowY: "hidden",
        background: tone.bg,
        boxShadow: `inset 3px 0 0 ${tone.border}`,
      }}
      className="w-full flex items-center p-1.5 overflow-x-hidden overflow-y-visible"
    >
      {isFiber ? (
        // Plates render at their real proportions, so a tray of dense plates
        // can be wider than the frame — scroll it rather than shrinking the
        // adapters, which are a fixed physical size.
        <div className="w-full flex flex-col gap-2 px-3 overflow-x-auto">
          <div className="flex items-center justify-center gap-3 min-w-min">{dataPorts.slice(0, 3).map(renderFiberSlot)}</div>
          {dataPorts.length > 3 && (
            <div className="flex items-center justify-center gap-3 min-w-min">{dataPorts.slice(3, 6).map(renderFiberSlot)}</div>
          )}
        </div>
      ) : (
      <div
        style={{
          width: `${naturalWidth}px`,
          height: `${naturalHeight}px`,
          transform: `scale(${scale})`,
          transformOrigin: "left center",
        }}
      >
          <PortFace
            dataPorts={dataPorts}
            sfpPorts={sfpPorts}
            layout={layout}
            gap="gap-[3px]"
            mainZoneWidth={MAIN_ZONE_WIDTH}
            sfpZoneWidth={SFP_ZONE_WIDTH}
            renderPort={renderPort}
            sfpRenderPort={renderSfp}
          />
      </div>
      )}
    </div>
  );
}

function ComponentRow({ comp, onSelect }) {
  const meta = COMPONENT_TYPES[comp.type];
  const Icon = meta.icon;
  const tone = typeTone(comp.type);
  return (
    <button
      onClick={onSelect}
      style={{
        height: `${comp.uHeight * U_HEIGHT_PX}px`,
        background: tone.bg,
        boxShadow: `inset 3px 0 0 ${tone.border}`,
      }}
      className="w-full flex items-center px-3 hover:brightness-[0.98] text-left"
    >
      <div className="flex-1 flex items-center justify-center gap-3 min-w-0">
        <IconBadge Icon={Icon} className="w-8 h-8 shrink-0" />
        <div className="min-w-0 text-center">
          <div className="text-sm font-medium truncate" style={{ color: toneFg(tone) }}>{comp.name}</div>
          <div className="text-[11px] truncate" style={{ color: toneIsDark(tone) ? "#C4C4C8" : "#6B7280" }}>
            {comp.manufacturer ? `${comp.manufacturer} ${comp.model || ""}` : meta.label}
            {comp.ports ? ` \u00b7 ${comp.ports.length} Ethernet Port${comp.ports.length !== 1 ? "s" : ""}` : ""}
          </div>
        </div>
      </div>
      <ChevronRight size={16} className="text-gray-300 shrink-0" />
    </button>
  );
}

function UpsRow({ comp, cabinet, mode, mapSelection, onPortClick, onPortHover, onSelect }) {
  const tone = typeTone(comp.type);
  const suppressHover = mode === "active" || mode === "poe" || mode === "map" || mode === "unmap" || mode === "jacks" || mode === "quickmap" || mode === "copy";
  const meta = COMPONENT_TYPES[comp.type];
  const Icon = meta.icon;
  const ports = comp.ports && comp.ports.length > 0
    ? comp.ports
    : [{ n: 1, kind: "data", label: "Cloud", vlan: "", device: "", notes: "" }];

  const renderCloudPort = (port) => {
    const kind = port.kind || "data";
    const conn = findConnection(cabinet, comp.id, port.n, (port.kind || "data"));
    const isPending = mode === "map" && mapSelection && mapSelection.compId === comp.id && mapSelection.port === port.n && mapSelection.kind === kind;
    const unmapTarget = mode === "unmap" && !!conn;
    // While bulk tagging, fill the whole port so a hit is confirmable at a
    // glance instead of hunting for a 3px corner dot on a phone screen.
    // This renderer's parameter is `port`, not `p` — referencing `p` here
    // threw a ReferenceError the instant a tagging mode turned on, blanking
    // the whole screen for any rack containing a UPS.
    const poeTagged = mode === "poe" && !!port.hasPoe;
    const activeTagged = mode === "active" && !!port.isActive;

    let active = port.isActive || false;
    if (!active && conn) {
      const linkedEnd = otherEnd(conn, comp.id, port.n, (port.kind || "data"));
      const linkedComp = cabinet.components.find((c) => c.id === linkedEnd.compId);
      const linkedPort = linkedComp?.ports?.find((lp) => lp.n === linkedEnd.port && (lp.kind || "data") === (linkedEnd.kind || "data"));
      active = linkedPort?.isActive || false;
    }

    const buildHover = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      let connText = "Not connected";
      if (conn) {
        const linkedEnd = otherEnd(conn, comp.id, port.n, (port.kind || "data"));
        const linkedComp = cabinet.components.find((c) => c.id === linkedEnd.compId);
        connText = linkedComp ? `${linkedComp.name} \u00b7 Port ${linkedEnd.port}` : "Connected";
      }
      return { x: rect.left + rect.width / 2, y: rect.top, title: `${comp.name} \u00b7 ${port.label || "Cloud"}`, connText, vlan: port.vlan || "—", device: port.device || "—" };
    };

    return (
      <button
        key={port.n}
        onClick={() => onPortClick(comp, port)}
        onMouseEnter={(e) => !suppressHover && onPortHover && onPortHover(buildHover(e))}
        onMouseLeave={() => onPortHover && onPortHover(null)}
        className={`relative rounded-sm border text-[9px] font-semibold flex items-center justify-center leading-none px-2 py-1.5
          ${isPending
            ? "bg-orange-500 border-orange-600 text-white"
            : unmapTarget
            ? "bg-red-100 border-red-400 text-red-700"
            : activeTagged
            ? "bg-green-500 border-green-600 text-white"
            : poeTagged
            ? "bg-amber-500 border-amber-600 text-white"
            : active
            ? "bg-green-100 border-green-400 text-green-700"
            : conn
            ? "bg-orange-50 border-orange-300 text-orange-700"
            : "bg-white border-gray-300 text-gray-400"}
        `}
      >
        {ports.length > 1 ? port.n : "Cloud"}
        <span
          className={`absolute rounded-full ${active ? "bg-green-500" : "bg-gray-300"}`}
          style={{ width: 5, height: 5, top: 1, right: 1 }}
        />
      </button>
    );
  };

  return (
    <div
      style={{
        height: `${comp.uHeight * U_HEIGHT_PX}px`,
        background: tone.bg,
        boxShadow: `inset 3px 0 0 ${tone.border}`,
      }}
      className="w-full flex items-center px-3"
    >
      <button onClick={onSelect} className="flex-1 flex items-center justify-center gap-3 min-w-0 h-full">
        <IconBadge Icon={Icon} className="w-8 h-8 shrink-0" />
        <div className="min-w-0 text-center">
          <div className="text-sm font-medium truncate" style={{ color: toneFg(tone) }}>{comp.name}</div>
          <div className="text-[11px] truncate" style={{ color: toneIsDark(tone) ? "#C4C4C8" : "#6B7280" }}>

}

// ---------- Shared port-layout arrangement ----------
// Used by both the Component Designer's live preview and the real rack
// view (PortsRow), so what you design is exactly what shows up later.

function arrangePortLayout(dataPorts, sfpPorts, layout) {
  const rows = layout?.rows === 2 ? 2 : 1;
  const sfpRows = layout?.sfpRows === 2 ? 2 : 1;
  const mainAlign = layout?.mainAlign || "left";
  const sfpAlign = layout?.sfpAlign || "right";

  let row1 = dataPorts;
  let row2 = [];
  if (rows === 2) {
    row1 = dataPorts.filter((_, i) => i % 2 === 0); // odd port numbers
    row2 = dataPorts.filter((_, i) => i % 2 === 1); // even port numbers
  }

  let sfpRow1 = sfpPorts;
  let sfpRow2 = [];
  if (sfpRows === 2) {
    sfpRow1 = sfpPorts.filter((_, i) => i % 2 === 0);
    sfpRow2 = sfpPorts.filter((_, i) => i % 2 === 1);
  }

  const sameSide = sfpPorts.length === 0 || mainAlign === sfpAlign;
  const justify =
    sameSide
      ? mainAlign === "left" ? "justify-start" : mainAlign === "right" ? "justify-end" : "justify-center"
      : "justify-between";
  const mainOrder = !sameSide && mainAlign === "right" ? "order-2" : "order-1";
  const sfpOrder = mainOrder === "order-1" ? "order-2" : "order-1";

  return { row1, row2, sfpRow1, sfpRow2, sfpPorts, justify, mainOrder, sfpOrder, mainAlign, sfpAlign, sameSide };
}

// A single generic reusable "face" renderer — draws main port row(s) plus
// an optional SFP cluster, using arrangePortLayout. renderPort is called
// for every port square so callers can decide styling/interactivity.
function PortFace({ dataPorts, sfpPorts, layout, renderPort, sfpRenderPort, gap = "gap-1", mainZoneWidth, sfpZoneWidth }) {
  const { row1, row2, sfpRow1, sfpRow2, sfpPorts: sfps, justify, mainOrder, sfpOrder, mainAlign, sfpAlign } =
    arrangePortLayout(dataPorts, sfpPorts, layout);
  const renderSfp = sfpRenderPort || renderPort;

  if (mainZoneWidth) {
    // Fixed-column-budget mode: main ports and SFPs each get a constant
    // reserved width (like a real chassis) — alignment just positions the
    // actual ports within that fixed zone, so the panel never resizes.
    const alignClass = (a) => (a === "right" ? "justify-end" : a === "center" ? "justify-center" : "justify-start");

    if (dataPorts.length === 0) {
      // No main ports (e.g. an SFP-only fiber switch) — let the SFP
      // cluster use the FULL combined width for its own alignment,
      // instead of being boxed into just its small reserved corner.
      const combinedWidth = mainZoneWidth + 10 + sfpZoneWidth;
      return (
        <div className="w-full flex items-center gap-2.5">
          {sfps.length > 0 && (
            <div className="bg-black/5 rounded-md p-1 shrink-0" style={{ width: `${combinedWidth}px` }}>
              <div className={`flex flex-col ${gap}`}>
                <div className={`flex items-center ${gap} ${alignClass(sfpAlign)}`}>{sfpRow1.map(renderSfp)}</div>
                {sfpRow2.length > 0 && <div className={`flex items-center ${gap} ${alignClass(sfpAlign)}`}>{sfpRow2.map(renderSfp)}</div>}
              </div>
            </div>
          )}
        </div>
      );
    }

    return (
      <div className="w-full flex items-center gap-2.5">
        <div className="bg-black/5 rounded-md p-1 shrink-0" style={{ width: `${mainZoneWidth}px` }}>
          <div className={`flex flex-col ${gap}`}>
            <div className={`flex items-center ${gap} ${alignClass(mainAlign)}`}>{row1.map(renderPort)}</div>
            {row2.length > 0 && <div className={`flex items-center ${gap} ${alignClass(mainAlign)}`}>{row2.map(renderPort)}</div>}
          </div>
        </div>
        {sfps.length > 0 && (
          <div className="bg-black/5 rounded-md p-1 shrink-0" style={{ width: `${sfpZoneWidth}px` }}>
            <div className={`flex flex-col ${gap}`}>
              <div className={`flex items-center ${gap} ${alignClass(sfpAlign)}`}>{sfpRow1.map(renderSfp)}</div>
              {sfpRow2.length > 0 && <div className={`flex items-center ${gap} ${alignClass(sfpAlign)}`}>{sfpRow2.map(renderSfp)}</div>}
            </div>
          </div>
        )}
      </div>
    );
  }

  // Auto-sizing mode (real rack view).
  return (
    <div className={`w-full flex items-center ${justify} gap-2.5`}>
      <div className={`flex flex-col ${gap} ${mainOrder} bg-black/5 rounded-md p-1`}>
        <div className={`flex items-center ${gap}`}>{row1.map(renderPort)}</div>
        {row2.length > 0 && <div className={`flex items-center ${gap}`}>{row2.map(renderPort)}</div>}
      </div>
      {sfps.length > 0 && (
        // This branch used to flatten every SFP into a single row, ignoring
        // the two-row setting entirely — so a stacked pair of SFPs looked
        // right in the designer preview but rendered side by side in the
        // rack. Mirror the main-port structure instead.
        <div className={`flex flex-col ${gap} ${sfpOrder} bg-black/5 rounded-md p-1`}>
          <div className={`flex items-center ${gap}`}>{sfpRow1.map(renderSfp)}</div>
          {sfpRow2.length > 0 && <div className={`flex items-center ${gap}`}>{sfpRow2.map(renderSfp)}</div>}
        </div>
      )}
    </div>
  );
}

function LibraryTemplateCard({ tpl, onEdit, onDelete }) {
  // Fixed mini size — same standard proportions as the full preview, just
  // scaled down for a thumbnail. Never shrinks based on port count.
  const portSize = STANDARD_PORT_SIZE_MINI;

  const rows = tpl.portLayout?.rows === 2 ? 2 : 1;
  const sfpRows = tpl.portLayout?.sfpRows === 2 ? 2 : 1;
  const hasSfp = (tpl.sfp || 0) > 0;
  const ZONE_PAD = 6;
  const ZONE_GAP = 8;
  const naturalWidth =
    MAIN_ZONE_WIDTH_MINI + ZONE_PAD + (hasSfp ? ZONE_GAP + SFP_ZONE_WIDTH_MINI + ZONE_PAD : 0);
  const naturalHeight = Math.max(
    ZONE_PAD + rows * portSize + (rows - 1) * PORT_GAP_PX,
    hasSfp ? ZONE_PAD + sfpRows * portSize + (sfpRows - 1) * PORT_GAP_PX : 0
  );

  const cardBoxRef = useRef(null);
  const [cardBoxWidth, setCardBoxWidth] = useState(0);
  useLayoutEffect(() => {
    const el = cardBoxRef.current;
    if (!el) return;
    const update = () => setCardBoxWidth(el.clientWidth);
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    window.addEventListener("resize", update);
    return () => {
      ro.disconnect();
      window.removeEventListener("resize", update);
    };
  }, []);
  const cardScale = cardBoxWidth > 0 ? Math.min(1, (cardBoxWidth - 8) / naturalWidth) : 1;

  return (
    <div className="border border-gray-200 rounded-xl p-4 hover:border-orange-300 hover:shadow-sm transition-all">
      <div className="flex items-center justify-between mb-3">
        <div className="flex items-center gap-3 min-w-0">
          {tpl.photo && (
            <img src={tpl.photo} alt={tpl.model} {...zoomable(tpl.photo, `${tpl.manufacturer || ""} ${tpl.model || ""}`.trim())} className="w-12 h-12 rounded-lg object-cover border border-gray-200 shrink-0" />
          )}
          <div className="min-w-0">
            <div className="text-sm font-semibold text-gray-900 truncate">{tpl.manufacturer} {tpl.model}</div>
            <div className="text-xs text-gray-500 mt-0.5">
              {COMPONENT_TYPES[tpl.type]?.label}
              {tpl.ports ? ` \u00b7 ${tpl.ports} Ethernet Ports` : ""}
              {tpl.sfp ? ` + ${tpl.sfp} SFP` : ""}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={() => onEdit(tpl.id)} className="p-1.5 rounded-md hover:bg-gray-100 text-gray-500" title="Edit layout">
            <GearIcon size={14} />
          </button>
          <button onClick={() => onDelete(tpl.id)} className="p-1.5 rounded-md hover:bg-red-50 text-red-400" title="Delete">
            <Trash2 size={14} />
          </button>
        </div>
      </div>

      {tpl.type === "fiber_tray" && tpl.ports ? (
        <div className="bg-gray-900 rounded-md p-2 flex flex-col gap-1.5">
          <div className="flex items-center justify-between gap-1.5">
            {Array.from({ length: Math.min(3, tpl.ports) }, (_, i) => (
              <div key={i} className="flex-1 max-w-[70px] h-5 rounded-[2px] bg-gray-700 border border-black/30" />
            ))}
          </div>
          {tpl.ports > 3 && (
            <div className="flex items-center justify-between gap-1.5">
              {Array.from({ length: Math.min(3, tpl.ports - 3) }, (_, i) => (
                <div key={i} className="flex-1 max-w-[70px] h-5 rounded-[2px] bg-gray-700 border border-black/30" />
              ))}
            </div>
          )}
        </div>
      ) : tpl.portLayout && (tpl.ports > 0 || tpl.sfp > 0) ? (
        <div
          ref={cardBoxRef}
          className="bg-gray-900 rounded-md p-1 overflow-hidden"
          style={{ height: `${naturalHeight * cardScale + 8}px` }}
        >
          <div
            style={{
              width: `${naturalWidth}px`,
              height: `${naturalHeight}px`,
              transform: `scale(${cardScale})`,
              transformOrigin: "top left",
            }}
          >
            <PortFace
              dataPorts={Array.from({ length: tpl.ports }, (_, i) => i + 1)}
              sfpPorts={Array.from({ length: tpl.sfp || 0 }, (_, i) => i + 1)}
              layout={tpl.portLayout}
              mainZoneWidth={MAIN_ZONE_WIDTH_MINI}
              sfpZoneWidth={SFP_ZONE_WIDTH_MINI}
              gap="gap-[3px]"
              renderPort={(n, idx) => (
                <div
                  key={idx}
                  style={{ width: `${portSize}px`, height: `${portSize}px` }}
                  className="rounded-[2px] bg-gray-700 border border-gray-600 shrink-0"
                />
              )}
              sfpRenderPort={(n, idx) => (
                <div
                  key={`sfp-${idx}`}
                  style={{ width: `${Math.round(portSize * 1.7)}px`, height: `${portSize}px` }}
                  className="rounded-[2px] bg-gray-700 border border-gray-600 ring-1 ring-gray-500 shrink-0"
                />
              )}
            />
          </div>
        </div>
      ) : null}
    </div>
  );
}
