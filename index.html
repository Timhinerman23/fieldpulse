// ---------- Storage ----------
// Data lives in IndexedDB, not localStorage. localStorage caps at roughly
// 5MB and — worse — throws on overflow, which is easy to swallow and turns
// into silent data loss mid-job. IndexedDB has orders of magnitude more room
// (typically a large share of free disk) and stores structured data without
// the ~33% bloat of base64-in-JSON.
const DB_NAME = "fieldpulse";
const DB_VERSION = 1;
const DB_STORE = "state";
const DB_KEY = "main";

let dbPromise = null;
function formatBytes(n) {
  if (!n) return "0 MB";
  if (n < 1024 * 1024) return `${(n / 1024).toFixed(0)} KB`;
  if (n < 1024 * 1024 * 1024) return `${(n / (1024 * 1024)).toFixed(1)} MB`;
  return `${(n / (1024 * 1024 * 1024)).toFixed(1)} GB`;
}

function openDb() {
  if (dbPromise) return dbPromise;
  dbPromise = new Promise((resolve, reject) => {
    if (!window.indexedDB) return reject(new Error("IndexedDB unavailable"));
    const req = window.indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error("Could not open database"));
  });
  return dbPromise;
}

function idbGet(key) {
  return openDb().then(
    (db) =>
      new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readonly");
        const req = tx.objectStore(DB_STORE).get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      })
  );
}

function idbSet(key, value) {
  return openDb().then(
    (db) =>
      new Promise((resolve, reject) => {
        const tx = db.transaction(DB_STORE, "readwrite");
        tx.objectStore(DB_STORE).put(value, key);
        // Resolve on transaction completion, not request success — the write
        // isn't durable until the transaction commits.
        tx.oncomplete = () => resolve(true);
        tx.onerror = () => reject(tx.error);
        tx.onabort = () => reject(tx.error || new Error("Write aborted"));
      })
  );
}

// Ask the browser not to evict this data under storage pressure. Without
// this, IndexedDB is "best effort" and can be cleared automatically. Safe to
// call repeatedly; resolves false if the browser declines.
async function requestPersistence() {
  try {
    if (navigator.storage?.persist) {
      if (await navigator.storage.persisted()) return true;
      return await navigator.storage.persist();
    }
  } catch (e) {
    /* not supported */
  }
  return false;
}

async function getStorageEstimate() {
  try {
    if (navigator.storage?.estimate) {
      const { usage, quota } = await navigator.storage.estimate();
      return { usage: usage || 0, quota: quota || 0 };
    }
  } catch (e) {
    /* not supported */
  }
  return null;
}

const normalizeLoaded = (data) => {
  if (data && data.cabinets) data.cabinets = migrateConnections(data.cabinets);
  return data;
};

const freshSeed = () => normalizeLoaded(JSON.parse(JSON.stringify(SEED_DATA)));

// One-time migration path: older builds saved to localStorage. Pull that
// forward on first run, then leave the old copy in place as a safety net
// rather than deleting data we've only just moved.
async function loadSavedData() {
  try {
    const fromDb = await idbGet(DB_KEY);
    if (fromDb && fromDb.cabinets) return { data: normalizeLoaded(fromDb), source: "idb" };
  } catch (e) {
    console.warn("IndexedDB read failed:", e);
  }

  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = normalizeLoaded(JSON.parse(raw));
      if (parsed && parsed.cabinets) return { data: parsed, source: "migrated" };
    }
  } catch (e) {
    console.warn("localStorage read failed:", e);
  }

  return { data: freshSeed(), source: "seed" };
}

// ---------- Global search ----------
// Flattens the whole hierarchy into one searchable list so anything in the
// app can be reached from the top bar: clients, sites, buildings, racks,
// installed components, port labels, and contacts.

const SEARCH_GROUP_ORDER = ["Clients", "Sites", "Buildings", "Racks", "Components", "Ports", "Contacts"];

function buildSearchIndex({ clients, sites, cabinets, library }) {
  const out = [];
  const siteById = {};
  sites.forEach((s) => { siteById[s.id] = s; });
  const clientById = {};
  clients.forEach((c) => { clientById[c.id] = c; });

  clients.forEach((c) => {
    out.push({
      group: "Clients", id: `client-${c.id}`, title: c.name || "Untitled Client",
      subtitle: `${sites.filter((s) => s.clientId === c.id).length} sites`,
      haystack: [c.name, c.notes].filter(Boolean).join(" "),
      nav: { type: "client", clientId: c.id },
    });
  });

  sites.forEach((s) => {
    const client = clientById[s.clientId];
    out.push({
      group: "Sites", id: `site-${s.id}`, title: s.name,
      subtitle: [client?.name, s.code, [s.city, s.state].filter(Boolean).join(", ")].filter(Boolean).join(" \u00b7 "),
      haystack: [s.name, s.code, s.address, s.city, s.state, s.zip, client?.name].filter(Boolean).join(" "),
      nav: { type: "site", siteId: s.id },
    });

    (s.buildings || []).forEach((b) => {
      out.push({
        group: "Buildings", id: `bldg-${b.id}`, title: b.name || `Building ${b.number}`,
        subtitle: `${s.name}${client?.name ? " \u00b7 " + client.name : ""}`,
        haystack: [b.name, b.number, s.name].filter(Boolean).join(" "),
        nav: { type: "building", siteId: s.id, buildingId: b.id },
      });
    });

    // Contacts belong to a site; searching a name jumps to that site record.
    (s.contacts || []).forEach((ct, i) => {
      out.push({
        group: "Contacts", id: `contact-${s.id}-${i}`, title: ct.name || "Unnamed contact",
        subtitle: [ct.role, ct.phone, ct.email, s.name].filter(Boolean).join(" \u00b7 "),
        haystack: [ct.name, ct.role, ct.phone, ct.email, s.name].filter(Boolean).join(" "),
        nav: { type: "site", siteId: s.id },
      });
    });
  });

  cabinets.forEach((cab) => {
    const site = siteById[cab.siteId];
    out.push({
      group: "Racks", id: `cab-${cab.id}`, title: cab.name,
      subtitle: [site?.name, cab.location, cab.category, `${cab.size}U`].filter(Boolean).join(" \u00b7 "),
      haystack: [cab.name, cab.location, cab.category, site?.name].filter(Boolean).join(" "),
      nav: { type: "cabinet", cabinetId: cab.id },
    });

    (cab.components || []).forEach((comp) => {
      out.push({
        group: "Components", id: `comp-${comp.id}`, title: comp.name,
        subtitle: [COMPONENT_TYPES[comp.type]?.label, comp.manufacturer, comp.model, `${cab.name}${site ? " \u00b7 " + site.name : ""}`]
          .filter(Boolean).join(" \u00b7 "),
        haystack: [comp.name, comp.manufacturer, comp.model, comp.serial, comp.mac, comp.notes, COMPONENT_TYPES[comp.type]?.label, cab.name]
          .filter(Boolean).join(" "),
        nav: { type: "component", cabinetId: cab.id, compId: comp.id },
      });

      // Port labels are often where the real answer lives — "Room 204 drop"
      // is what a tech actually remembers, not the panel it landed on.
      (comp.ports || []).filter((p) => !p.absent).forEach((p) => {
        const bits = [p.label, p.device, p.vlan ? `VLAN ${p.vlan}` : null, p.destination, p.notes].filter(Boolean);
        if (!bits.length) return;
        out.push({
          group: "Ports", id: `port-${comp.id}-${p.kind || "data"}-${p.n}`,
          title: p.label || p.device || p.destination || `Port ${p.n}`,
          subtitle: `${comp.name} \u00b7 ${p.kind === "sfp" ? "SFP" : "Port"} ${p.n}${cab.name ? " \u00b7 " + cab.name : ""}`,
          haystack: [...bits, comp.name, cab.name, `port ${p.n}`].join(" "),
          nav: { type: "component", cabinetId: cab.id, compId: comp.id },
        });
      });
    });
  });

  (library || []).forEach((t) => {
    out.push({
      group: "Components", id: `lib-${t.id}`, title: t.name || t.model || "Template",
      subtitle: ["Library template", t.manufacturer, t.model].filter(Boolean).join(" \u00b7 "),
      haystack: [t.name, t.manufacturer, t.model, COMPONENT_TYPES[t.type]?.label].filter(Boolean).join(" "),
      nav: { type: "library" },
    });
  });

  return out;
}

// Scores matches so exact and prefix hits float above mid-string ones.
function searchIndex(index, query, limit = 40) {
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const terms = q.split(/\s+/);
  const scored = [];
  index.forEach((entry) => {
    const hay = `${entry.title} ${entry.subtitle} ${entry.haystack}`.toLowerCase();
    if (!terms.every((t) => hay.includes(t))) return;
    const title = entry.title.toLowerCase();
    let score = 0;
    if (title === q) score += 100;
    else if (title.startsWith(q)) score += 60;
    else if (title.includes(q)) score += 30;
    score -= SEARCH_GROUP_ORDER.indexOf(entry.group);
    scored.push({ ...entry, score });
  });
  scored.sort((a, b) => b.score - a.score || a.title.localeCompare(b.title));
  return scored.slice(0, limit);
}

// ---------- App ----------

function FieldPulseApp() {
  // IndexedDB is async, so state starts empty and fills in after the first
  // read. `hydrated` gates rendering and — importantly — gates the save
  // effect, so the empty initial state is never written over real data.
  const [hydrated, setHydrated] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [cabinets, setCabinets] = useState([]);
  const [library, setLibrary] = useState(seedLibrary);
  const [sites, setSites] = useState([]);
  const [clients, setClients] = useState([]);
  const [view, setView] = useState("dashboard"); // dashboard | rack | site-builder
  const [activeCabinetId, setActiveCabinetId] = useState(null);
  const [activeClientId, setActiveClientId] = useState(null);
  const [activeSiteId, setActiveSiteId] = useState(null);
  const [activeBuildingId, setActiveBuildingId] = useState(null);
  const [editingTemplateId, setEditingTemplateId] = useState(null);
  const [newTemplateType, setNewTemplateType] = useState(null);
  const [menuOpen, setMenuOpen] = useState(false);
  const [showNewCabinet, setShowNewCabinet] = useState(false);
  const [refreshKey, setRefreshKey] = useState(0);
  const [saveStatus, setSaveStatus] = useState("idle"); // idle | saving | saved | error | migrated
  const [saveError, setSaveError] = useState(null);
  const [storageEstimate, setStorageEstimate] = useState(null);
  // Per-type colour overrides, keyed by component type -> preset id.
  const [typeColors, setTypeColors] = useState({});
  const [lightboxShot, setLightboxShot] = useState(null);
  const [showExcelImport, setShowExcelImport] = useState(false);
  const [presets, setPresets] = useState([]);

  // Commit a previewed spreadsheet import. Existing sites are merged into
  // rather than replaced, so re-importing an updated sheet doesn't wipe
  // buildings, racks or contacts already recorded in the field.
  const applyExcelImport = (result) => {
    const clientIdByName = {};
    setClients((prev) => {
      const next = [...prev];
      result.plan.forEach((p) => {
        if (!p.clientName) return;
        const key = p.clientName.trim().toLowerCase();
        const found = next.find((c) => c.name.trim().toLowerCase() === key);
        if (found) { clientIdByName[key] = found.id; return; }
        const created = { id: nextId("client"), userId: currentUserId, name: p.clientName.trim(), notes: "" };
        next.push(created);
        clientIdByName[key] = created.id;
      });
      return next;
    });

    setSites((prev) => {
      const next = [...prev];
      result.plan.forEach((p) => {
        const clientId = p.clientName ? clientIdByName[p.clientName.trim().toLowerCase()] || null : null;
        const newContacts = p.contacts.map((c) => ({ id: nextId("contact"), ...c }));
        const newBuildings = p.buildings.map((bn, i) => ({
          id: nextId("bldg"), number: String(i + 1), name: bn, description: "", photo: null,
        }));

        const idx = next.findIndex((s) => s.id === p.existingId);
        if (idx >= 0) {
          const s = next[idx];
          // Only fill blanks on an existing site; never overwrite good data.
          next[idx] = {
            ...s,
            name: s.name || p.name,
            code: s.code || p.code,
            address: s.address || p.address,
            city: s.city || p.city,
            state: s.state || p.state,
            zip: s.zip || p.zip,
            clientId: s.clientId || clientId,
            contacts: [
              ...(s.contacts || []),
              // Don't duplicate a contact that's already recorded.
              ...newContacts.filter((nc) =>
                !(s.contacts || []).some(
                  (ec) =>
                    (ec.email && nc.email && ec.email.toLowerCase() === nc.email.toLowerCase()) ||
                    (ec.name || "").trim().toLowerCase() === nc.name.trim().toLowerCase()
                )
              ),
            ],
            buildings: [
              ...(s.buildings || []),
              ...newBuildings.filter((nb) =>
                !(s.buildings || []).some((eb) => (eb.name || "").trim().toLowerCase() === nb.name.trim().toLowerCase())
              ),
            ],
          };
        } else {
          next.push({
            id: nextId("site"),
            userId: currentUserId,
            clientId,
            name: p.name, code: p.code,
            address: p.address, city: p.city, state: p.state, zip: p.zip,
            snapshot: null,
            buildings: newBuildings,
            contacts: newContacts,
          });
        }
      });
      return next;
    });

    setShowExcelImport(false);
  };

  // Register the app-level opener so any photo anywhere can raise the
  // lightbox without threading a callback down through the tree.
  useEffect(() => {
    lightboxOpener = setLightboxShot;
    return () => { lightboxOpener = null; };
  }, []);
  const [currentUserId, setCurrentUserId] = useState(USERS[0].id);
  const importInputRef = useRef(null);

  // The in-progress site buildout wizard. null until "Build It!" is pressed.
  const [buildFlow, setBuildFlow] = useState(null);

  // Any navigation closes the nav menu. Menu items already close it on
  // click, but views also change from search results, breadcrumbs and the
  // back button — this catches all of them in one place.
  useEffect(() => { setMenuOpen(false); }, [view]);

  // Keep the renderer-facing colour map in step with state. useLayoutEffect
  // so it lands before children paint and there's no one-frame flash of the
  // old palette after a change.
  useLayoutEffect(() => { setTypeColorOverrides(typeColors); }, [typeColors]);

  // ---- Hydrate from IndexedDB once on mount ----
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const { data, source } = await loadSavedData();
      if (cancelled) return;
      setCabinets(data.cabinets || []);
      setLibrary(data.library || seedLibrary);
      setSites(data.sites || []);
      setClients(data.clients || []);
      setCurrentUserId(data.currentUserId || USERS[0].id);
      setTypeColors(data.typeColors || {});
      setPresets(data.presets || []);
      setTypeColorOverrides(data.typeColors || {});
      setHydrated(true);
      if (source === "migrated") setSaveStatus("migrated");
      // Ask to be exempt from automatic eviction. Best-effort; on a desktop
      // browser with the app used regularly this is normally granted.
      requestPersistence();
      getStorageEstimate().then((est) => !cancelled && setStorageEstimate(est));
    })();
    return () => { cancelled = true; };
  }, []);

  // ---- Auto-save ----
  // Debounced so a burst of edits (dragging, bulk tagging) writes once
  // rather than serializing the whole dataset on every keystroke. Failures
  // are surfaced in the UI: a save that silently fails is how a day's field
  // work disappears.
  useEffect(() => {
    if (!hydrated) return; // never write the pre-load empty state
    setSaveStatus("saving");
    const t = setTimeout(async () => {
      try {
        await idbSet(DB_KEY, { cabinets, library, sites, clients, currentUserId, typeColors, presets, savedAt: Date.now() });
        setSaveStatus("saved");
        setSaveError(null);
        getStorageEstimate().then(setStorageEstimate);
        setTimeout(() => setSaveStatus((s) => (s === "saved" ? "idle" : s)), 1500);
      } catch (e) {
        console.error("Save failed:", e);
        setSaveStatus("error");
        setSaveError(e?.message || "Could not save");
      }
    }, 400);
    return () => clearTimeout(t);
  }, [hydrated, cabinets, library, sites, clients, currentUserId, typeColors, presets]);

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ cabinets, library, sites, clients, currentUserId, typeColors, presets }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `fieldpulse-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  };

  const importData = (file) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (data.cabinets) setCabinets(migrateConnections(data.cabinets));
        if (data.library) setLibrary(data.library);
        if (data.sites) setSites(data.sites);
        if (data.clients) setClients(data.clients);
        if (data.currentUserId) setCurrentUserId(data.currentUserId);
        if (data.typeColors) setTypeColors(data.typeColors);
        if (data.presets) setPresets(data.presets);
      } catch (e) {
        alert("Couldn't read that file — make sure it's a Field Pulse backup JSON file.");
      }
    };
    reader.readAsText(file);
  };

  const handleRefresh = () => {
    // Restores the baked-in field data rather than blanking everything, so
    // Reset is a way back to a known-good state instead of a data wipe.
    const base = freshSeed();
    setCabinets(base.cabinets || []);
    setLibrary(base.library || seedLibrary);
    setSites(base.sites || []);
    setClients(base.clients || []);
    setView("dashboard");
    setActiveCabinetId(null);
    setActiveClientId(null);
    setActiveSiteId(null);
    setActiveBuildingId(null);
    setMenuOpen(false);
    setShowNewCabinet(false);
    setBuildFlow(null);
    setRefreshKey(k => k + 1);
    // The auto-save effect writes the restored state through to IndexedDB,
    // so there's nothing to clear by hand here.
  };

  const activeCabinet = cabinets.find((c) => c.id === activeCabinetId);

  // Every edit to a rack stamps it, so the top bar can always show when the
  // documentation was last touched — useful when several techs work the
  // same site and you need to know if what you're looking at is current.
  const updateCabinet = (id, updater) => {
    setCabinets((prev) =>
      prev.map((c) => (c.id === id ? { ...updater(c), lastModified: Date.now() } : c))
    );
  };

  const openCabinet = (id) => {
    setActiveCabinetId(id);
    setView("rack");
  };

  const openSite = (id) => {
    setActiveSiteId(id);
    // Keep the client context in sync so "back" from a site returns to the
    // client that owns it rather than jumping to the dashboard.
    const s = sites.find((x) => x.id === id);
    if (s?.clientId) setActiveClientId(s.clientId);
    setView("site-detail");
  };

  const openClient = (id) => {
    setActiveClientId(id);
    setView("client-detail");
  };

  const saveClientRecord = (client) => {
    const id = nextId("client");
    setClients((prev) => [...prev, { id, userId: currentUserId, name: "", notes: "", ...client }]);
    return id;
  };

  const updateClientRecord = (id, updater) => {
    setClients((prev) => prev.map((c) => (c.id === id ? updater(c) : c)));
  };

  // Deleting a client leaves its sites intact but unassigns them, so no
  // field data is ever silently destroyed by a client-level delete.
  const deleteClientRecord = (id) => {
    setClients((prev) => prev.filter((c) => c.id !== id));
    setSites((prev) => prev.map((s) => (s.clientId === id ? { ...s, clientId: null } : s)));
    if (activeClientId === id) setActiveClientId(null);
  };

  const openBuilding = (id) => {
    setActiveBuildingId(id);
    setView("building-detail");
  };

  const openSiteEdit = () => {
    setView("site-edit");
  };

  const goHome = () => {
    setView("dashboard");
    setActiveCabinetId(null);
    setActiveSiteId(null);
    setActiveClientId(null);
    setActiveBuildingId(null);
    setBuildFlow(null);
  };

  // Context-aware "back" — steps up one level instead of always jumping
  // all the way to the dashboard, so drilling into Site → Building → Rack
  // and back feels like real navigation instead of a hard reset.
  const goBack = () => {
    if (view === "rack") {
      setActiveCabinetId(null);
      setView(activeSiteId ? "site-detail" : "dashboard");
      return;
    }
    if (view === "building-detail") {
      setActiveBuildingId(null);
      setView("site-detail");
      return;
    }
    if (view === "site-edit") {
      setView("site-detail");
      return;
    }
    if (view === "component-designer") {
      setView("component-library");
      return;
    }
    if (view === "component-library") {
      setView("dashboard");
      return;
    }
    if (view === "cabinet-presets") {
      setView("dashboard");
      return;
    }
    if (view === "contacts-directory") {
      setView("dashboard");
      return;
    }
    if (view === "sites-directory") {
      setView("dashboard");
      return;
    }
    if (view === "clients-directory") {
      setView("dashboard");
      return;
    }
    if (view === "client-detail") {
      setActiveClientId(null);
      setView("clients-directory");
      return;
    }
    if (view === "site-detail") {
      // Step up to the owning client when there is one, so the hierarchy
      // Client → Site → Building → Rack unwinds one level at a time.
      const owner = sites.find((s) => s.id === activeSiteId)?.clientId;
      setActiveSiteId(null);
      if (owner) {
        setActiveClientId(owner);
        setView("client-detail");
      } else {
        setView("dashboard");
      }
      return;
    }
    goHome();
  };

  // Optionally pre-bound to a client, so "Add Site" from inside a client
  // record starts the wizard already filed under that client.
  const startBuild = (clientId = null) => {
    // Derive from the highest code already in use rather than the site
    // count: after deleting a site, a count-based code would collide with
    // an existing one and two sites would share a reference number.
    const highest = sites.reduce((max, s) => {
      const m = /^LOC-(\d+)$/.exec((s.code || "").trim());
      return m ? Math.max(max, parseInt(m[1], 10)) : max;
    }, 0);
    const nextCode = `LOC-${String(highest + 1).padStart(4, "0")}`;
    setBuildFlow({
      step: "site",
      maxStepIndex: 0,
      siteSaved: false,
      site: {
        code: nextCode, name: "", address: "", city: "", state: "", zip: "",
        snapshot: null, clientId: clientId || activeClientId || null,
      },
      buildings: [],
      racks: [],
    });
    setView("site-builder");
  };

  const saveSiteRecord = (site) => {
    const id = nextId("site");
    setSites((prev) => [...prev, { id, ...site, buildings: [], contacts: [], userId: currentUserId }]);
    return id;
  };

  const updateSiteRecord = (id, updater) => {
    // Stamp the edit so "Recently Worked On" reflects actual activity
    // rather than creation order.
    setSites((prev) => prev.map((s) => (s.id === id ? { ...updater(s), lastModified: Date.now() } : s)));
  };

  // Deleting a site takes its racks with it — they can't exist without a
  // parent site — so the confirm copy upstream spells that out.
  const deleteSiteRecord = (id) => {
    const owner = sites.find((s) => s.id === id)?.clientId || null;
    setSites((prev) => prev.filter((s) => s.id !== id));
    setCabinets((prev) => prev.filter((c) => c.siteId !== id));
    setActiveSiteId(null);
    setActiveBuildingId(null);
    setActiveCabinetId(null);
    if (owner) {
      setActiveClientId(owner);
      setView("client-detail");
    } else {
      setView("dashboard");
    }
  };

  const finishBuild = () => {
    // The Site record was already saved when Step 1's Continue was clicked;
    // buildings stay in sync as they're edited. All that's left here is
    // turning each Network Rack into a real Cabinet record.
    const newCabinets = buildFlow.racks.map((r) => {
      const bldg = buildFlow.buildings.find((b) => b.id === r.buildingId);
      return {
        id: nextId("cab"),
        name: r.name,
        siteId: buildFlow.site.id,
        buildingId: r.buildingId,
        location: bldg ? (bldg.name || `Bldg ${bldg.number}`) : buildFlow.site.name,
        category: r.category || "IT-MDF",
        owner: "",
        serviceTeam: "",
        rackType: r.rackType,
        size: r.size,
        features: [],
        photo: null,
        components: [],
        connections: [],
      };
    });
    setCabinets((prev) => [...prev, ...newCabinets]);

    setBuildFlow(null);
    setView("dashboard");
  };

  const [globalQuery, setGlobalQuery] = useState("");
  const [focusComponentId, setFocusComponentId] = useState(null);

  // Rebuilt only when the underlying data changes, not on every keystroke.
  const searchIdx = useMemo(
    () => buildSearchIndex({
      clients: clients.filter((c) => c.userId === currentUserId),
      sites: sites.filter((s) => s.userId === currentUserId),
      cabinets,
      library,
    }),
    [clients, sites, cabinets, library, currentUserId]
  );

  const globalResults = useMemo(() => searchIndex(searchIdx, globalQuery), [searchIdx, globalQuery]);

  const handleSearchNavigate = (nav) => {
    setGlobalQuery("");
    if (nav.type === "client") { setActiveClientId(nav.clientId); setView("client-detail"); return; }
    if (nav.type === "site") { openSite(nav.siteId); return; }
    if (nav.type === "building") {
      setActiveSiteId(nav.siteId);
      setActiveBuildingId(nav.buildingId);
      setView("building-detail");
      return;
    }
    if (nav.type === "cabinet") { setFocusComponentId(null); openCabinet(nav.cabinetId); return; }
    if (nav.type === "component") {
      // Land on the rack and pop the component's sheet open, so a search
      // for a serial number goes straight to that unit's record.
      setFocusComponentId(nav.compId);
      openCabinet(nav.cabinetId);
      return;
    }
    if (nav.type === "library") { setView("component-library"); return; }
  };
  const activeSite = sites.find((s) => s.id === activeSiteId);
  const mySites = sites.filter((s) => s.userId === currentUserId);
  const myClients = clients.filter((c) => c.userId === currentUserId);
  const activeClient = clients.find((c) => c.id === activeClientId);
  const activeBuilding = activeSite?.buildings?.find((b) => b.id === activeBuildingId);

  const topBarTitle =
    view === "rack" ? activeCabinet?.name :
    view === "site-builder" ? (buildFlow?.site?.name || "New Site") :
    view === "site-detail" ? activeSite?.name :
    view === "site-edit" ? `Editing ${activeSite?.name || ""}` :
    view === "component-library" ? "Components" :
    view === "cabinet-presets" ? "Standard Cabinets" :
    view === "contacts-directory" ? "Contacts" :
    view === "sites-directory" ? "Sites" :
    view === "clients-directory" ? "Clients" :
    view === "client-detail" ? activeClient?.name :
    view === "component-designer" ? "Component Designer" :
    view === "building-detail" ? (activeBuilding?.name || `Bldg ${activeBuilding?.number || ""}`) :
    undefined;

  const showBuildNav = view === "site-builder" && buildFlow?.siteSaved;

  // Hold rendering until the database read completes. Rendering an empty app
  // first would flash "no racks" and, worse, invite an edit against state
  // that's about to be replaced.
  if (!hydrated) {
    return (
      <div className="min-h-screen bg-white flex flex-col items-center justify-center gap-3 font-sans">
        <div className="w-8 h-8 border-2 border-gray-200 border-t-orange-500 rounded-full animate-spin" />
        <div className="text-sm text-gray-500">Loading your data...</div>
        {loadError && (
          <div className="text-xs text-red-600 max-w-xs text-center px-6">{loadError}</div>
        )}
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-white flex font-sans">
      <ImageLightbox shot={lightboxShot} onClose={() => setLightboxShot(null)} />
      {showExcelImport && (
        <ExcelImportSheet
          sites={sites}
          clients={clients}
          currentUserId={currentUserId}
          onClose={() => setShowExcelImport(false)}
          onApply={applyExcelImport}
        />
      )}
      <div className="flex-1 min-w-0 flex flex-col">
        {/* A failed save must never be quiet — this is the difference between
            noticing now and losing a day's work. */}
        {saveStatus === "error" && (
          <div className="bg-red-600 text-white px-4 py-2.5 text-xs font-semibold flex items-center justify-between gap-3">
            <span className="min-w-0">
              Not saving: {saveError || "storage error"}. Export a backup now to avoid losing work.
            </span>
            <button
              onClick={exportData}
              className="shrink-0 bg-white text-red-700 rounded-md px-2.5 py-1 font-bold hover:bg-red-50"
            >
              Export backup
            </button>
          </div>
        )}
        <TopNav
          view={view}
          cabinetName={topBarTitle}
          onBack={goBack}
          menuOpen={menuOpen}
          setMenuOpen={setMenuOpen}
          onGoHome={goHome}
          onRefresh={handleRefresh}
          searchQuery={globalQuery}
          onSearchChange={setGlobalQuery}
          searchResults={globalResults}
          onSearchNavigate={handleSearchNavigate}
          onExport={exportData}
          onImportClick={() => importInputRef.current?.click()}
          saveStatus={saveStatus}
          storageEstimate={storageEstimate}
          onImportExcel={() => setShowExcelImport(true)}
          currentUserId={currentUserId}
          onSwitchUser={setCurrentUserId}
          lastModified={view === "rack" ? (activeCabinet?.lastModified || 0) : null}
          activeCabinetId={activeCabinetId}
          siblingCabinets={
            view === "rack" && activeCabinet
              ? cabinets
                  .filter((c) => c.siteId === activeCabinet.siteId)
                  .sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }))
              : null
          }
          onSelectCabinet={openCabinet}
          onSelectMenuItem={(item) => {
            if (item === "Components") setView("component-library");
            if (item === "Standards") setView("cabinet-presets");
            if (item === "Contacts") setView("contacts-directory");
            if (item === "Sites") setView("sites-directory");
            if (item === "Clients") { setActiveClientId(null); setView("clients-directory"); }
          }}
        />
        <input
          ref={importInputRef}
          type="file"
          accept="application/json"
          className="hidden"
          onChange={(e) => {
            const file = e.target.files?.[0];
            if (file) importData(file);
            e.target.value = "";
          }}
        />

        {showBuildNav && (
          <BuildStepsTabs buildFlow={buildFlow} setBuildFlow={setBuildFlow} />
        )}

        {view === "dashboard" && (
          <Dashboard
            sites={mySites}
            cabinets={cabinets}
            clients={myClients}
            onOpenSite={openSite}
            onOpenClient={openClient}
            onViewAllClients={() => { setActiveClientId(null); setView("clients-directory"); }}
            onBuildIt={() => startBuild(null)}
            query=""
          />
        )}

        {view === "site-detail" && activeSite && (
          <SiteDetailView
            site={activeSite}
            client={clients.find((c) => c.id === activeSite.clientId) || null}
            onOpenClient={openClient}
            cabinets={cabinets.filter((c) => c.siteId === activeSite.id)}
            onOpenCabinet={openCabinet}
            onOpenBuilding={openBuilding}
            onEdit={openSiteEdit}
            onSaveContacts={(contacts) => updateSiteRecord(activeSite.id, (s) => ({ ...s, contacts }))}
          />
        )}

        {view === "site-edit" && activeSite && (
          <SiteEditView
            site={activeSite}
            cabinets={cabinets.filter((c) => c.siteId === activeSite.id)}
            clients={myClients}
            onSaveClientId={(clientId) => {
              updateSiteRecord(activeSite.id, (s) => ({ ...s, clientId }));
              setActiveClientId(clientId);
            }}
            onSaveBuildings={(buildings) => updateSiteRecord(activeSite.id, (s) => ({ ...s, buildings }))}
            onSaveCabinets={(nextForSite) =>
              setCabinets((prev) => [...prev.filter((c) => c.siteId !== activeSite.id), ...nextForSite])
            }
            onSaveSnapshot={(snapshot) => updateSiteRecord(activeSite.id, (s) => ({ ...s, snapshot }))}
            onDeleteSite={() => deleteSiteRecord(activeSite.id)}
            onDone={() => setView("site-detail")}
          />
        )}

        {view === "component-library" && (
          <ComponentLibraryView
            library={library}
            onNew={(type) => { setEditingTemplateId(null); setNewTemplateType(type); setView("component-designer"); }}
            onEdit={(id) => { setEditingTemplateId(id); setView("component-designer"); }}
            onDelete={(id) => setLibrary((prev) => prev.filter((t) => t.id !== id))}
            typeColors={typeColors}
            onSetTypeColor={(type, toneId) =>
              setTypeColors((prev) => {
                const next = { ...prev };
                // A null tone means "back to the built-in default", so drop
                // the key rather than storing an empty override.
                if (toneId) next[type] = toneId;
                else delete next[type];
                return next;
              })
            }
            onResetTypeColors={() => setTypeColors({})}
          />
        )}

        {view === "cabinet-presets" && (
          <CabinetPresetsView
            presets={presets}
            setPresets={setPresets}
            library={library}
            setLibrary={setLibrary}
            onBack={goHome}
          />
        )}

        {view === "contacts-directory" && (
          <ContactsDirectoryView sites={mySites} onOpenSite={openSite} />
        )}

        {view === "sites-directory" && (
          <SitesDirectoryView sites={mySites} clients={myClients} onOpenSite={openSite} />
        )}

        {view === "clients-directory" && (
          <ClientsDirectoryView
            clients={myClients}
            sites={mySites}
            cabinets={cabinets}
            onOpenClient={openClient}
            onCreateClient={saveClientRecord}
          />
        )}

        {view === "client-detail" && activeClient && (
          <ClientDetailView
            client={activeClient}
            sites={mySites.filter((s) => s.clientId === activeClient.id)}
            cabinets={cabinets}
            onOpenSite={openSite}
            onAddSite={() => startBuild(activeClient.id)}
            onSaveClient={(patch) => updateClientRecord(activeClient.id, (c) => ({ ...c, ...patch }))}
            onDeleteClient={() => { deleteClientRecord(activeClient.id); setView("clients-directory"); }}
          />
        )}

        {view === "component-designer" && (
          <ComponentDesignerView
            template={library.find((t) => t.id === editingTemplateId) || null}
            initialType={newTemplateType}
            library={library}
            onSave={(tpl) => {
              setLibrary((prev) => {
                const exists = prev.some((t) => t.id === tpl.id);
                return exists ? prev.map((t) => (t.id === tpl.id ? tpl : t)) : [...prev, tpl];
              });
              setNewTemplateType(null);
              setView("component-library");
            }}
            onCancel={() => { setNewTemplateType(null); setView("component-library"); }}
          />
        )}

        {view === "building-detail" && activeSite && activeBuilding && (
          <BuildingDetailView
            building={activeBuilding}
            cabinets={cabinets.filter((c) => c.buildingId === activeBuilding.id)}
            onOpenCabinet={openCabinet}
          />
        )}

        {view === "site-builder" && buildFlow && (
          <SiteBuilder
            buildFlow={buildFlow}
            setBuildFlow={setBuildFlow}
            onFinish={finishBuild}
            onSaveSite={saveSiteRecord}
            onUpdateSite={updateSiteRecord}
            clients={myClients}
            onCreateClient={saveClientRecord}
          />
        )}

        {view === "rack" && activeCabinet && (
          <RackBuilder
            cabinet={activeCabinet}
            allCabinets={cabinets}
            library={library}
            setLibrary={setLibrary}
            onUpdate={(updater) => updateCabinet(activeCabinet.id, updater)}
            site={sites.find((s) => s.id === activeCabinet.siteId) || null}
            client={(() => {
              const s = sites.find((x) => x.id === activeCabinet.siteId);
              return s ? clients.find((c) => c.id === s.clientId) || null : null;
            })()}
            presets={presets}
            onUpdateSite={(patch) =>
              activeCabinet.siteId && updateSiteRecord(activeCabinet.siteId, (s) => ({ ...s, ...patch }))
            }
            focusComponentId={focusComponentId}
            onFocusHandled={() => setFocusComponentId(null)}
          />
        )}

        {showNewCabinet && (
          <NewCabinetSheet
            onClose={() => setShowNewCabinet(false)}
            onCreate={(data) => {
              const cab = {
                id: nextId("cab"),
                components: [],
                connections: [],
                photo: null,
                ...data,
              };
              setCabinets((prev) => [...prev, cab]);
              setShowNewCabinet(false);
            }}
          />
        )}
      </div>
    </div>
  );
}

// ---------- Left navigation rail ----------

const BUILD_STEPS = [
  { id: "site", label: "Site" },
  { id: "buildings", label: "Buildings" },
  { id: "racks", label: "Network Racks" },
  { id: "components", label: "Components" },
];

function BuildStepsTabs({ buildFlow, setBuildFlow }) {
  const currentIndex = BUILD_STEPS.findIndex((s) => s.id === buildFlow.step);
  const maxIndex = buildFlow.maxStepIndex ?? 0;
  const isReachable = (idx) => idx <= maxIndex;

  return (
    <div className="bg-gray-100 border-b border-gray-200 px-3 pt-2 flex items-end gap-1 overflow-x-auto">
      {BUILD_STEPS.map((step, idx) => {
        const reached = isReachable(idx);
        const active = step.id === buildFlow.step;
        const complete = reached && idx !== currentIndex;
        return (
          <button
            key={step.id}
            disabled={!reached}
            onClick={() => reached && setBuildFlow((prev) => ({ ...prev, step: step.id }))}
            className={`flex items-center gap-1.5 px-4 py-2.5 text-sm font-medium rounded-t-lg border border-b-0 whitespace-nowrap transition-colors ${
              active
                ? "bg-white text-gray-900 border-gray-200 relative top-px"
                : reached
                ? "bg-gray-100 text-gray-500 border-transparent hover:bg-gray-200"
                : "bg-gray-100 text-gray-300 border-transparent cursor-not-allowed"
            }`}
          >
            {complete && <Check size={13} className="text-orange-500" />}
            {step.label}
          </button>
        );
      })}
    </div>
  );
}

// Recent edits read better as "12m ago" — that's what you want when
// checking whether the rack in front of you is already documented. Past a
// day it flips to an actual date, since "31d ago" is harder to reason about
// than "Jul 2".
function formatLastModified(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "Just now";
  if (min < 60) return `${min}m ago`;
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d ago`;
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) +
    ", " + d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
}

// Phone-width version: no room for a full date string next to the icons.
function formatLastModifiedShort(ts) {
  if (!ts) return "";
  const diff = Date.now() - ts;
  const min = Math.floor(diff / 60000);
  if (min < 1) return "now";
  if (min < 60) return `${min}m`;
  const hrs = Math.floor(min / 60);
  if (hrs < 24) return `${hrs}h`;
  const days = Math.floor(hrs / 24);
  if (days < 7) return `${days}d`;
  return new Date(ts).toLocaleDateString(undefined, { month: "numeric", day: "numeric" });
}

function Dashboard({ sites, cabinets = [], clients, onOpenSite, onOpenClient, onViewAllClients, onBuildIt, query }) {
  const q = (query || "").toLowerCase();

  // Recency means the last time anything at the site changed — including a
  // rack edit, which is what you actually spend the day doing. Ranking by
  // array position only told you what was created last.
  const recentSites = useMemo(() => {
    const rackTouch = {};
    const rackName = {};
    cabinets.forEach((c) => {
      const t = c.lastModified || 0;
      if (t > (rackTouch[c.siteId] || 0)) {
        rackTouch[c.siteId] = t;
        rackName[c.siteId] = c.name;
      }
    });
    return sites
      .filter((s) => `${s.name} ${s.city} ${s.state} ${s.code}`.toLowerCase().includes(q))
      .map((s, i) => ({
        site: s,
        // Fall back to array order so sites with no timestamp yet still
        // rank sensibly instead of all colliding at zero.
        touched: Math.max(s.lastModified || 0, rackTouch[s.id] || 0),
        order: i,
        viaRack: (rackTouch[s.id] || 0) > (s.lastModified || 0) ? rackName[s.id] : null,
      }))
      .sort((a, b) => (b.touched - a.touched) || (b.order - a.order))
      .slice(0, 4);
  }, [sites, cabinets, q]);

  const matchingClients = (clients || [])
    .filter((c) => `${c.name}`.toLowerCase().includes(q))
    .slice(0, 6);

  return (
    <div className="flex-1 px-4 py-4 max-w-3xl w-full mx-auto">
      <button
        onClick={onBuildIt}
        className="w-full mb-5 bg-orange-500 hover:bg-orange-600 active:bg-orange-700 text-white font-bold text-lg tracking-tight rounded-xl py-4 flex items-center justify-center gap-2 shadow-sm transition-colors"
      >
        <Activity size={20} />
        Build It!
      </button>

      {/* Clients sit at the top of the hierarchy: Client → Site → Building → Rack */}
      <div className="flex items-center justify-between mb-2 px-1">
        <div className="text-xs font-medium text-gray-400 uppercase tracking-wide">Clients</div>
        <button onClick={onViewAllClients} className="text-xs font-semibold text-orange-600 hover:text-orange-700">
          View all
        </button>
      </div>

      {matchingClients.length > 0 ? (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5 mb-6">
          {matchingClients.map((c) => {
            const count = sites.filter((s) => s.clientId === c.id).length;
            return (
              <button
                key={c.id}
                onClick={() => onOpenClient(c.id)}
                className="text-left bg-white border border-gray-200 rounded-xl p-3 flex items-center gap-3 hover:border-orange-300 hover:shadow-sm transition-all"
              >
                <div className="w-10 h-10 rounded-lg bg-orange-50 border border-orange-100 flex items-center justify-center shrink-0">
                  <Building2 size={17} className="text-orange-500" />
                </div>
                <div className="min-w-0">
                  <div className="text-sm font-semibold text-gray-900 truncate">{c.name}</div>
                  <div className="text-xs text-gray-500">{count} site{count === 1 ? "" : "s"}</div>
                </div>
              </button>
            );
          })}
        </div>
      ) : (
        <button
          onClick={onViewAllClients}
          className="w-full text-center text-sm text-gray-400 py-6 border border-dashed border-gray-200 rounded-xl mb-6 hover:border-orange-300 hover:text-orange-500"
        >
          {(clients || []).length === 0 ? "No clients yet — tap to add one." : "No clients match that search."}
        </button>
      )}

      <div className="text-xs font-medium text-gray-400 uppercase tracking-wide mb-2 px-1">Recently Worked On</div>

      {recentSites.length > 0 ? (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          {recentSites.map(({ site: s, touched, viaRack }) => (
            <button
              key={s.id}
              onClick={() => onOpenSite(s.id)}
              className="text-left bg-white border border-gray-200 rounded-xl p-3 flex items-center gap-3 hover:border-orange-300 hover:shadow-sm transition-all"
            >
              {s.snapshot ? (
                <img src={s.snapshot} alt={s.name} {...zoomable(s.snapshot, s.name)} className="w-12 h-12 rounded-lg object-cover border border-gray-200 shrink-0" />
              ) : (
                <div className="w-12 h-12 rounded-lg bg-gray-50 border border-gray-200 flex items-center justify-center shrink-0">
                  <Building2 size={18} className="text-gray-300" />
                </div>
              )}
              <div className="min-w-0">
                <div className="text-sm font-semibold text-gray-900 truncate">{s.name}</div>
                <div className="text-xs text-gray-500 truncate">
                  {[s.city, s.state].filter(Boolean).join(", ") || s.code}
                </div>
                {touched > 0 && (
                  <div className="text-[11px] text-gray-400 truncate">
                    {viaRack ? `${viaRack} \u00b7 ` : ""}{formatLastModified(touched)}
                  </div>
                )}
              </div>
            </button>
          ))}
        </div>
      ) : (
        <div className="text-center text-sm text-gray-400 py-10 border border-dashed border-gray-200 rounded-xl">
          No sites yet — tap "Build It!" to create your first one.
        </div>
      )}
    </div>
  );
}

// ---------- Clients (top of the hierarchy) ----------
// Client → Site → Building → Cabinet. A client like "Giant Communications"
// owns many sites; each site owns buildings; each building holds racks.

// Rolls up how much work sits under a client, for the summary line on cards.
function clientRollup(clientId, sites, cabinets) {
  const clientSites = sites.filter((s) => s.clientId === clientId);
  const siteIds = new Set(clientSites.map((s) => s.id));
  const buildings = clientSites.reduce((n, s) => n + (s.buildings?.length || 0), 0);
  const racks = cabinets.filter((c) => siteIds.has(c.siteId)).length;
  return { sites: clientSites.length, buildings, racks };
}

// ---------- Site builder (Build It! wizard) ----------

const US_STATES = [
  "AL","AK","AZ","AR","CA","CO","CT","DE","FL","GA","HI","ID","IL","IN","IA",
  "KS","KY","LA","ME","MD","MA","MI","MN","MS","MO","MT","NE","NV","NH","NJ",
  "NM","NY","NC","ND","OH","OK","OR","PA","RI","SC","SD","TN","TX","UT","VT",
  "VA","WA","WV","WI","WY","DC",
];

const US_STATE_NAMES = [
  "Alabama","Alaska","Arizona","Arkansas","California","Colorado","Connecticut","Delaware","Florida","Georgia","Hawaii","Idaho","Illinois","Indiana","Iowa",
  "Kansas","Kentucky","Louisiana","Maine","Maryland","Massachusetts","Michigan","Minnesota","Mississippi","Missouri","Montana","Nebraska","Nevada","New Hampshire","New Jersey",
  "New Mexico","New York","North Carolina","North Dakota","Ohio","Oklahoma","Oregon","Pennsylvania","Rhode Island","South Carolina","South Dakota","Tennessee","Texas","Utah","Vermont",
  "Virginia","Washington","West Virginia","Wisconsin","Wyoming","District of Columbia",
];

const STATE_NAME_TO_ABBR = Object.fromEntries(
  US_STATE_NAMES.map((name, i) => [name.toLowerCase(), US_STATES[i]])
);

const RACK_CATEGORY_OPTIONS = ["IT-MDF", "IT-IDF", "OT-SERVER", "OT-IDF", "SSI"];

function SiteBuilder({ buildFlow, setBuildFlow, onFinish, onSaveSite, onUpdateSite, clients = [], onCreateClient }) {
  const patch = (updater) => setBuildFlow((prev) => ({ ...prev, ...updater(prev) }));
  const stepOrder = BUILD_STEPS.map((s) => s.id);
  const goToStep = (stepId, extra = {}) => {
    const idx = stepOrder.indexOf(stepId);
    setBuildFlow((prev) => ({
      ...prev,
      ...extra,
      step: stepId,
      maxStepIndex: Math.max(prev.maxStepIndex ?? 0, idx),
    }));
  };

  if (buildFlow.step === "site") {
    return (
      <SiteStep
        site={buildFlow.site}
        clients={clients}
        onCreateClient={onCreateClient}
        onChange={(site) => patch(() => ({ site }))}
        onContinue={() => {
          const id = onSaveSite(buildFlow.site);
          goToStep("buildings", { site: { ...buildFlow.site, id }, siteSaved: true });
        }}
      />
    );
  }

  if (buildFlow.step === "buildings") {
    return (
      <BuildingsStep
        buildings={buildFlow.buildings}
        onChange={(buildings) => {
          patch(() => ({ buildings }));
          if (buildFlow.site.id) onUpdateSite(buildFlow.site.id, (s) => ({ ...s, buildings }));
        }}
        onContinue={() => goToStep("racks")}
      />
    );
  }

  if (buildFlow.step === "racks") {
    return (
      <RacksStep
        racks={buildFlow.racks}
        buildings={buildFlow.buildings}
        onChange={(racks) => patch(() => ({ racks }))}
        onContinue={() => goToStep("components")}
      />
    );
  }

  if (buildFlow.step === "components") {
    return <ComponentsStep buildFlow={buildFlow} onFinish={onFinish} />;
  }

  return null;
}

// ---------- Step 1: Site ----------

function SiteStep({ site, onChange, onContinue, clients = [], onCreateClient }) {
  const [addingClient, setAddingClient] = useState(false);
  const [lookupStatus, setLookupStatus] = useState("idle"); // idle | loading | found | notfound
  const [zipStatus, setZipStatus] = useState("idle"); // idle | loading | found | notfound
  const [geoStatus, setGeoStatus] = useState("idle"); // idle | loading | found | error

  // The big Site Name field doubles as a Google-style location reference —
  // typing a recognizable place auto-fills address, city, state, and zip.
  // Uses OpenStreetMap's free Nominatim geocoder (no API key required).
  useEffect(() => {
    if (!site.name || site.name.trim().length < 3) {
      setLookupStatus("idle");
      return;
    }
    setLookupStatus("loading");
    const t = setTimeout(() => {
      fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q=${encodeURIComponent(site.name)}`)
        .then((res) => res.json())
        .then((data) => {
          if (data && data.length > 0) {
            const a = data[0].address || {};
            const street = [a.house_number, a.road].filter(Boolean).join(" ");
            const city = a.city || a.town || a.village || a.hamlet || a.county || "";
            const stateAbbr = STATE_NAME_TO_ABBR[(a.state || "").toLowerCase()] || "";
            const zip = a.postcode || "";
            onChange({
              ...site,
              address: street || site.address,
              city: city || site.city,
              state: stateAbbr || site.state,
              zip: zip || site.zip,
            });
            setLookupStatus("found");
          } else {
            setLookupStatus("notfound");
          }
        })
        .catch(() => setLookupStatus("notfound"));
    }, 700);
    return () => clearTimeout(t);
  }, [site.name]);

  // When City + State are both filled in with something recognized,
  // auto-populate the zip code for that area.
  useEffect(() => {
    if (!site.city || !site.state) {
      setZipStatus("idle");
      return;
    }
    setZipStatus("loading");
    const t = setTimeout(() => {
      fetch(`https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=1&q=${encodeURIComponent(site.city + ", " + site.state)}`)
        .then((res) => res.json())
        .then((data) => {
          const zip = data?.[0]?.address?.postcode;
          if (zip) {
            onChange({ ...site, zip });
            setZipStatus("found");
          } else {
            setZipStatus("notfound");
          }
        })
        .catch(() => setZipStatus("notfound"));
    }, 700);
    return () => clearTimeout(t);
  }, [site.city, site.state]);

  // Use the device's GPS to grab the current address — reverse-geocoded
  // through the same free Nominatim service, no map/API key needed.
  const useMyLocation = () => {
    if (!navigator.geolocation) {
      setGeoStatus("error");
      return;
    }
    setGeoStatus("loading");
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude } = pos.coords;
        fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`)
          .then((res) => res.json())
          .then((data) => {
            const a = data?.address || {};
            const street = [a.house_number, a.road].filter(Boolean).join(" ");
            const city = a.city || a.town || a.village || a.hamlet || a.county || "";
            const stateAbbr = STATE_NAME_TO_ABBR[(a.state || "").toLowerCase()] || "";
            const zip = a.postcode || "";
            onChange({
              ...site,
              address: street || site.address,
              city: city || site.city,
              state: stateAbbr || site.state,
              zip: zip || site.zip,
              lat: latitude,
              lng: longitude,
            });
            setGeoStatus("found");
          })
          .catch(() => setGeoStatus("error"));
      },
      () => setGeoStatus("error"),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  const mapsHref = () => {
    const full = [site.address, site.city, site.state, site.zip].filter(Boolean).join(", ");
    if (full) return `https://www.google.com/maps?q=${encodeURIComponent(full)}`;
    if (site.lat && site.lng) return `https://www.google.com/maps?q=${site.lat},${site.lng}`;
    return null;
  };

  const set = (key) => (e) => onChange({ ...site, [key]: e.target.value });
  const canContinue = site.name.trim().length > 0 && site.city.trim().length > 0 && site.state.trim().length > 0;
  const mapsUrl = mapsHref();

  return (
    <div className="flex-1 px-4 py-6 max-w-4xl w-full mx-auto">
      <div className="flex items-center justify-between mb-2">
        <div className="text-xs font-semibold text-orange-500 uppercase tracking-wide">Step 1 of 4 &middot; Site Details</div>
      </div>

      {/* A site always belongs to a client — this is the top of the
          hierarchy. The code sits alongside it because the two together are
          how a site gets identified on paperwork. */}
      <div className="mb-4 flex flex-col sm:flex-row sm:items-end gap-2">
        <div className="flex-1 min-w-0">
          <label className="block text-xs font-medium text-gray-500 mb-1">Client</label>
          <div className="flex items-center gap-2">
            <select
              value={site.clientId || ""}
              onChange={(e) => onChange({ ...site, clientId: e.target.value || null })}
              className={inputClass}
            >
              <option value="">— No client assigned —</option>
              {clients.map((c) => (
                <option key={c.id} value={c.id}>{c.name}</option>
              ))}
            </select>
            <button
              onClick={() => setAddingClient(true)}
              className="flex items-center gap-1 text-xs font-medium border border-gray-300 rounded-lg px-3 py-2 text-gray-600 hover:bg-gray-50 shrink-0"
            >
              <Plus size={13} /> New
            </button>
          </div>
        </div>
        <div className="w-full sm:w-40 shrink-0">
          <label className="block text-xs font-medium text-gray-500 mb-1">Site code</label>
          <input
            value={site.code || ""}
            onChange={set("code")}
            placeholder="LOC-0001"
            className={`${inputClass} font-mono`}
            title="Auto-generated, but editable if the customer uses their own numbering"
          />
        </div>
      </div>

      <input
        value={site.name}
        onChange={set("name")}
        placeholder="Untitled Site"
        className="text-3xl font-bold text-gray-900 border-b-2 border-gray-200 focus:border-orange-400 outline-none w-full pb-2 mb-1 placeholder:text-gray-300 bg-transparent"
      />

      {addingClient && (
        <ClientEditSheet
          client={null}
          onClose={() => setAddingClient(false)}
          onSave={(data) => {
            const id = onCreateClient(data);
            onChange({ ...site, clientId: id });
            setAddingClient(false);
          }}
        />
      )}
      <div className="mb-6 h-4">
        {lookupStatus === "loading" && <div className="text-xs text-gray-400">Looking up address…</div>}
        {lookupStatus === "found" && <div className="text-xs text-green-600">Recognized — address fields updated below</div>}
        {lookupStatus === "notfound" && <div className="text-xs text-amber-600">No match found — enter the address manually</div>}
      </div>

      <div className="border border-gray-200 rounded-xl p-5 mb-8">
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2 text-gray-500 text-xs font-semibold uppercase tracking-wide">
            <MapPin size={14} /> Site Address
          </div>
          <div className="flex items-center gap-3">
            {mapsUrl && (
              <a
                href={mapsUrl}
                target="_blank"
                rel="noopener noreferrer"
                className="text-xs text-orange-600 hover:text-orange-700 underline"
              >
                Open in Maps &rarr;
              </a>
            )}
            <button
              onClick={useMyLocation}
              className="flex items-center gap-1.5 text-xs font-medium border border-gray-300 rounded-lg px-3 py-1.5 text-gray-600 hover:bg-gray-50"
            >
              <MapPin size={13} />
              {geoStatus === "loading" ? "Locating…" : "Use My Location"}
            </button>
          </div>
        </div>

        {geoStatus === "error" && (
          <div className="text-xs text-amber-600 mb-3">Couldn't get your location — enter the address manually.</div>
        )}
        {geoStatus === "found" && (
          <div className="text-xs text-green-600 mb-3">Location found — fields updated below.</div>
        )}

        <div className="space-y-3">
          <input value={site.address} onChange={set("address")} placeholder="Street address (optional)" className={inputClass} />
          <div className="grid grid-cols-2 gap-3">
            <input value={site.city} onChange={set("city")} placeholder="City" className={inputClass} />
            <div className="grid grid-cols-2 gap-2">
              <select value={site.state} onChange={set("state")} className={inputClass}>
                <option value="">State</option>
                {US_STATES.map((s) => <option key={s} value={s}>{s}</option>)}
              </select>
              <div>
                <input value={site.zip} onChange={set("zip")} placeholder="Zip (optional)" className={inputClass} />
                {zipStatus === "loading" && <div className="text-[10px] text-gray-400 mt-0.5">Looking up zip…</div>}
              </div>
            </div>
          </div>
        </div>
      </div>

      <div className="border border-gray-200 rounded-xl p-5 mb-8">
        <div className="flex items-center gap-2 mb-4 text-gray-500 text-xs font-semibold uppercase tracking-wide">
          <Camera size={14} /> Site Snapshot
        </div>
        <ImageDropZone
          value={site.snapshot}
          onChange={(url) => onChange({ ...site, snapshot: url })}
          captureLabel={site.snapshot ? "Retake snapshot" : "Capture snapshot"}
          hint="Paste a screenshot (Ctrl+V), drop an image, or browse"
        />
      </div>

      <div className="flex items-center justify-end gap-3">
        {!canContinue && (
          <span className="text-xs text-gray-400">Enter a site name, city, and state to continue</span>
        )}
        <button
          disabled={!canContinue}
          onClick={onContinue}
          className="px-5 py-2.5 rounded-lg text-sm font-semibold bg-orange-500 hover:bg-orange-600 text-white disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Continue &rarr;
        </button>
      </div>
    </div>
  );
}

// ---------- Step 2: Buildings ----------


function BuildingsStep({ buildings, onChange, onContinue }) {
  const [editing, setEditing] = useState(null); // null | building

  const handleCountChange = (e) => {
    const n = Number(e.target.value);
    const next = buildings.slice(0, n);
    while (next.length < n) {
      const num = next.length + 1;
      next.push({ id: nextId("bldg"), number: String(num), name: "", description: "", photo: null });
    }
    onChange(next);
  };

  const saveBuilding = (b) => {
    onChange(buildings.map((x) => (x.id === b.id ? b : x)));
    setEditing(null);
  };

  return (
    <div className="flex-1 px-4 py-6 max-w-4xl w-full mx-auto">
      <div className="text-xs font-semibold text-orange-500 uppercase tracking-wide mb-2">Step 2 of 4 &middot; Buildings</div>
      <h2 className="text-2xl font-bold text-gray-900 mb-4">How many buildings are onsite?</h2>

      <select
        value={buildings.length || ""}
        onChange={handleCountChange}
        className={inputClass + " w-40 mb-8"}
      >
        <option value="">Select…</option>
        {Array.from({ length: 20 }, (_, i) => i + 1).map((n) => (
          <option key={n} value={n}>{n}</option>
        ))}
      </select>

      {buildings.length > 0 && (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mb-8">
          {buildings.map((b) => (
            <button
              key={b.id}
              onClick={() => setEditing(b)}
              className="border border-gray-200 rounded-xl overflow-hidden text-left hover:border-orange-300 hover:shadow-sm transition-all flex flex-col"
            >
              {b.photo ? (
                <img src={b.photo} alt={`Building ${b.number}`} {...zoomable(b.photo, `Building ${b.number}`)} className="w-full h-24 object-cover" />
              ) : (
                <div className="w-full h-24 bg-gray-50 flex items-center justify-center">
                  <Building2 size={26} className="text-gray-300" />
                </div>
              )}
              <div className="p-3">
                <div className="flex items-center gap-1.5">

// ---------- Step 3: Network Racks ----------

function RacksStep({ racks, buildings, onChange, onContinue }) {
  const [editing, setEditing] = useState(null); // null | rack

  const handleCountChange = (e) => {
    const n = Number(e.target.value);
    const next = racks.slice(0, n);
    while (next.length < n) {
      const idx = next.length + 1;
      next.push({
        id: nextId("rack"),
        name: `Rack ${idx}`,
        buildingId: buildings[0]?.id || "",
        category: "IT-MDF",
        rackType: "four_post_rack",
        size: 24,
      });
    }
    onChange(next);
  };

  const saveRack = (r) => {
    onChange(racks.map((x) => (x.id === r.id ? r : x)));
    setEditing(null);
  };

  const buildingLabel = (id) => {
    const b = buildings.find((x) => x.id === id);
    return b ? (b.name || `Bldg ${b.number}`) : "—";
  };

  return (
    <div className="flex-1 px-4 py-6 max-w-4xl w-full mx-auto">
      <div className="text-xs font-semibold text-orange-500 uppercase tracking-wide mb-2">Step 3 of 4 &middot; Network Racks</div>
      <h2 className="text-2xl font-bold text-gray-900 mb-4">How many network racks are onsite?</h2>

      <select
        value={racks.length || ""}
        onChange={handleCountChange}
        className={inputClass + " w-40 mb-8"}
      >
        <option value="">Select…</option>
        {Array.from({ length: 20 }, (_, i) => i + 1).map((n) => (
          <option key={n} value={n}>{n}</option>
        ))}
      </select>

      {racks.length > 0 && (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mb-8">
          {racks.map((r) => (
            <button
              key={r.id}
              onClick={() => setEditing(r)}
              className="border border-gray-200 rounded-xl p-4 flex flex-col items-center gap-1.5 hover:border-orange-300 hover:shadow-sm transition-all"
            >
              <Server size={22} className="text-gray-400" />
              <div className="text-sm font-semibold text-gray-900 truncate max-w-full">{r.name}</div>
              <div className="text-xs text-gray-500">{buildingLabel(r.buildingId)} &middot; {r.size}U</div>
            </button>
          ))}
        </div>
      )}

      <div className="flex justify-end">
        <button
          disabled={racks.length === 0}
          onClick={onContinue}
          className="px-5 py-2.5 rounded-lg text-sm font-semibold bg-orange-500 hover:bg-orange-600 text-white disabled:opacity-40 disabled:cursor-not-allowed"
        >
          Continue &rarr;
        </button>
      </div>

      {editing && (
        <RackEditSheet
          rack={editing}
          buildings={buildings}
          onClose={() => setEditing(null)}
          onSave={saveRack}
        />
      )}
    </div>
  );
}

function SitesDirectoryView({ sites, clients = [], onOpenSite }) {
  const [query, setQuery] = useState("");
  const [showFilters, setShowFilters] = useState(false);
  const [stateFilter, setStateFilter] = useState("");
  const [codeFilter, setCodeFilter] = useState("");
  const [clientFilter, setClientFilter] = useState("");

  const clientName = (id) => clients.find((c) => c.id === id)?.name || "";

  const uniqueStates = Array.from(new Set(sites.map((s) => s.state).filter(Boolean))).sort();
  const uniqueCodes = Array.from(new Set(sites.map((s) => s.code).filter(Boolean))).sort();

  const filtered = sites.filter((s) => {
    const haystack = [s.name, s.code, s.address, s.city, s.state, s.zip, clientName(s.clientId)]
      .filter(Boolean).join(" ").toLowerCase();
    const matchesQuery = !query || haystack.includes(query.toLowerCase());
    const matchesState = !stateFilter || s.state === stateFilter;
    const matchesCode = !codeFilter || s.code === codeFilter;
    const matchesClient = !clientFilter || s.clientId === clientFilter;
    return matchesQuery && matchesState && matchesCode && matchesClient;
  });

  const activeFilterCount = (stateFilter ? 1 : 0) + (codeFilter ? 1 : 0) + (clientFilter ? 1 : 0);

  return (
    <div className="flex-1 px-4 py-6 max-w-4xl w-full mx-auto">
      <h2 className="text-xl font-bold text-gray-900 mb-1">All Sites</h2>
      <p className="text-sm text-gray-500 mt-0.5 mb-4">Every site ever created, searchable by any field.</p>

      <div className="flex items-center gap-2 mb-3">
        <div className="relative flex-1">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" />
          <input
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="Search name, code, address, city, state, zip..."
            className="w-full border border-gray-300 rounded-lg pl-9 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-orange-400"
          />
        </div>
        <button
          onClick={() => setShowFilters((v) => !v)}
          className={`flex items-center gap-1.5 border rounded-lg px-3.5 py-2.5 text-sm font-medium shrink-0 ${
            showFilters || activeFilterCount > 0 ? "border-orange-400 bg-orange-50 text-orange-600" : "border-gray-300 text-gray-600 hover:bg-gray-50"
          }`}
        >
          Filters {activeFilterCount > 0 ? `(${activeFilterCount})` : ""}
        </button>
      </div>

      {showFilters && (
        <div className="grid grid-cols-2 gap-3 mb-4 p-3 border border-gray-200 rounded-xl bg-gray-50">
          <Field label="Location ID">
            <select className={inputClass} value={codeFilter} onChange={(e) => setCodeFilter(e.target.value)}>
              <option value="">All</option>
              {uniqueCodes.map((c) => <option key={c} value={c}>{c}</option>)}
            </select>
          </Field>
          <Field label="State">
            <select className={inputClass} value={stateFilter} onChange={(e) => setStateFilter(e.target.value)}>
              <option value="">All</option>
              {uniqueStates.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </Field>
          <div className="col-span-2">
            <Field label="Client">
              <select className={inputClass} value={clientFilter} onChange={(e) => setClientFilter(e.target.value)}>
                <option value="">All clients</option>
                {clients.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </Field>
          </div>
          {activeFilterCount > 0 && (
            <button
              onClick={() => { setStateFilter(""); setCodeFilter(""); setClientFilter(""); }}
              className="col-span-2 text-xs text-gray-500 hover:text-orange-500 text-left"
            >
              Clear filters
            </button>
          )}
        </div>
      )}

      <div className="text-xs font-medium text-gray-400 uppercase tracking-wide mb-2 px-1">
        {filtered.length} site{filtered.length !== 1 ? "s" : ""}
      </div>

      {filtered.length === 0 ? (
        <div className="text-center text-sm text-gray-400 py-16 border border-dashed border-gray-200 rounded-xl">
          {sites.length === 0 ? "No sites created yet." : "No sites match your search or filters."}
        </div>
      ) : (
        <div className="space-y-2.5">
          {filtered.map((s) => (
            <button
              key={s.id}
              onClick={() => onOpenSite(s.id)}
              className="w-full text-left bg-white border border-gray-200 rounded-xl px-4 py-3.5 hover:border-orange-300 hover:shadow-sm transition-all flex items-center gap-3"
            >
              {s.snapshot ? (
                <img src={s.snapshot} alt={s.name} {...zoomable(s.snapshot, s.name)} className="w-11 h-11 rounded-lg object-cover border border-gray-200 shrink-0" />
              ) : (
                <div className="w-11 h-11 rounded-lg bg-gray-50 border border-gray-200 flex items-center justify-center shrink-0">
                  <Building2 size={16} className="text-gray-300" />
                </div>
              )}
              <div className="min-w-0 flex-1">
                {clientName(s.clientId) && (
                  <div className="text-[11px] font-semibold text-orange-600 truncate">{clientName(s.clientId)}</div>
                )}
                <div className="font-semibold text-gray-900 text-sm truncate">{s.name}</div>
                <div className="text-xs text-gray-500 mt-0.5 truncate">
                  {[s.address, s.city, s.state, s.zip].filter(Boolean).join(", ") || "No address on file"}
                </div>
              </div>
              <span className="shrink-0 text-[11px] font-mono font-medium bg-gray-100 text-gray-600 px-2 py-1 rounded-md border border-gray-200">
                {s.code}
              </span>
            </button>
          ))}
        </div>
      )}
    </div>
  );
}
